# Trivy 漏洞豁免清单（`.trivyignore.yaml` 结构化格式）
#
# 用法：由 .github/workflows/ci-cd.yml 的 security-scan 作业显式传入
#   with:
#     trivyignores: .trivyignore.yaml
# ⚠️ 历史（2026-10-08 起已修复）：该作业此前**没有 actions/checkout**（只做 Login→Scan），
#    runner 工作目录为空 ⇒ 本文件在 runner 上不存在、豁免**静默失效**（门禁照旧变红，
#    且看不出原因是"豁免没被读到"）。现已在扫描步骤前补上 `actions/checkout`
#    （ci-cd.yml:1162-1165，fetch-depth: 1）—— 这正是本文件能被 Trivy 读到的**前提**。
#    若将来有人删掉那个 checkout 步骤，本豁免会再次静默失效。
#
# ─────────────────────────────────────────────────────────────────────────────
# 豁免即"风险接受"：每一条都必须写明**为什么不可达 / 为什么无药可升**，
# 以及**什么条件下必须重新评估**。不接受无理由的裸 ID 列表。
# ─────────────────────────────────────────────────────────────────────────────

