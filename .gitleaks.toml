# Gitleaks 配置
#
# 策略：**在 gitleaks 默认规则集之上，只增加"已人工核实过的误报"豁免**，
# 不放宽任何规则、不整体跳过扫描。新增豁免必须写明理由与核实方式。
#
# 核实记录（2026-09-11，gitleaks 8.30.1）：
#   对全历史（238 commit）执行 `gitleaks git .`，命中 5 处，全部为 generic-api-key，
#   命中值长度均为 8 字符且低熵 —— 与真实凭证的形态（AK/SK 20~40 字符、高熵）不符，
#   逐一定位后确认为「文档示例 / 模板占位符 / 脚本占位字符串」，均非凭证。
#
# ⚠️ 2026-09-13 复核：上述「全部为 8 字符低熵占位符」的判断被证伪一处（审计 12-P0-1）。
#   `scripts/import_nacos_configs.py` 第 3 行的命中**不是**占位串，而是 32 字符、含大小写与数字的
#   真实口令（与线上 MYSQL_ROOT_PASSWORD / CONFIG_DB_PASSWORD 逐字节一致）。它之所以被当成误报，
#   恰恰是因为下面按「整文件路径」豁免了该脚本 —— 豁免粒度太粗，把真命中一起掩蔽了。
#   教训：①「命中值很短很低熵」这类判断必须逐条实测，不能凭印象；
#         ② 除非确定某文件永不含真实凭证，否则不要按整文件给豁免。
#
# 注意：下面若还有按 `paths` 给的豁免，那条路径就是「扫描盲区」——真有人在其中写入真实密钥
# 不会被本门禁拦下。这是有意识接受的代价（比放宽规则或整体关闭扫描小得多）；请定期复核。
# ⚠️ 2026-09-16 起：盲区已从「3 处」收敛为「2 处」，且其中一处已按提交（而非整文件）限定：
#   ① `.env.example`（整文件）—— 已实测该文件全部取值为 CHANGE_ME_*/布尔/URL，
#      仅 OSS_BUCKET 与 LOCAL_STORAGE_PATH 有熵，且都是本就公开的非机密标识；
#   ② `scripts/import_nacos_configs.py`（**仅限提交 a43f5c6**，该文件现已从工作区删除）。
#   原第 3 处「.qoder/repowiki/ 整目录（311 个文件）」已撤销，改为按取值形态豁免 —— 见下文。

# ⚠️ 2026-09-14 实测（本地 Docker 复现 + 线上 run 34842101096 定位）：
#   本文件用的是**顶层 `[[allowlists]]`（复数数组）**语法，每条可带独立 `condition`。
#   该语法并非所有 gitleaks 版本都支持 —— 8.24.3 只认顶层单数 `[allowlist]`（单个 map），
#   遇到复数键会**静默忽略**（不报错、不警告）⇒ 下面三条豁免全部失效，
#   全历史扫描恒报 5 处「已核实的历史命中」，secret-scan 遂成为 deploy 的永久阻断点。
#   ⇒ 运行环境必须显式指定版本：CI 见 ci-cd.yml 的 `GITLEAKS_VERSION`（8.30.1；
#     已实测同一份配置下 `no leaks found`）。**不要**依赖 gitleaks-action 的默认值 ——
#     它的 dist 里写死了 `process.env.GITLEAKS_VERSION || "8.24.3"`，正是踩坑来源。
#   自检方法：`gitleaks detect --config .gitleaks.toml`，若仍报出下面已豁免的命中即为版本过低。

[extend]
# 保留默认全部规则，仅在其上叠加豁免
useDefault = true

[[allowlists]]
description = "env 模板文件：值全是 CHANGE_ME_* 之类占位符，本就不该含真实凭证"
paths = ['''(^|/)\.env\.example$''']

# ⚠️ 2026-09-16 复核 —— 上一条「整目录路径豁免」已**撤销**。
#   问题：`paths = ['''^\.qoder/repowiki/''']` 让该目录 311 个文件全部成为永久盲区，
#   与本文件开头「除非确定某文件永不含真实凭证，否则不要按整文件给豁免」的原则自相矛盾，
#   而这批文件恰恰是**机器生成的**（随时可能被重新生成、内容不受人工审阅）。
#
#   取证（本地 gitleaks 8.30.1，全程 --redact、只输出形态与哈希，不打印取值）：
#     ① 反证：用「删掉这条豁免」的临时配置扫全历史（296 提交）⇒ **3 处命中**，
#        全部落在同一个提交 69176e3 的同一个文件：
#        .qoder/repowiki/zh/content/API接口文档/RESTful API接口/文件管理接口/文件下载接口.md
#        第 319 / 338 / 361 行，规则均为 generic-api-key，熵 3.8164，三处是**同一个取值**。
#     ② 定性该取值：
#        · 长度 23；字符类别掩码 aaAaaAaaAaAAAaAdAaAd??? —— 18 个 ASCII 字母 + 2 个数字
#          + 结尾 3 个 ASCII 句点（**字面省略号**）；
#        · 上下文是「请求示例」，紧邻的响应示例写的是 cdn.example.com / abc123.zip /
#          expires=...&sign=... —— 同一套编造占位风格；
#        · 与仓库中 142 个配置类文件里的全部取值做 sha256 比对 ⇒ **0 命中**
#          （不是从真实配置里抄来的值）；
#        · Sa-Token 签发的是 UUID（必含数字与连字符），形态不符。
#        ⇒ 判为**编造的文档示例**，不是凭证，无需轮换。
#     ③ 该取值在当前树里共 4 处（另有第 394 行的响应体示例 `"data": "<同值>"`，
#        因无凭证关键字而未被规则命中）。
#
#   修法：改为按**取值形态**豁免 —— 真凭证不会以字面 `...` 结尾。
#   已实测：`gitleaks git .`（全历史 296 提交）与 `gitleaks dir .qoder`（当前树）**均
#   `no leaks found`**；且该文件**仍被正常扫描、未被跳过**（同目录 dir 扫描字节数与去掉
#   本条豁免时一致），即日后在该文件/该目录写入真实凭证**仍然会被拦下**。
[[allowlists]]
description = "生成的 API 文档里的编造示例：请求示例写成 ?token=<字母数字混合>... ，结尾是字面省略号；真凭证不会以 ... 结尾，故按值的形态豁免，不按路径也不按提交 —— 该目录日后写入真实凭证仍会被拦下。"
regexTarget = "secret"
regexes = ['''^[A-Za-z][A-Za-z0-9]{10,60}\.\.\.$''']

[[allowlists]]
description = "已知历史泄露：提交 a43f5c6 把真实 DB 口令写进该脚本。该脚本现已整体删除（它直连 config_info，首行 DELETE 会无备份清空配置表、且不写 tenant_id 导致写进去也读不到），本豁免只用于容忍那一笔历史提交，不影响当前树。"
condition = "AND"
commits = ["a43f5c6ffd0b645cca3dec0a8dac06152f7e86fb"]
paths = ['''^scripts/import_nacos_configs\.py$''']
