# Gitleaks 配置
#
# 策略：**在 gitleaks 默认规则集之上，只增加"已人工核实过的误报"豁免**，
# 不放宽任何规则、不整体跳过扫描。新增豁免必须写明理由与核实方式。
#
# 核实记录（2026-09-11，gitleaks 8.30.1）：
#   对全历史（238 commit）执行 `gitleaks git .`，命中 5 处，全部为 generic-api-key，
#   命中值长度均为 8 字符且低熵 —— 与真实凭证的形态（AK/SK 20~40 字符、高熵）不符，
#   逐一定位后确认为「文档示例 / 模板占位符 / 脚本占位字符串」，均非凭证。
#
# ⚠️ 2026-09-13 复核：上述「全部为 8 字符低熵占位符」的判断被证伪一处（审计 12-P0-1）。
#   `scripts/import_nacos_configs.py` 第 3 行的命中**不是**占位串，而是 32 字符、含大小写与数字的
#   真实口令（与线上 MYSQL_ROOT_PASSWORD / CONFIG_DB_PASSWORD 逐字节一致）。它之所以被当成误报，
#   恰恰是因为下面按「整文件路径」豁免了该脚本 —— 豁免粒度太粗，把真命中一起掩蔽了。
#   教训：①「命中值很短很低熵」这类判断必须逐条实测，不能凭印象；
#         ② 除非确定某文件永不含真实凭证，否则不要按整文件给豁免。
#
# 注意：下列路径因此成为「扫描盲区」——若真有人在其中写入真实密钥，不会被本门禁拦下。
# 这是有意识接受的代价（比放宽规则或整体关闭扫描小得多）；请定期复核。

[extend]
# 保留默认全部规则，仅在其上叠加豁免
useDefault = true

[[allowlists]]
description = "env 模板文件：值全是 CHANGE_ME_* 之类占位符，本就不该含真实凭证"
paths = ['''(^|/)\.env\.example$''']

[[allowlists]]
description = "生成的 API 文档：正文含 curl 请求示例，示例里的鉴权串不是凭证"
paths = ['''^\.qoder/repowiki/''']

[[allowlists]]
description = "已知历史泄露：提交 a43f5c6 把真实 DB 口令写进该脚本，工作区已移除并改为 env 传参"
condition = "AND"
commits = ["a43f5c6ffd0b645cca3dec0a8dac06152f7e86fb"]
paths = ['''^scripts/import_nacos_configs\.py$''']
