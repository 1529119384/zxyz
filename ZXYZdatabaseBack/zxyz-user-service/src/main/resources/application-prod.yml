spring:
  datasource:
    url: ${USER_DATASOURCE_URL}
    username: ${USER_DATASOURCE_USERNAME}
    password: ${USER_DATASOURCE_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  internal-service-token: ${INTERNAL_SERVICE_TOKEN}
  team-service:
    base-url: ${services.team-service.base-url}
  email-service:
    base-url: ${services.email-service.base-url}
  verification:
    return-code-in-response: ${VERIFICATION_RETURN_CODE:false}
