spring:
  config:
    import:
      - classpath:application-common.yml
      - nacos:zxyz-static.yml?group=ZXYZ&refreshEnabled=false
      - nacos:zxyz-dynamic.yml?group=ZXYZ&refreshEnabled=true
      - nacos:zxyz-user-service.yml?group=ZXYZ&refreshEnabled=false
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
        namespace: ${NACOS_NAMESPACE:}
        file-extension: yml
        group: ZXYZ
  profiles:
    default: dev
  application:
    name: zxyz-user-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${USER_DATASOURCE_URL}
    username: ${USER_DATASOURCE_USERNAME}
    password: ${USER_DATASOURCE_PASSWORD}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

server:
  port: ${SERVER_PORT:18083}

app:
  team-service:
    base-url: ${TEAM_SERVICE_BASE_URL:http://zxyz-team-service}
  email-service:
    base-url: ${EMAIL_SERVICE_BASE_URL:http://zxyz-email-service}
  verification:
    # 【安全默认】回显验证码 = 把验证码直接返回给调用方，属「有则必关」。
    # 缺省与生产（prod profile）一律 false；仅本地 dev profile 显式置 true
    # （见 application-dev.yml）。nacos-config/zxyz-user-service.yml 同口径。
    return-code-in-response: ${VERIFICATION_RETURN_CODE:false}
