spring:
  config:
    import:
      - classpath:application-common.yml
      - nacos:zxyz-static.yml?group=ZXYZ&refreshEnabled=false
      - nacos:zxyz-dynamic.yml?group=ZXYZ&refreshEnabled=true
      - nacos:zxyz-user-service.yml?group=ZXYZ&refreshEnabled=false
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        namespace: ${NACOS_NAMESPACE:}
        file-extension: yml
        group: ZXYZ
  profiles:
    default: dev
  application:
    name: zxyz-user-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${USER_DATASOURCE_URL}
    username: ${USER_DATASOURCE_USERNAME}
    password: ${USER_DATASOURCE_PASSWORD}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

server:
  port: ${SERVER_PORT:18083}

app:
  team-service:
    base-url: ${services.team-service.base-url}
  email-service:
    base-url: ${services.email-service.base-url}
  verification:
    return-code-in-response: ${VERIFICATION_RETURN_CODE:true}
