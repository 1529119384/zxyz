# 本地开发默认配置，生产环境不要激活 dev profile。
spring:
  main:
    lazy-initialization: true
  datasource:
    url: ${USER_DATASOURCE_URL:jdbc:mysql://localhost:3306/zxyz_user?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${USER_DATASOURCE_USERNAME:root}
    password: ${USER_DATASOURCE_PASSWORD:123456}
  data:
    redis:
      host: ${REDIS_HOST:localhost}

app:
  auth:
    secure: false
  team-service:
    base-url: ${TEAM_SERVICE_BASE_URL:http://localhost:18086}
  email-service:
    base-url: ${EMAIL_SERVICE_BASE_URL:http://localhost:18082}
  verification:
    return-code-in-response: ${VERIFICATION_RETURN_CODE:true}
    # 本地开发用的固定 pepper：dev profile 只在本地激活（生产不启用），
    # 目的是让开发机不必为了跑起来而配置 JASYPT_PASSWORD。
    code-pepper: ${VERIFY_CODE_PEPPER:dev-only-insecure-pepper}
    # dev profile 显式放行仓库内公开的 dev pepper（默认 false，理由见 application.yml）。
    allow-insecure-pepper: true
