# 本地开发默认配置，生产环境不要激活 dev profile。
spring:
  main:
    lazy-initialization: true
config:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    jdbc-url: ${ADMIN_DATASOURCE_URL:jdbc:mysql://localhost:3306/zxyz_config}
    username: ${ADMIN_DATASOURCE_USERNAME:root}
    password: ${ADMIN_DATASOURCE_PASSWORD:123456}
    # ⚠️ 池容量键必须**直接**挂在 config.datasource 下（不能套 hikari: 层）——
    # DataSourceBuilder 对 MySQL 产出 HikariDataSource，maximumPoolSize/minimumIdle 是其直接属性。
    # 详见 application-prod.yml 与 ConfigDataSourcePoolBindingTest（审计 C-16）。
    maximum-pool-size: 5
    minimum-idle: 2

app:
  team-service:
    base-url: ${TEAM_SERVICE_BASE_URL:http://localhost:18086}
# 本地开发保留 API 文档（生产默认关闭，见 zxyz-common 的 application-common.yml；D1-#3）
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
