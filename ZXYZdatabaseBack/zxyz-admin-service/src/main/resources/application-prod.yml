# 生产环境配置，通过环境变量注入敏感信息。
# 注：连接的是「Nacos 配置库」zxyz_config，前缀刻意用**顶层 config.datasource.***
# 而非 spring.datasource.*（见 ConfigDataSourceConfig：避免与 Spring Boot 自动配置的
# 主数据源冲突）。此前这里残留了一行空的 `spring:`（值为 null）——它会被 YAML 加载器
# 变成一个空串属性 `spring=""`，虽实测无害，但属明显笔误，已删除（2026-09-13，D2 顺带修正）。
config:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    jdbc-url: jdbc:mysql://${CONFIG_DB_HOST}:${CONFIG_DB_PORT:3306}/zxyz_config?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${CONFIG_DB_USERNAME}
    password: ${CONFIG_DB_PASSWORD}
    # ⚠️ 池容量键必须**直接**挂在 config.datasource 下：DataSourceBuilder 对 MySQL 产出的是
    # HikariDataSource，它把 maximumPoolSize/minimumIdle 暴露为直接属性，**没有 hikari: 这一层**。
    # 之前误写成 config.datasource.hikari.*，因 @ConfigurationProperties 绑定目标不存在且
    # ignoreUnknownFields 默认 true ⇒ 被静默忽略，池实际跑在 Hikari 默认值 10/10（审计 C-16）。
    # 守护测试：ConfigDataSourcePoolBindingTest。
    maximum-pool-size: 5
    minimum-idle: 2
