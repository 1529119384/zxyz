# 本地开发默认配置，生产环境不要激活 dev profile。
spring:
  datasource:
    url: ${AUDIT_DATASOURCE_URL:jdbc:mysql://localhost:3306/zxyz_audit?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${AUDIT_DATASOURCE_USERNAME:root}
    password: ${AUDIT_DATASOURCE_PASSWORD:123456}
  data:
    redis:
      host: ${REDIS_HOST:localhost}

app:
  # RemoteStpInterfaceAutoConfig 需要此属性进行服务间权限校验
  team-service:
    base-url: ${services.team-service.base-url}
