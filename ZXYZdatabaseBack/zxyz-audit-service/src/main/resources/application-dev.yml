# 本地开发默认配置，生产环境不要激活 dev profile。
spring:
  main:
    lazy-initialization: true
  datasource:
    url: ${AUDIT_DATASOURCE_URL:jdbc:mysql://localhost:3306/zxyz_audit?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${AUDIT_DATASOURCE_USERNAME:root}
    password: ${AUDIT_DATASOURCE_PASSWORD:123456}
  data:
    redis:
      host: ${REDIS_HOST:localhost}

app:
  # RemoteStpInterfaceAutoConfig 需要此属性进行服务间权限校验
  team-service:
    base-url: ${TEAM_SERVICE_BASE_URL:http://localhost:18086}
# 此处不配置 springdoc.*：audit 运行期无 springdoc 依赖（common 引入为 provided 不传递，
# dependency:tree -Dincludes=org.springdoc 实测零命中），开关是死键；audit 为纯 MQ 消费方，无 HTTP API 文档面。
# （P3-3，ISSUE/51：原 18-22 行显式开 springdoc 的配置块已删。）
