# 本地开发默认配置，生产环境不要激活 dev profile。
spring:
  main:
    lazy-initialization: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${PROJECT_DATASOURCE_URL:jdbc:mysql://localhost:3306/zxyz_project}
    username: ${PROJECT_DATASOURCE_USERNAME:root}
    password: ${PROJECT_DATASOURCE_PASSWORD:123456}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:3s}
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:8}
          max-idle: ${REDIS_POOL_MAX_IDLE:8}
          min-idle: ${REDIS_POOL_MIN_IDLE:2}

app:
  im:
    base-url: ${IM_SERVICE_BASE_URL:http://localhost:18081}
  file-service:
    base-url: ${FILE_SERVICE_BASE_URL:http://localhost:18085}
  team-service:
    base-url: ${TEAM_SERVICE_BASE_URL:http://localhost:18086}
  user-service:
    base-url: ${USER_SERVICE_BASE_URL:http://localhost:18083}
  email-service:
    base-url: ${EMAIL_SERVICE_BASE_URL:http://localhost:18082}
