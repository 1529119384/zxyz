spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${PROJECT_DATASOURCE_URL}
    username: ${PROJECT_DATASOURCE_USERNAME}
    password: ${PROJECT_DATASOURCE_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:30s}
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:8}
          max-idle: ${REDIS_POOL_MAX_IDLE:8}
          min-idle: ${REDIS_POOL_MIN_IDLE:0}

mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  im:
    base-url: ${services.im-service.base-url}
  internal-service-token: ${INTERNAL_SERVICE_TOKEN}
  file-service:
    base-url: ${services.file-service.base-url}
  team-service:
    base-url: ${services.team-service.base-url}
  user-service:
    base-url: ${services.user-service.base-url}
  email-service:
    base-url: ${services.email-service.base-url}
  performance:
    time-aspect-enabled: ${TIME_ASPECT_ENABLED:false}
