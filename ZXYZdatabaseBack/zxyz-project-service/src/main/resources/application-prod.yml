# Redis 配置已由 application-common.yml 统一管理
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${PROJECT_DATASOURCE_URL}
    username: ${PROJECT_DATASOURCE_USERNAME}
    password: ${PROJECT_DATASOURCE_PASSWORD}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  im:
    base-url: ${IM_SERVICE_BASE_URL:http://zxyz-im-service}
  file-service:
    base-url: ${FILE_SERVICE_BASE_URL:http://zxyz-file-service}
  team-service:
    base-url: ${TEAM_SERVICE_BASE_URL:http://zxyz-team-service}
  user-service:
    base-url: ${USER_SERVICE_BASE_URL:http://zxyz-user-service}
  email-service:
    base-url: ${EMAIL_SERVICE_BASE_URL:http://zxyz-email-service}
  performance:
    time-aspect-enabled: ${TIME_ASPECT_ENABLED:false}
