spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SHARE_DATASOURCE_URL:jdbc:mysql://localhost:3306/zxyz_share?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SHARE_DATASOURCE_USERNAME:root}
    password: ${SHARE_DATASOURCE_PASSWORD:123456}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:30s}
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:8}
          max-idle: ${REDIS_POOL_MAX_IDLE:8}
          min-idle: ${REDIS_POOL_MIN_IDLE:2}

app:
  share:
    cookie-secret: ${SHARE_COOKIE_SECRET:share-secret}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
    file-service:
      base-url: ${FILE_SERVICE_BASE_URL:http://zxyz-file-service}
    user-service:
      base-url: ${USER_SERVICE_BASE_URL:http://zxyz-user-service}
    team-service:
      base-url: ${TEAM_SERVICE_BASE_URL:http://zxyz-team-service}
      internal-service-token: ${INTERNAL_SERVICE_TOKEN}
