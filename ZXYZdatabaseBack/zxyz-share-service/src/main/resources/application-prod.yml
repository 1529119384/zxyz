# Redis 配置已由 application-common.yml 统一管理
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SHARE_DATASOURCE_URL}
    username: ${SHARE_DATASOURCE_USERNAME}
    password: ${SHARE_DATASOURCE_PASSWORD}

app:
  share:
    cookie-secret: ${SHARE_COOKIE_SECRET}
    frontend-base-url: ${FRONTEND_BASE_URL}
    file-service:
      base-url: ${services.file-service.base-url}
    user-service:
      base-url: ${services.user-service.base-url}
    team-service:
      base-url: ${services.team-service.base-url}
      internal-service-token: ${INTERNAL_SERVICE_TOKEN}
