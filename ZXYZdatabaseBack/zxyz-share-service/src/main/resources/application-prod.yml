spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SHARE_DATASOURCE_URL}
    username: ${SHARE_DATASOURCE_USERNAME}
    password: ${SHARE_DATASOURCE_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:30s}
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:8}
          max-idle: ${REDIS_POOL_MAX_IDLE:8}
          min-idle: ${REDIS_POOL_MIN_IDLE:0}

mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

share:
  file-service:
    base-url: ${services.file-service.base-url}
  user-service:
    base-url: ${services.user-service.base-url}
  team-service:
    base-url: ${services.team-service.base-url}
    internal-service-token: ${INTERNAL_SERVICE_TOKEN}

app:
  share:
    cookie-secret: ${SHARE_COOKIE_SECRET}
    frontend-base-url: ${FRONTEND_BASE_URL}
  internal-service-token: ${INTERNAL_SERVICE_TOKEN}
