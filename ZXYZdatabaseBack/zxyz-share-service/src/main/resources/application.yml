spring:
  config:
    import: classpath:application-common.yml
  profiles:
    default: dev
  application:
    name: zxyz-share-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SHARE_DATASOURCE_URL}
    username: ${SHARE_DATASOURCE_USERNAME}
    password: ${SHARE_DATASOURCE_PASSWORD}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

server:
  port: ${SERVER_PORT:18084}

mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

share:
  file-service:
    base-url: ${services.file-service.base-url}
  user-service:
    base-url: ${services.user-service.base-url}
  team-service:
    base-url: ${services.team-service.base-url}
    internal-service-token: ${INTERNAL_SERVICE_TOKEN:dev-internal-token}

app:
  share:
    cookie-secret: ${SHARE_COOKIE_SECRET}
    frontend-base-url: ${FRONTEND_BASE_URL}
