spring:
  config:
    import:
      - classpath:application-common.yml
      - nacos:zxyz-static.yml?group=ZXYZ&refreshEnabled=false
      - nacos:zxyz-dynamic.yml?group=ZXYZ&refreshEnabled=true
      - nacos:zxyz-share-service.yml?group=ZXYZ&refreshEnabled=false
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
        namespace: ${NACOS_NAMESPACE:}
        file-extension: yml
        group: ZXYZ
  profiles:
    # [安全默认] 缺省 profile = prod：漏配 profile 时宁可启动失败，也不要静默落到 dev ——
    # dev profile 带的是本地弱默认（验证码回显、dev-only 弱 pepper、localhost/123456 数据源）。
    # 本地开发请显式激活 dev：用 scripts/run-local.sh，或加 -Dspring.profiles.active=dev。
    default: prod
  application:
    name: zxyz-share-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SHARE_DATASOURCE_URL}
    username: ${SHARE_DATASOURCE_USERNAME}
    password: ${SHARE_DATASOURCE_PASSWORD}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

server:
  port: ${SERVER_PORT:18084}

app:
  share:
    cookie-secret: ${SHARE_COOKIE_SECRET}
    frontend-base-url: ${FRONTEND_BASE_URL}
    file-service:
      base-url: ${FILE_SERVICE_BASE_URL:http://zxyz-file-service}
    user-service:
      base-url: ${USER_SERVICE_BASE_URL:http://zxyz-user-service}
    # 分享条目对账（审计 2.2.7）：定期扫描 share_item 中指向「已彻底删除 / 已不存在文件」的残留引用。
    # 灰度期只告警不删除 —— 先把一周的数据量看清楚，再决定是否打开 deletion-enabled。
    # ⚠️ deletion-enabled=true 是**不可逆**动作（按 file_id 删 share_item 行），开之前请先确认灰度数据。
    item-reconcile:
      enabled: ${SHARE_ITEM_RECONCILE_ENABLED:true}
      deletion-enabled: ${SHARE_ITEM_RECONCILE_DELETION_ENABLED:false}
      initial-delay-ms: ${SHARE_ITEM_RECONCILE_INITIAL_DELAY_MS:300000}
      interval-ms: ${SHARE_ITEM_RECONCILE_INTERVAL_MS:1800000}
      batch-size: ${SHARE_ITEM_RECONCILE_BATCH_SIZE:500}
      lock-ttl-seconds: ${SHARE_ITEM_RECONCILE_LOCK_TTL_SECONDS:1500}
