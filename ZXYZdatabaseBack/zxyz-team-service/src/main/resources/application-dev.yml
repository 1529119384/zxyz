# 本地开发默认配置，生产环境不要激活 dev profile。
spring:
  datasource:
    url: ${TEAM_DATASOURCE_URL:jdbc:mysql://localhost:3306/zxyz_team?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${TEAM_DATASOURCE_USERNAME:root}
    password: ${TEAM_DATASOURCE_PASSWORD:123456}
  data:
    redis:
      host: ${REDIS_HOST:localhost}

app:
  user-service:
    base-url: ${USER_SERVICE_BASE_URL:http://zxyz-user-service}
  im-service:
    base-url: ${IM_SERVICE_BASE_URL:http://zxyz-im-service}
  email-service:
    base-url: ${EMAIL_SERVICE_BASE_URL:http://zxyz-email-service}
  file-service:
    base-url: ${FILE_SERVICE_BASE_URL:http://zxyz-file-service}
  project-service:
    base-url: ${PROJECT_SERVICE_BASE_URL:http://zxyz-project-service}
