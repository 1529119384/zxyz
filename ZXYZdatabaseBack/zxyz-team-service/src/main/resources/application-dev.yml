# 本地开发默认配置，生产环境不要激活 dev profile。
spring:
  main:
    lazy-initialization: true
  datasource:
    url: ${TEAM_DATASOURCE_URL:jdbc:mysql://localhost:3306/zxyz_team?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${TEAM_DATASOURCE_USERNAME:root}
    password: ${TEAM_DATASOURCE_PASSWORD:123456}
  data:
    redis:
      host: ${REDIS_HOST:localhost}

app:
  user-service:
    base-url: ${USER_SERVICE_BASE_URL:http://localhost:18083}
  im-service:
    base-url: ${IM_SERVICE_BASE_URL:http://localhost:18081}
  email-service:
    base-url: ${EMAIL_SERVICE_BASE_URL:http://localhost:18082}
  file-service:
    base-url: ${FILE_SERVICE_BASE_URL:http://localhost:18085}
  project-service:
    base-url: ${PROJECT_SERVICE_BASE_URL:http://localhost:18080}
