# Redis 配置已由 application-common.yml 统一管理
spring:
  datasource:
    url: ${TEAM_DATASOURCE_URL}
    username: ${TEAM_DATASOURCE_USERNAME}
    password: ${TEAM_DATASOURCE_PASSWORD}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  user-service:
    base-url: ${USER_SERVICE_BASE_URL:http://zxyz-user-service}
  im-service:
    base-url: ${IM_SERVICE_BASE_URL:http://zxyz-im-service}
  email-service:
    base-url: ${EMAIL_SERVICE_BASE_URL:http://zxyz-email-service}
  file-service:
    base-url: ${FILE_SERVICE_BASE_URL:http://zxyz-file-service}
