spring:
  config:
    import:
      - classpath:application-common.yml
      - nacos:zxyz-static.yml?group=ZXYZ&refreshEnabled=false
      - nacos:zxyz-dynamic.yml?group=ZXYZ&refreshEnabled=true
      - nacos:zxyz-team-service.yml?group=ZXYZ&refreshEnabled=false
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
        namespace: ${NACOS_NAMESPACE:}
        file-extension: yml
        group: ZXYZ
  profiles:
    # [安全默认] 缺省 profile = prod：漏配 profile 时宁可启动失败，也不要静默落到 dev ——
    # dev profile 带的是本地弱默认（验证码回显、dev-only 弱 pepper、localhost/123456 数据源）。
    # 本地开发请显式激活 dev：用 scripts/run-local.sh，或加 -Dspring.profiles.active=dev。
    default: prod
  application:
    name: zxyz-team-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${TEAM_DATASOURCE_URL}
    username: ${TEAM_DATASOURCE_USERNAME}
    password: ${TEAM_DATASOURCE_PASSWORD}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

server:
  port: ${SERVER_PORT:18086}

app:
  user-service:
    base-url: ${USER_SERVICE_BASE_URL:http://zxyz-user-service}
  im-service:
    base-url: ${IM_SERVICE_BASE_URL:http://zxyz-im-service}
  email-service:
    base-url: ${EMAIL_SERVICE_BASE_URL:http://zxyz-email-service}
  file-service:
    base-url: ${FILE_SERVICE_BASE_URL:http://zxyz-file-service}
  project-service:
    base-url: ${PROJECT_SERVICE_BASE_URL:http://zxyz-project-service}
  team:
    default-team-sync:
      initial-delay-ms: ${DEFAULT_TEAM_SYNC_INITIAL_DELAY_MS:30000}
      fixed-delay-ms: ${DEFAULT_TEAM_SYNC_FIXED_DELAY_MS:30000}
  # 全站广播（系统消息 / 系统邮件）的分批参数（审计 L10）。
  # 一次性把全站用户塞进一个请求会撑爆下游的请求体与单个事务；分批 + 批间隔把压力摊平。
  # 单批条数有硬上限 5000（见 BroadcastBatchDispatcher.MAX_BATCH_SIZE），配置写再大也会被钳制。
  broadcast:
    batch-size: ${BROADCAST_BATCH_SIZE:500}
    batch-interval-ms: ${BROADCAST_BATCH_INTERVAL_MS:200}
