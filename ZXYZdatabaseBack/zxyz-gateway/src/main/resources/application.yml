spring:
  main:
    web-application-type: reactive
  config:
    import:
      - classpath:application-common.yml
      - nacos:zxyz-dynamic.yml?group=ZXYZ&refreshEnabled=true
  application:
    name: zxyz-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:30s}
  http:
    codecs:
      max-in-memory-size: ${MAX_REQUEST_SIZE:100MB}
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
        namespace: ${NACOS_NAMESPACE:}
        file-extension: yml
        group: ZXYZ
    gateway:
      # 禁用 Spring 内置 ForwardedHeaderFilter：真实客户端 IP 由 ClientIpFilter 统一解析，
      # 避免与内置 XFF 处理行为叠加导致解析不确定。
      forwarded:
        enabled: false
      default-filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: ${RATE_LIMIT_REPLENISH:50}
            redis-rate-limiter.burstCapacity: ${RATE_LIMIT_BURST:100}
            key-resolver: "#{@userKeyResolver}"
      server:
        webflux:
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
                allowed-methods: "*"
                allowed-headers: "*"
                exposed-headers: "Authorization"
                allow-credentials: true
                max-age: 3600
          routes:
            # IM WebSocket 路由：/ws → im-service Netty 端口（lb:// 不适用于 WebSocket，使用环境变量）
            - id: im-websocket
              uri: ${IM_WEBSOCKET_URI:ws://localhost:19090}
              predicates:
                - Path=/ws, /ws/**
              filters:
                - SetPath=/ws

            # IM HTTP API 路由：/im-api/** → im-service（剥离 /im-api 前缀）
            - id: im-service
              uri: lb://zxyz-im-service
              predicates:
                - Path=/im-api/**
              filters:
                - StripPrefix=1

            # IM 原生 HTTP API 路由：/api/im/**, /api/team-collaboration/** → im-service
            - id: im-service-api
              uri: lb://zxyz-im-service
              predicates:
                - Path=/api/im/**, /api/team-collaboration/**

            # 邮件服务路由：/api/email/** → email-service
            - id: email-service
              uri: lb://zxyz-email-service
              predicates:
                - Path=/api/email/**

            # 公开分享页路由（无需鉴权，白名单在 SaTokenFilterConfig 中配置）
            - id: share-public
              uri: lb://zxyz-share-service
              predicates:
                - Path=/api/public/shares/**

            # 分享服务路由：/api/shares/** → share-service
            - id: share-service
              uri: lb://zxyz-share-service
              predicates:
                - Path=/api/shares/**

            # 文件服务路由：文件、文件夹、回收站、IM 文件卡片 → file-service
            - id: file-service
              uri: lb://zxyz-file-service
              predicates:
                - Path=/api/files/**, /api/folders/**, /api/trash/**, /api/im-file-cards/**

            # 团队服务路由：/api/teams/**, /api/admin/teams/**, /api/permissions/** → team-service
            - id: team-service
              uri: lb://zxyz-team-service
              predicates:
                - Path=/api/teams/**, /api/admin/teams/**, /api/permissions/**

            # 用户服务路由：/api/users/** → user-service
            - id: user-service
              uri: lb://zxyz-user-service
              predicates:
                - Path=/api/users/**

            # 管理后台邮件路由：/api/admin/email/** → email-service
            - id: admin-email
              uri: lb://zxyz-email-service
              predicates:
                - Path=/api/admin/email/**
              filters:
                - RewritePath=/api/admin/email(?<segment>/?.*), /api/email/internal${segment}
                # gateway 作为 admin 桥接的合法调用方身份：token 自注入，caller 声明为 zxyz-gateway；
                # StripInternalHeadersFilter 先剥外部伪造的内部头，再经 filters 补回受信身份。
                # 密钥取值：优先网关专属 SVC_GATEWAY_KEY（矩阵模式，必须与收方 allowed-sources 中
                # zxyz-gateway 项同值）；过渡期未设 SVC_GATEWAY_KEY 时回退共享 INTERNAL_SERVICE_TOKEN。
                # 禁止在此写任何字面量默认值——密钥一律来自 .env，缺值由收方 fail-closed 拒绝。
                - AddRequestHeader=X-Internal-Service-Token, ${SVC_GATEWAY_KEY:${INTERNAL_SERVICE_TOKEN}}
                - AddRequestHeader=X-Internal-Caller-Service, zxyz-gateway

            # 管理后台数据库路由：/api/admin/database/** → project-service
            # 【此处不注入内部鉴权头，是有意为之】
            # 该路径由 project-service 的 Sa-Token 登录态 + @SaCheckRole(SYSTEM_ADMIN) 把关
            # （见 AdminDatabaseController），不参与服务间鉴权——project-service 的
            # InternalServiceAuthInterceptor 只覆盖 /api/internal/**。
            # 原先在此注入的 X-Internal-Service-Token 属于「既无 caller 声明、也无消费方」的冗余遗留：
            # 一旦 project-service 启用矩阵、或把该路径纳入内部鉴权，缺 X-Internal-Caller-Service
            # 会直接 401。故移除。若将来该路径确需内部鉴权，必须同时补 token 与 caller 两个头。
            - id: admin-database
              uri: lb://zxyz-project-service
              predicates:
                - Path=/api/admin/database/**

            # 存储提供者管理路由：/api/admin/storage-providers/** → file-service
            - id: file-service-storage-providers
              uri: lb://zxyz-file-service
              predicates:
                - Path=/api/admin/storage-providers/**

            # 管理后台通用路由：/api/admin/** → admin-service（剥离 /api/admin 前缀）
            - id: admin-service
              uri: lb://zxyz-admin-service
              predicates:
                - Path=/api/admin/**
              filters:
                - RewritePath=/api/admin/(?<segment>.*), /${segment}

            # 项目服务路由：项目、成员、目录、配额、申请、存储用量 → project-service
            - id: project-service
              uri: lb://zxyz-project-service
              predicates:
                - Path=/api/projects/**, /api/project-members/**, /api/project-catalog/**, /api/project-catalogs/**, /api/project-quotas/**, /api/project-create-requests/**, /api/storage/**


server:
  port: ${SERVER_PORT:18000}

sa-token:
  is-log: false

app:
  internal-service-token: ${INTERNAL_SERVICE_TOKEN}
  # 真实客户端 IP 解析——可信代理 IP 白名单（单 IP 或 CIDR 网段，逗号分隔）。
  # 默认关闭（空）：此时网关不信任任何 X-Forwarded-For，限流/安全基于直接连接地址（nginx IP），
  # 从根本上杜绝客户端伪造源 IP。生产部署必须配置紧邻网关的前置代理（如 frontend-nginx 节点/网段），
  # 例如：app.gateway.trusted-proxies: 172.18.0.0/16
  gateway:
    trusted-proxies: ${GATEWAY_TRUSTED_PROXIES:}
