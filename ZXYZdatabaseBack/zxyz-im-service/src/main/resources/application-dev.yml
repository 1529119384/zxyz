# 本地开发默认配置，生产环境不要激活 dev profile。
# Redis 配置已由 application-common.yml 统一管理，此处不重复定义。
spring:
  main:
    lazy-initialization: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${IM_DATASOURCE_URL:jdbc:mysql://localhost:3306/zxyz_im}
    username: ${IM_DATASOURCE_USERNAME:root}
    password: ${IM_DATASOURCE_PASSWORD:123456}
