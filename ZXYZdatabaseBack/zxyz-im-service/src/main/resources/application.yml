spring:
  config:
    import:
      - classpath:application-common.yml
      - nacos:zxyz-static.yml?group=ZXYZ&refreshEnabled=false
      - nacos:zxyz-dynamic.yml?group=ZXYZ&refreshEnabled=true
      - nacos:zxyz-im-service.yml?group=ZXYZ&refreshEnabled=false
  application:
    name: zxyz-im-service
  profiles:
    # [安全默认] 缺省 profile = prod：漏配 profile 时宁可启动失败，也不要静默落到 dev ——
    # dev profile 带的是本地弱默认（验证码回显、dev-only 弱 pepper、localhost/123456 数据源）。
    # 本地开发请显式激活 dev：用 scripts/run-local.sh，或加 -Dspring.profiles.active=dev。
    default: prod
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
        namespace: ${NACOS_NAMESPACE:}
        file-extension: yml
        group: ZXYZ
      discovery:
        metadata:
          netty-websocket-port: ${IM_NETTY_PORT:19090}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${IM_DATASOURCE_URL}
    username: ${IM_DATASOURCE_USERNAME}
    password: ${IM_DATASOURCE_PASSWORD}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

server:
  port: ${SERVER_PORT:18081}

mybatis:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

# 注意：撤回窗口属于动态配置，正确键是 zxyz-dynamic.yml 的
# app.im.message.recall-window-seconds（热更新）；此处的 im.message.* 前缀
# 无代码消费（im-service 只绑定 im.netty / im.invite-link），已移除（N8）。
im:
  invite-link:
    default-expire-hours: 24
    default-max-uses: 0
  netty:
    enabled: true
    websocket-path: /ws

app:
  user-service:
    base-url: ${USER_SERVICE_BASE_URL:http://zxyz-user-service}
  file-service:
    base-url: ${FILE_SERVICE_BASE_URL:http://zxyz-file-service}
  team-service:
    base-url: ${TEAM_SERVICE_BASE_URL:http://zxyz-team-service}
