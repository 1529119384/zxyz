# 正确处理反向代理转发的请求头（如 Nginx、Kubernetes Ingress）
server:
  forward-headers-strategy: native
  trusted-proxies: 172.18.0.0/16
  shutdown: graceful

# Jasypt 配置加密
jasypt:
  encryptor:
    algorithm: AES/GCM/NoPadding
    iv-generator-classname: org.jasypt.iv.RandomIvGenerator
    password: ${JASYPT_PASSWORD}

# Redis 配置（所有服务共享）
spring:
  task:
    scheduling:
      # @Scheduled 任务统一调度线程池大小（P3-5）：默认 Spring 为单线程，多个定时任务会串行阻塞。
      # file-service 就有 5 个 @Scheduled（对账/孤儿/清理/删除重试/墓碑），单线程相互拖慢。
      # 各服务若需不同值可在自身 yml/环境覆盖。
      pool:
        size: ${SCHEDULING_POOL_SIZE:8}
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:20}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT:300000}
      max-lifetime: ${HIKARI_MAX_LIFETIME:600000}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:30000}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:3s}
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:8}
          max-idle: ${REDIS_POOL_MAX_IDLE:8}
          min-idle: ${REDIS_POOL_MIN_IDLE:2}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        prefetch: ${RABBITMQ_PREFETCH:10}
        # 消费失败重试（2.2.3）：此前只配了 prefetch，消费者抛 RuntimeException 会让消息
        # 立刻回队头无限热循环——单条持续失败的消息在进 DLQ 前会饿死整个队列并刷爆日志。
        # 现在：有限次 + 指数退避重试；耗尽后 ACK 丢弃（不回队列），
        # 由各业务队列的 x-dead-letter-exchange（zxyz.dlx → zxyz.<svc>.dlq）兜底。
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: ${RABBITMQ_RETRY_MAX_ATTEMPTS:3}
          initial-interval: ${RABBITMQ_RETRY_INITIAL_INTERVAL:1s}
          multiplier: 2
          max-interval: ${RABBITMQ_RETRY_MAX_INTERVAL:10s}

# Sa-Token 配置（所有服务共享）
sa-token:
  token-name: satoken
  is-write-cookie: false
  token-storage-mode: redis
  timeout: 43200
  active-timeout: 1800
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: true
  is-read-cookie: true
  dynamic-active-timeout: true
  redis:
    prefix: ${SA_TOKEN_REDIS_PREFIX:satoken:}

# 日志配置：抑制 Nacos 客户端在 Windows 上的文件轮转警告
logging:
  level:
    com.alibaba.nacos.client.config: WARN

# MyBatis 公共配置
mybatis:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

# Actuator 健康检查与可观测性
management:
  endpoints:
    web:
      exposure:
        # 审计 12-2.1.4：/actuator/** 在网关侧免鉴权（SaTokenFilterConfig 全量排除），
        # 因此暴露面必须最小化。原配置含 loggers —— 任何人都能
        # `POST /actuator/loggers/{name}` 把任意包调到 DEBUG（敏感信息入日志 + 性能损耗），
        # 并可读 metrics 窥探内部结构。收敛为只读的 health/info/prometheus。
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

# CORS 公共默认值 & 服务间调用地址（所有服务共享，可通过环境变量覆盖）
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
  # 服务间调用鉴权 token，生产环境必须通过环境变量注入
  internal-service-token: ${INTERNAL_SERVICE_TOKEN}
  # 服务级白名单矩阵（P2-A2）：允许来源服务名 -> 该来源独立密钥。
  # 默认空 = 过渡模式（仅校验 INTERNAL_SERVICE_TOKEN）；生产各服务覆盖此 map 以启用矩阵。
  internal:
    allowed-sources: {}
  # auth timeout 默认值：zxyz-dynamic.yml（Nacos 热更新）会覆盖此处。
  # secure 默认 false：当前部署为 IP 直连 HTTP，Secure Cookie 在 HTTP 下不回传会致登录失效。
  # 启用 HTTPS 后须设 AUTH_COOKIE_SECURE=true（三处默认值已统一，详见 nacos-config/zxyz-dynamic.yml）。
  auth:
    secure: ${AUTH_COOKIE_SECURE:false}
    domain: ${AUTH_COOKIE_DOMAIN:}
    token-timeout-seconds: ${AUTH_TOKEN_TIMEOUT:43200}
    long-lived-timeout-seconds: ${AUTH_LONG_LIVED_TIMEOUT:604800}
  email:
    verify-code:
      cooldown-seconds: ${EMAIL_VERIFY_COOLDOWN:60}
  oss:
    region: ${OSS_REGION:cn-shenzhen}
    bucket: ${OSS_BUCKET:zxyz-database}
    endpoint: ${OSS_ENDPOINT:}
    public-base-url: ${OSS_PUBLIC_BASE_URL:}
    sign-expire-seconds: ${OSS_SIGN_EXPIRE:3600}
  user-service:
    base-url: ${USER_SERVICE_BASE_URL:http://zxyz-user-service}
  team-service:
    base-url: ${TEAM_SERVICE_BASE_URL:http://zxyz-team-service}
    internal-service-token: ${INTERNAL_SERVICE_TOKEN}
  file-service:
    base-url: ${FILE_SERVICE_BASE_URL:http://zxyz-file-service}
  im-service:
    base-url: ${IM_SERVICE_BASE_URL:http://zxyz-im-service}
  email-service:
    base-url: ${EMAIL_SERVICE_BASE_URL:http://zxyz-email-service}
  project-service:
    base-url: ${PROJECT_SERVICE_BASE_URL:http://zxyz-project-service}
  share-service:
    base-url: ${SHARE_SERVICE_BASE_URL:http://zxyz-share-service}
  admin-service:
    base-url: ${ADMIN_SERVICE_BASE_URL:http://zxyz-admin-service}

# Resilience4j 服务间调用韧性配置
resilience4j:
  retry:
    instances:
      serviceClient:
        max-attempts: 3
        wait-duration: 500ms
  circuitbreaker:
    instances:
      serviceClient:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s

# SpringDoc + Knife4j API 文档配置
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
  packages-to-scan: uno.acloud.*.controller
knife4j:
  enable: ${KNIFE4J_ENABLE:false}
  setting:
    language: zh_cn
