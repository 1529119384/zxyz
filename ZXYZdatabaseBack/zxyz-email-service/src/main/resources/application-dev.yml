# 本地开发默认配置，生产环境不要激活 dev profile。
spring:
  main:
    lazy-initialization: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${EMAIL_DATASOURCE_URL:jdbc:mysql://localhost:3306/zxyz_email}
    username: ${EMAIL_DATASOURCE_USERNAME:root}
    password: ${EMAIL_DATASOURCE_PASSWORD:123456}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:3s}
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:8}
          max-idle: ${REDIS_POOL_MAX_IDLE:8}
          min-idle: ${REDIS_POOL_MIN_IDLE:2}

email:
  host: ${EMAIL_HOST:smtp.qq.com}
  port: ${EMAIL_PORT:587}
  username: ${EMAIL_USERNAME:your@qq.com}
  password: ${EMAIL_PASSWORD:授权码}
  config-secret: ${EMAIL_CONFIG_SECRET:ACLOUD}

app:
  # RemoteStpInterfaceAutoConfig 需要此属性进行服务间权限校验
  team-service:
    base-url: ${TEAM_SERVICE_BASE_URL:http://localhost:18086}
