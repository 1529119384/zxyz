spring:
  config:
    import:
      - classpath:application-common.yml
      - nacos:zxyz-static.yml?group=ZXYZ&refreshEnabled=false
      - nacos:zxyz-dynamic.yml?group=ZXYZ&refreshEnabled=true
      - nacos:zxyz-email-service.yml?group=ZXYZ&refreshEnabled=false
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
        namespace: ${NACOS_NAMESPACE:}
        file-extension: yml
        group: ZXYZ
  application:
    name: zxyz-email-service
  profiles:
    # [安全默认] 缺省 profile = prod：漏配 profile 时宁可启动失败，也不要静默落到 dev ——
    # dev profile 带的是本地弱默认（验证码回显、dev-only 弱 pepper、localhost/123456 数据源）。
    # 本地开发请显式激活 dev：用 scripts/run-local.sh，或加 -Dspring.profiles.active=dev。
    default: prod
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${EMAIL_DATASOURCE_URL}
    username: ${EMAIL_DATASOURCE_USERNAME}
    password: ${EMAIL_DATASOURCE_PASSWORD}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

server:
  port: ${SERVER_PORT:18082}

email:
  from: ${EMAIL_FROM:${email.username}}
  async: ${EMAIL_ASYNC:true}
  enabled: ${EMAIL_ENABLED:true}
  batch-size: ${EMAIL_BATCH_SIZE:50}
  retry-fixed-delay-ms: ${EMAIL_RETRY_FIXED_DELAY_MS:60000}
  retry-initial-delay-ms: ${EMAIL_RETRY_INITIAL_DELAY_MS:10000}
  verify-code-expire-minutes: ${EMAIL_VERIFY_CODE_EXPIRE_MINUTES:10}
  # 验证码摘要 pepper（HMAC-SHA256 密钥，绝不落库；库里只存摘要）。
  # 缺省回退 Jasypt 主密钥；未配置或为公开占位值时启动失败（fail-closed）。
  # 见 zxyz-common 的 VerifyCodeHasher。
  verify-code-pepper: ${VERIFY_CODE_PEPPER:${JASYPT_PASSWORD:}}
  # 是否允许用「仓库里公开写着」的弱 pepper（dev-only-insecure-pepper 等）。
  # 默认 false 是刻意的（纵深防御）：spring.profiles.default 已由 dev 翻为 prod（2026-09-13），
  # 漏配 profile 会直接启动失败；但只要有人显式激活 dev/test 而忘了配真实 pepper，
  # 默认放行仍会造成「服务正常运行、但库里的摘要可被任何人离线穷举」这种静默弱配置。
  # 只有 application-dev.yml 才显式置 true。
  verify-code-allow-insecure-pepper: ${VERIFY_CODE_ALLOW_INSECURE_PEPPER:false}
  ip-limit-per-minute: ${EMAIL_IP_LIMIT_PER_MINUTE:3}
  email-limit-per-minute: ${EMAIL_ADDRESS_LIMIT_PER_MINUTE:1}

# ---------------------------------------------------------------------------
# 服务间鉴权（P2-A2 白名单矩阵，email 是试点收方）
# 默认空 = 过渡模式（回退 INTERNAL_SERVICE_TOKEN）。生产启用矩阵时打开下面映射，
# 只列「允许调用本服务」的来源密钥；密钥在 .env 定义（SVC_*_KEY），未定义会导致启动拒绝（fail-closed）。
# 注意：gateway 以 zxyz-gateway 身份经 admin-email 桥接调用 /api/email/internal/**，须列入来源。
# app:
#   internal:
#     allowed-sources:
#       zxyz-user-service: ${SVC_USER_KEY}
#       zxyz-admin-service: ${SVC_ADMIN_KEY}
#       zxyz-project-service: ${SVC_PROJECT_KEY}
#       zxyz-im-service: ${SVC_IM_KEY}
#       zxyz-file-service: ${SVC_FILE_KEY}
#       zxyz-team-service: ${SVC_TEAM_KEY}
#       zxyz-gateway: ${SVC_GATEWAY_KEY}
# ----
