spring:
  config:
    import:
      - classpath:application-common.yml
      - nacos:zxyz-static.yml?group=ZXYZ&refreshEnabled=false
      - nacos:zxyz-dynamic.yml?group=ZXYZ&refreshEnabled=true
      - nacos:zxyz-email-service.yml?group=ZXYZ&refreshEnabled=false
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        namespace: ${NACOS_NAMESPACE:}
        file-extension: yml
        group: ZXYZ
  application:
    name: zxyz-email-service
  profiles:
    default: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${EMAIL_DATASOURCE_URL}
    username: ${EMAIL_DATASOURCE_USERNAME}
    password: ${EMAIL_DATASOURCE_PASSWORD}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

server:
  port: ${SERVER_PORT:18082}

email:
  from: ${EMAIL_FROM:${email.username}}
  async: ${EMAIL_ASYNC:true}
  enabled: ${EMAIL_ENABLED:true}
  batch-size: ${EMAIL_BATCH_SIZE:50}
  retry-fixed-delay-ms: ${EMAIL_RETRY_FIXED_DELAY_MS:60000}
  retry-initial-delay-ms: ${EMAIL_RETRY_INITIAL_DELAY_MS:10000}
  verify-code-expire-minutes: ${EMAIL_VERIFY_CODE_EXPIRE_MINUTES:10}
  ip-limit-per-minute: ${EMAIL_IP_LIMIT_PER_MINUTE:3}
  email-limit-per-minute: ${EMAIL_ADDRESS_LIMIT_PER_MINUTE:1}
