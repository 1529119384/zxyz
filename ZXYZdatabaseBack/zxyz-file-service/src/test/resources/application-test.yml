spring:
  config:
    import: classpath:application-common.yml
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
  cloud:
    nacos:
      discovery:
        enabled: false

mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

app:
  internal-service-token: test-internal-token
  file-object-delete:
    enabled: false
  team-service:
    base-url: http://localhost:19999
  project-service:
    base-url: http://localhost:19999
  share-service:
    base-url: http://localhost:19999
