spring:
  config:
    import:
      - classpath:application-common.yml
      - nacos:zxyz-static.yml?group=ZXYZ&refreshEnabled=false
      - nacos:zxyz-dynamic.yml?group=ZXYZ&refreshEnabled=true
      - nacos:zxyz-file-service.yml?group=ZXYZ&refreshEnabled=false
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        namespace: ${NACOS_NAMESPACE:}
        file-extension: yml
        group: ZXYZ
  profiles:
    default: dev
  application:
    name: zxyz-file-service
  servlet:
    multipart:
      max-file-size: 1GB
      max-request-size: 1GB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${FILE_DATASOURCE_URL}
    username: ${FILE_DATASOURCE_USERNAME}
    password: ${FILE_DATASOURCE_PASSWORD}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

server:
  port: ${SERVER_PORT:18085}

app:
  file-object-delete:
    enabled: true
    batch-size: 20
    initial-delay-ms: 30000
    retry-fixed-delay-ms: 60000
  team-service:
    base-url: ${TEAM_SERVICE_BASE_URL:http://zxyz-team-service}
  project-service:
    base-url: ${PROJECT_SERVICE_BASE_URL:http://zxyz-project-service}
  share-service:
    base-url: ${SHARE_SERVICE_BASE_URL:http://zxyz-share-service}
