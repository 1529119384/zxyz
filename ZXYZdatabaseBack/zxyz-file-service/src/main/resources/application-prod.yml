# Redis 配置已由 application-common.yml 统一管理
spring:
  datasource:
    url: ${FILE_DATASOURCE_URL}
    username: ${FILE_DATASOURCE_USERNAME}
    password: ${FILE_DATASOURCE_PASSWORD}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  team-service:
    base-url: ${services.team-service.base-url}
  project-service:
    base-url: ${services.project-service.base-url}
  share-service:
    base-url: ${services.share-service.base-url}
