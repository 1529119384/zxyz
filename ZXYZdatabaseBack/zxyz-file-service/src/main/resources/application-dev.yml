# 本地开发默认配置，生产环境不要激活 dev profile。
spring:
  main:
    lazy-initialization: true
  datasource:
    url: ${FILE_DATASOURCE_URL:jdbc:mysql://localhost:3306/zxyz_file?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${FILE_DATASOURCE_USERNAME:root}
    password: ${FILE_DATASOURCE_PASSWORD:123456}
  data:
    redis:
      host: ${REDIS_HOST:localhost}

app:
  team-service:
    base-url: ${TEAM_SERVICE_BASE_URL:http://zxyz-team-service}
  project-service:
    base-url: ${PROJECT_SERVICE_BASE_URL:http://zxyz-project-service}
  share-service:
    base-url: ${SHARE_SERVICE_BASE_URL:http://zxyz-share-service}
  storage:
    default-provider: ${STORAGE_DEFAULT_PROVIDER:oss}
    provider:
      oss:
        enabled: ${STORAGE_OSS_ENABLED:true}
      local:
        enabled: ${STORAGE_LOCAL_ENABLED:false}
        base-path: ${LOCAL_STORAGE_PATH:./local-storage}
