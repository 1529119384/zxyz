# ZXYZ 基础告警规则
# 仅使用 micrometer 默认导出的指标（jvm_*/process_*/http_server_requests_*），
# 避免引用不存在的指标导致规则文件加载失败。
groups:
  - name: zxyz-basic
    rules:
      # 实例不可达
      - alert: ServiceDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "实例 {{ $labels.instance }} 不可达"
          description: "{{ $labels.job }} 的 {{ $labels.instance }} 已离线超过 2 分钟"

      # JVM 堆内存使用率过高
      - alert: JvmHeapHigh
        expr: jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"} > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} JVM 堆内存 > 90%"
          description: "堆内存使用率 {{ $value | humanizePercentage }} 已持续 5 分钟"

      # 进程重启
      - alert: ProcessRestart
        expr: changes(process_start_time_seconds[5m]) > 0
        labels:
          severity: info
        annotations:
          summary: "{{ $labels.instance }} 进程已重启"
          description: "{{ $labels.job }} 在最近 5 分钟内发生过重启"

      # HTTP 5xx 错误率过高（按 service 聚合，service 标签由 prometheus.yml static_configs 注入）
      - alert: HighHttp5xxRate
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) by (service) / sum(rate(http_server_requests_seconds_count[5m])) by (service) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} 5xx 错误率 > 10%"
          description: "近 5 分钟 5xx 占比 {{ $value | humanizePercentage }}"

      # 容器 OOM 风险（JVM 形态替代）：容器级 OOM 指标（container_oom_events_total 等）
      # 需 cadvisor/容器采集器前置，而 prometheus.yml 的 scrape 面目前只有 11 个
      # Spring Boot actuator 端点 + prometheus 自身，没有容器指标源。未部署采集器时
      # 以「JVM 堆使用率 > 95% 持续 5m」作为逼近容器 OOMKill 的临界信号（severity
      # 升为 critical，与上方 90% 的 warning 形成阶梯）。部署 cadvisor 后应改写为
      # increase(container_oom_events_total[5m]) > 0 的容器级原生规则。
      - alert: JvmHeapOomRisk
        expr: jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"} > 0.95
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} JVM 堆内存 > 95%（OOM 风险）"
          description: "堆内存使用率 {{ $value | humanizePercentage }} 已持续 5 分钟，逼近容器 OOMKill"
