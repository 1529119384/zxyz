apiVersion: 1
providers:
  - name: 'ZXYZ'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /var/lib/grafana/dashboards
      # 去 Grafana 官网导入 JVM / Spring Boot 仪表盘（如 ID 4701、12900），
      # 将 json 放入 ./deploy/grafana/dashboards 即自动加载；
      # 也可在 UI 中手动添加 panel。
