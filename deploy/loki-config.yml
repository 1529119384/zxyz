# ZXYZ Loki 配置
# 启用 retention 删除，避免日志无限增长。存储落在 /loki（compose 卷挂载）。
server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

compactor_config:
  working_directory: /loki/compactor
  retention_enabled: true
  retention_delete_delay: 60m
  compaction_interval: 10m

limits_config:
  # 日志保留 30 天，超期后由 compactor 定期删除
  retention_period: 30d