# ZXYZ Alertmanager 配置（本地/开发占位，勿提交真实 webhook 地址）
# 生产部署由 scripts/render-alertmanager.sh 渲染 deploy/alertmanager/alertmanager.yml.tmpl
# 生成真实投递配置（webhook / email），详见 .env 中 ALERT_WEBHOOK_URL / ALERT_EMAIL_TO。
# 本文件为未配置渠道时的合法 no-op：告警路由合法但静默丢弃，Alertmanager 仍可启动。

global:
  resolve_timeout: 5m

route:
  receiver: 'default'
  group_by: ['alertname', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  # 未配置渠道时的占位 receiver（无 *_configs），仅使告警路由合法。
  - name: 'default'
