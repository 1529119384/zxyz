# 容器内 nginx TLS 终止配置（opt-in）。
# 仅当 docker-compose.tls.yml 覆盖挂载本文件到 /etc/nginx/conf.d/default.conf
# 且设置 TLS_ENABLED=true 时生效；默认 HTTP 部署完全不受影响。
#
# 证书由 overlay 挂载到 /etc/nginx/certs（只读）。文件名遵循 Let's Encrypt / certbot 约定：
#   fullchain.pem  -> 证书链（含中间证书）
#   privkey.pem    -> 私钥
# 若使用其他文件名，请同步修改下方 ssl_certificate / ssl_certificate_key。

# 共享 http 级指令（limit_req_zone / gzip），与 HTTP 配置共用，避免漂移。
include /etc/nginx/snippets/http-common.conf;

# ---------- 443：TLS 终止 + 反向代理 ----------
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 前端打包产物目录。
    root /usr/share/nginx/html;
    index index.html;

    # 上传、导入数据库等接口可能需要较大请求体。
    # 与网关 MAX_REQUEST_SIZE（默认 512MB）保持一致，避免网关/nginx 两层限制不一致。
    client_max_body_size 512m;

    # 与 HTTP server 完全一致的安全响应头（含 ${OSS_PUBLIC_BASE_URL} 占位，由 entrypoint envsubst 渲染）。
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP 单一来源：仅由本响应头提供；禁止在 index.html 再加 meta CSP（会与本策略取交集且 connect-src 易过宽）
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' ws: wss: ${OSS_PUBLIC_BASE_URL}; img-src 'self' data: blob: https:; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:;" always;

    # 共享 location 段（login/register/api/im-api/ws/assets/index.html/兜底），与 HTTP server 共用。
    include /etc/nginx/snippets/proxy-locations.conf;
}

# ---------- 80：纯重定向到 443（不提供业务内容）----------
server {
    listen 80;
    server_name _;
    # 保留原 Host 与请求路径，避免登录/回调等依赖 Host 的逻辑失效。
    return 301 https://$host$request_uri;
}
