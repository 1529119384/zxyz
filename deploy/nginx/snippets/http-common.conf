# 共享 http 级指令：limit_req_zone / gzip。
# 同时被 default.conf(HTTP) 与 default-ssl.conf(HTTPS) include，避免两处漂移。
# 本片段不含 ${OSS_PUBLIC_BASE_URL}，无需 envsubst 渲染，直接随镜像内置。
limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=100r/s;
limit_req_status 429;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types
    text/plain
    text/css
    text/javascript
    application/json
    application/javascript
    application/xml
    image/svg+xml;
gzip_min_length 256;
