    # 共享 location 段：HTTP(80) 与 HTTPS(443) server 块均 include 本片段，
    # 避免两处配置漂移。注意 ${OSS_PUBLIC_BASE_URL} 由 entrypoint 在渲染本片段时替换
    # （entrypoint 用的是 `envsubst '${OSS_PUBLIC_BASE_URL}'`，变量白名单式替换，
    #  故下文 $http_host / $server_port 等 nginx 变量不会被 envsubst 吃掉）。
    #
    # 🔴 代理必须用 `Host $http_host` 而不是 `Host $host`（C-8 根因，勿回退）：
    #   $host 不含端口，后端据此认为请求来自 80 端口；而浏览器访问的是
    #   http://<ip>:<HTTP_PORT>，其 Origin 带端口 ⇒ Spring 的 CorsUtils 会把一个
    #   同源请求判成跨域，若该 Origin 不在 CORS_ALLOWED_ORIGINS 里，登录等所有 /api
    #   会被 403（实测事故）。$http_host 原样透传 Host 头（含端口）后即为同源，
    #   不再依赖「把 Origin 写进白名单」这种用放宽安全策略抵消配置错误的做法。
    #   同时补 X-Forwarded-Port，供识别 Forwarded 头的上游（网关/应用）还原端口。
    #   注：本改动需重建 frontend-nginx 镜像才生效，`nginx -s reload` 无效。

    location = /api/users/login {
        proxy_pass http://gateway:18000;
        proxy_http_version 1.1;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_read_timeout 300s;
    }

    location = /api/users/register {
        proxy_pass http://gateway:18000;
        proxy_http_version 1.1;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_read_timeout 300s;
    }

    # 所有 API 统一走 Gateway，由 Gateway 根据路径分发到各服务。
    location /api/ {
        limit_req zone=api_per_ip burst=50 nodelay;
        proxy_pass http://gateway:18000;
        proxy_http_version 1.1;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_read_timeout 300s;
    }

    # IM HTTP API：Gateway 负责剥离 /im-api 前缀并路由到 im-service。
    location /im-api {
        limit_req zone=api_per_ip burst=50 nodelay;
        proxy_pass http://gateway:18000;
        proxy_http_version 1.1;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_read_timeout 300s;
    }

    # IM WebSocket：Gateway 路由到 im-service Netty 端口。
    # Sec-WebSocket-Protocol 中携带 Bearer 和 token，必须原样透传。
    location /ws {
        limit_req zone=api_per_ip burst=50 nodelay;
        proxy_pass http://gateway:18000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Vue 构建产物带 hash，长期缓存
    # 安全头需在此重复声明：location 中的 add_header 会覆盖 server 级同名指令
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # connect-src 的 ws/wss 已收窄为**同源 $host**（ISSUE/15 D1-8）：原为裸 `ws: wss:`，等于允许连任意 WebSocket。
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self' ws://$host wss://$host ${OSS_PUBLIC_BASE_URL}; img-src 'self' data: blob: https:; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:;" always;
    }

    # index.html 不缓存，保证更新及时生效
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # connect-src 的 ws/wss 已收窄为**同源 $host**（ISSUE/15 D1-8）：原为裸 `ws: wss:`，等于允许连任意 WebSocket。
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self' ws://$host wss://$host ${OSS_PUBLIC_BASE_URL}; img-src 'self' data: blob: https:; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:;" always;
    }

    # 拒绝一切点文件/点目录（.git/.env/.htaccess 等）——审计 2.3.7 的「无 dotfile 拦截 location」。
    # 放在兜底 location / 之前：正则 location 的优先级高于前缀 location（= 精确匹配除外），
    # 正则要求路径中出现字面量 "/."，因此 /assets/index-abc123.js 这类正常资源不受影响。
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
    }

    # Vue history 模式兜底：非静态文件请求回落到 index.html。
    location / {
        try_files $uri $uri/ /index.html;
    }
