# 共享代理请求头 —— 由 proxy-locations.conf 的每个 location 用 include 引入。
#
# 抽出来的原因（C-51）：同一组 5 行头原先在 5 个 location 里各写一遍（共 25 行），
# 改一次要改 5 处、漏 1 处就产生配置漂移 —— C-8 修正 Host 头时正是这种「改 5 处」的改动。
# 现在只需改本文件一处。
#
# 🔴 必须用 `Host $http_host` 而不是 `$host`（C-8 根因，勿回退）：
#   compose 是 `"${HTTP_PORT:-80}:80"`，容器固定 listen 80 而宿主端口是 ${HTTP_PORT}（生产 8081）。
#   $host 不含端口 ⇒ 后端据此认为请求来自 80 端口，而浏览器 Origin 带端口
#   ⇒ Spring 的 CorsUtils 把同源请求判成跨域 ⇒ 该 Origin 不在 CORS_ALLOWED_ORIGINS 里时
#   登录等所有 /api 直接 403（实测事故）。$http_host 原样透传含端口的 Host 后即为同源，
#   不再依赖「把 Origin 写进白名单」这种用放宽安全策略抵消配置错误的做法。
#   X-Forwarded-Port 供识别 Forwarded 头的上游还原端口。
#
# 本文件是纯静态指令（不含 ${} 占位符），故直接内置到 /etc/nginx/snippets/，不经 envsubst。
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-Port $server_port;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
