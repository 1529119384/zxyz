limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=100r/s;
limit_req_status 429;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types
    text/plain
    text/css
    text/javascript
    application/json
    application/javascript
    application/xml
    image/svg+xml;
gzip_min_length 256;

server {
    listen 80;
    server_name _;

    # 前端打包产物目录。
    root /usr/share/nginx/html;
    index index.html;

    # 上传、导入数据库等接口可能需要较大请求体。
    # 与网关 MAX_REQUEST_SIZE（默认 512MB）保持一致，避免网关/nginx 两层限制不一致。
    client_max_body_size 512m;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' ws: wss: ${OSS_PUBLIC_BASE_URL}; img-src 'self' data: blob: https:; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:;" always;

    location = /api/users/login {
        proxy_pass http://gateway:18000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location = /api/users/register {
        proxy_pass http://gateway:18000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # 所有 API 统一走 Gateway，由 Gateway 根据路径分发到各服务。
    location /api/ {
        limit_req zone=api_per_ip burst=50 nodelay;
        proxy_pass http://gateway:18000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # IM HTTP API：Gateway 负责剥离 /im-api 前缀并路由到 im-service。
    location /im-api {
        limit_req zone=api_per_ip burst=50 nodelay;
        proxy_pass http://gateway:18000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # IM WebSocket：Gateway 路由到 im-service Netty 端口。
    # Sec-WebSocket-Protocol 中携带 Bearer 和 token，必须原样透传。
    location /ws {
        limit_req zone=api_per_ip burst=50 nodelay;
        proxy_pass http://gateway:18000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Vue 构建产物带 hash，长期缓存
    # 安全头需在此重复声明：location 中的 add_header 会覆盖 server 级同名指令
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self' ws: wss: ${OSS_PUBLIC_BASE_URL}; img-src 'self' data: blob: https:; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:;" always;
    }

    # index.html 不缓存，保证更新及时生效
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self' ws: wss: ${OSS_PUBLIC_BASE_URL}; img-src 'self' data: blob: https:; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:;" always;
    }

    # Vue history 模式兜底：非静态文件请求回落到 index.html。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
