# ---------------------------------------------------------------------------
# RabbitMQ 内存水位线（P1-2 修复，2026-10-11）
# 挂载方式（docker-compose.yml rabbitmq 服务）：
#   ./conf/rabbitmq.conf:/etc/rabbitmq/conf.d/99-memory-watermark.conf:ro
#   （RabbitMQ 官方 Docker 镜像自带 /etc/rabbitmq/conf.d/ 目录并按字母序加载其中全部
#     .conf 文件——镜像内已有 10-defaults.conf、20-management_agent.disable_metrics_collector.conf
#     （docker-library/rabbitmq Dockerfile COPY 实证）；99- 前缀保证本文件最后加载。
#     本挂载点已被生产实测验证可用：P1 审计正是从这个文件里读到了旧的 relative = 0.6。）
#
# 【为什么不能用 relative（P1-2 生产实锤否证）】
#   上一版写的是 vm_memory_high_watermark.relative = 0.6，当时注释声称
#   「RabbitMQ 3.12+ 在容器内会探测 cgroup memory limit 并把相对水位锚定到它」。
#   生产实测（rabbitmqctl environment）：0.6 确实加载了，但分母是【宿主机内存
#   7941 MiB】而非容器 limit 384 MiB —— 触发线 ≈ 0.6 × 7941 = 4765 MiB，
#   而容器在 384 MiB 处就会被 cgroup OOM Killer 先杀（2026-10-08 rabbitmq 真实
#   被 OOM 杀过一次）。相对水位形同虚设。
#   官方文档结论一致（docs/3.13/memory §Absolute Memory Limit，tip）：
#   「Using an absolute memory threshold is highly recommended in containerized
#    environments ... RabbitMQ nodes won't always be able to detect the
#    effective cgroups limit」
#
# 【为什么是 230MiB（计算式）】
#   容器 limit = 384 MiB；水位线取 limit 的 ~60% ⇒ 384 × 0.6 = 230.4 MiB
#   ⇒ 取整 230MiB。留 ~154 MiB（40%）给：Erlang GC 峰值（最坏双倍堆）、
#   management 插件、连接/channel 开销、二进制堆之外的非堆占用，
#   让 memory alarm（阻塞发布者、CQv1 page 到盘）在 OOM 之前先触发。
#   注意：水位线不是硬限制——它是「先降级、后被杀」的触发点（官方原话：
#   "The limit does not prevent RabbitMQ nodes from using more than the
#    computed limit, it is merely the point at which publishers are throttled"）。
#
# 【语法依据】
#   RabbitMQ 3.13 rabbitmq.conf（cuttlefish sysctl 格式）：
#     vm_memory_high_watermark.absolute = <整数字节 | 信息单位字符串>
#   单位（源码 rabbit.schema is_supported_information_unit validator，
#   大小写不敏感）：kB/kib/kiB、MB/MiB、GB/GiB、TB/TiB、PB/PiB 等。
#   本文件取十进制惯用形「MiB」（= 2^20 字节，与容器 limit 的 M 口径一致）。
#   ⚠️ 互斥：vm_memory_high_watermark.relative 与 .absolute 只能配一个；
#   同配时 absolute 优先但会打 warning（rabbit.schema translation 逻辑），
#   本文件刻意只留 absolute 一个键。
# ---------------------------------------------------------------------------

vm_memory_high_watermark.absolute = 230MiB

# 【总内存认知对齐 cgroup limit（2026-10-11，53 号验收判据）】
#   RabbitMQ 的「total memory」探测的是宿主物理内存（本机 7941 MiB），不看 cgroup limit——
#   所以 absolute 水位日志会显示「of 7941 MiB total」，展示口径误导排障。
#   total_memory_available_override_value 让 rabbit 把总内存认知对齐容器 limit：
#   生效后日志应为「Memory high watermark set to 230 MiB (241172480 bytes) of 384 MiB (402653184 bytes) total」。
#   384MiB = compose rabbitmq limits.memory 的声明值，两处必须同改。
#   官方文档（3.13 memory）标注：此覆盖仅影响计算/展示，不会改变实际可用内存。
total_memory_available_override_value = 384MiB
