name: CI/CD - Selective Build & Deploy

on:
  push:
    branches: [dev, main]
    tags: ['v*']
    paths:
      - 'ZXYZdatabaseBack/**'
      - 'ZXYZdatabaseFront/**'
      - 'deploy/**'
      - 'docker-compose.yml'
      - '.env.example'
      - '.github/workflows/**'
  pull_request:
    branches: [dev, main]
    paths:
      - 'ZXYZdatabaseBack/**'
      - 'ZXYZdatabaseFront/**'
      - 'deploy/**'
      - 'docker-compose.yml'
      - '.env.example'
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像标签（如 v1.0.0、latest、dev）'
        required: true
        default: 'latest'
      skip_quality:
        description: '跳过质量检查（仅限非保护分支，main/dev 强制检查）'
        required: false
        type: boolean
        default: false
      fast_deploy:
        description: '快速部署（跳过部署健康检查等待）'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  packages: write

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}  # ← GitHub Container Registry
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ============================================================
  # Job 1: 检测哪些服务有变更 + 确定镜像标签
  # ============================================================
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend-common: ${{ steps.filter.outputs.backend-common }}
      project-service: ${{ steps.filter.outputs.project-service }}
      im-service: ${{ steps.filter.outputs.im-service }}
      email-service: ${{ steps.filter.outputs.email-service }}
      user-service: ${{ steps.filter.outputs.user-service }}
      share-service: ${{ steps.filter.outputs.share-service }}
      file-service: ${{ steps.filter.outputs.file-service }}
      team-service: ${{ steps.filter.outputs.team-service }}
      audit-service: ${{ steps.filter.outputs.audit-service }}
      admin-service: ${{ steps.filter.outputs.admin-service }}
      gateway: ${{ steps.filter.outputs.gateway }}
      docker-config: ${{ steps.filter.outputs.docker-config }}
      frontend: ${{ steps.filter.outputs.frontend }}
      backend-any: ${{ steps.backend-any.outputs.changed }}
      tag: ${{ steps.tag.outputs.tag }}
      skip_quality: ${{ steps.skip-quality.outputs.skip_quality }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify sub-repo sync consistency
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "===== 子仓库同步一致性检查 ====="
          DRIFT=0
          for sub in ZXYZdatabaseBack ZXYZdatabaseFront; do
            echo "--- Checking $sub ---"
            git clone --depth 1 --single-branch \
              "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository_owner }}/${sub}.git" \
              "/tmp/${sub}" 2>/dev/null || {
              echo "::warning::无法克隆 ${sub}，跳过同步检查"
              continue
            }

            # 根仓库 HEAD 中该子目录的文件 blob hash
            git ls-tree -r HEAD -- "${sub}/" \
              | awk '{print $3, $4}' \
              | sed "s| ${sub}/| |" \
              | sort -k2 > /tmp/root_${sub}.txt

            # 子仓库 HEAD 的文件 blob hash
            git -C "/tmp/${sub}" ls-tree -r HEAD \
              | awk '{print $3, $4}' \
              | sort -k2 > /tmp/sub_${sub}.txt

            if ! diff -q /tmp/root_${sub}.txt /tmp/sub_${sub}.txt >/dev/null 2>&1; then
              DRIFT=1
              DIFF_COUNT=$(diff /tmp/root_${sub}.txt /tmp/sub_${sub}.txt | grep -c '^[<>]' || true)
              echo "::error::${sub} 不同步！共 ${DIFF_COUNT} 处差异"
              echo "不同步文件列表（前 20 条）:"
              diff /tmp/root_${sub}.txt /tmp/sub_${sub}.txt | grep '^[<>]' | head -20 || true
              echo ""
              echo "修复命令:"
              echo "  cd ${sub} && git add -A && git commit -m 'sync: 同步根仓库变更' && git push"
              echo "  cd .. && git add ${sub}/ && git commit -m 'sync: 更新 ${sub} 引用' && git push"
            else
              echo "[OK] ${sub} 同步一致"
            fi
            rm -rf "/tmp/${sub}" /tmp/root_${sub}.txt /tmp/sub_${sub}.txt
          done

          if [ "$DRIFT" -ne 0 ]; then
            echo ""
            echo "::error::SUBREPO_SYNC_DRIFT: 子仓库与根仓库内容不一致，请同步后重新推送"
            exit 1
          fi
          echo "===== 同步检查通过 ====="

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend-common:
              - 'ZXYZdatabaseBack/pom.xml'
              - 'ZXYZdatabaseBack/zxyz-common/**'
              - 'ZXYZdatabaseBack/Dockerfile'
            project-service:
              - 'ZXYZdatabaseBack/zxyz-project-service/**'
            im-service:
              - 'ZXYZdatabaseBack/zxyz-im-service/**'
            email-service:
              - 'ZXYZdatabaseBack/zxyz-email-service/**'
            user-service:
              - 'ZXYZdatabaseBack/zxyz-user-service/**'
            share-service:
              - 'ZXYZdatabaseBack/zxyz-share-service/**'
            file-service:
              - 'ZXYZdatabaseBack/zxyz-file-service/**'
            team-service:
              - 'ZXYZdatabaseBack/zxyz-team-service/**'
            audit-service:
              - 'ZXYZdatabaseBack/zxyz-audit-service/**'
            admin-service:
              - 'ZXYZdatabaseBack/zxyz-admin-service/**'
            gateway:
              - 'ZXYZdatabaseBack/zxyz-gateway/**'
            docker-config:
              - 'docker-compose.yml'
              - '.env.example'
            frontend:
              - 'ZXYZdatabaseFront/**'

      - name: Check if any backend changed
        id: backend-any
        run: |
          if [ "${{ steps.filter.outputs.backend-common }}" = "true" ] || \
             [ "${{ steps.filter.outputs.project-service }}" = "true" ] || \
             [ "${{ steps.filter.outputs.im-service }}" = "true" ] || \
             [ "${{ steps.filter.outputs.email-service }}" = "true" ] || \
             [ "${{ steps.filter.outputs.user-service }}" = "true" ] || \
             [ "${{ steps.filter.outputs.share-service }}" = "true" ] || \
             [ "${{ steps.filter.outputs.file-service }}" = "true" ] || \
             [ "${{ steps.filter.outputs.team-service }}" = "true" ] || \
             [ "${{ steps.filter.outputs.audit-service }}" = "true" ] || \
             [ "${{ steps.filter.outputs.admin-service }}" = "true" ] || \
             [ "${{ steps.filter.outputs.gateway }}" = "true" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Determine image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            echo "tag=dev" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=dev" >> $GITHUB_OUTPUT
          fi

      - name: Determine skip quality
        id: skip-quality
        run: |
          REQUESTED="${{ github.event.inputs.skip_quality || 'false' }}"
          BRANCH="${{ github.ref_name }}"
          ACTOR="${{ github.actor }}"

          # 保护分支（main/dev）永远不允许跳过质量检查
          if [ "$BRANCH" = "main" ] || [ "$BRANCH" = "dev" ]; then
            if [ "$REQUESTED" = "true" ]; then
              echo "::warning::[AUDIT] skip_quality=true was requested by '${ACTOR}' on protected branch '${BRANCH}' — DENIED. Quality checks are mandatory for protected branches."
            fi
            echo "skip_quality=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 非保护分支：允许跳过，但必须使用非 latest 的显式镜像标签并记录审计日志
          if [ "$REQUESTED" = "true" ]; then
            TAG_INPUT="${{ github.event.inputs.tag || '' }}"
            if [ -z "$TAG_INPUT" ] || [ "$TAG_INPUT" = "latest" ]; then
              echo "::error::SKIP_QUALITY_TAG_DENIED: skip_quality=true 时必须指定非 latest 的显式镜像标签（当前: '${TAG_INPUT:-<empty>}'），以防未经质量检查的镜像覆盖 latest"
              exit 1
            fi
            echo "::warning::[AUDIT] skip_quality=true | actor=${ACTOR} | branch=${BRANCH} | ref=${{ github.ref }} | tag=${TAG_INPUT} | run_id=${{ github.run_id }} | triggered_at=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "skip_quality=true" >> $GITHUB_OUTPUT
          else
            echo "skip_quality=false" >> $GITHUB_OUTPUT
          fi

  # ============================================================
  # Job 1.5: Flyway 迁移门禁
  # 守卫两类会导致生产 Flyway 失败 / 非确定性的提交：
  #   1) 重复版本号：同一服务内两个迁移文件共享同一 V<num>__ 前缀（按「服务:版本」判重，
  #      跨服务的同版本号各走独立 flyway_schema_history，属合法重复，不拦截）。
  #   2) 篡改已发布迁移：修改已存在于基线分支的迁移文件（迁移必须只追加）。
  # 另外拒绝不合规的文件名（缺 __ 或使用非法字符）。
  # 在 PR 上基于 github.base_ref 做 diff；push 事件无 base_ref 时优雅降级。
  # ============================================================
  flyway-check:
    needs: detect-changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so we can diff against the base branch

      - name: Flyway version number dedup
        run: |
          # Collect all migration files, exclude any target/ build output paths
          mapfile -t FILES < <(git ls-files 'ZXYZdatabaseBack/*/src/main/resources/db/migration/V*.sql' | grep -v '/target/' || true)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No Flyway migration files found; skipping dedup."
            exit 0
          fi

          # key = "service:version" — each service owns an independent
          # flyway_schema_history, so a version may legitimately repeat across
          # services; only a duplicate *within the same service* is a real conflict.
          declare -A VERSION_MAP
          for f in "${FILES[@]}"; do
            svc="$(echo "$f" | cut -d/ -f2)"   # ZXYZdatabaseBack/<svc>/...
            ver="$(basename "$f" | sed -nE 's/^V([0-9]+)__.*\.sql$/\1/p')"
            [ -z "$ver" ] && continue
            VERSION_MAP["${svc}:${ver}"]="${VERSION_MAP[${svc}:${ver}]:-} $f"
          done

          DUP_FOUND=0
          for key in "${!VERSION_MAP[@]}"; do
            n=$(echo ${VERSION_MAP[$key]} | wc -w)
            if [ "$n" -gt 1 ]; then
              DUP_FOUND=1
              echo "::error::FLYWAY_DUP_VERSION: key '${key}' appears in:${VERSION_MAP[$key]}"
            fi
          done

          if [ "$DUP_FOUND" -ne 0 ]; then
            exit 1
          fi
          echo "Flyway version dedup: no duplicates found."

      - name: Flyway filename sanity
        run: |
          mapfile -t FILES < <(git ls-files 'ZXYZdatabaseBack/*/src/main/resources/db/migration/V*.sql' | grep -v '/target/' || true)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No Flyway migration files found; skipping filename check."
            exit 0
          fi

          BAD=0
          for f in "${FILES[@]}"; do
            base="$(basename "$f")"
            # Reject anything not matching ^V[0-9]+__[A-Za-z0-9_]+\.sql$
            if ! printf '%s' "$base" | grep -qE '^V[0-9]+__[A-Za-z0-9_]+\.sql$'; then
              BAD=1
              echo "::error::FLYWAY_BAD_FILENAME: '$f' does not match ^V<num>__<name>.sql$"
            fi
          done

          if [ "$BAD" -ne 0 ]; then
            exit 1
          fi
          echo "Flyway filename sanity: all filenames valid."

      - name: Reject modifying applied migrations (diff guard)
        run: |
          FAIL=0
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.base_ref }}"
            git fetch origin "$BASE" --quiet 2>/dev/null || true
            # diff guard: status 'M' on an existing db/migration/*.sql = modified applied migration
            while IFS=$'\t' read -r status path; do
              case "$path" in
                *db/migration/*.sql)
                  case "$status" in
                    M|R*)
                      echo "::error::FLYWAY_MODIFIED_APPLIED: ${path} modifies/renames an already-released migration — migrations must be append-only"
                      FAIL=1
                      ;;
                  esac
                  ;;
              esac
            done < <(git diff --name-status "origin/${BASE}...HEAD" 2>/dev/null || true)
          elif [ "${{ github.event_name }}" = "push" ]; then
            # push: no base_ref. Fall back to origin/dev if it exists.
            if git rev-parse --verify origin/dev >/dev/null 2>&1; then
              echo "push event without base_ref; falling back to origin/dev for modify-guard."
              while IFS=$'\t' read -r status path; do
                case "$path" in
                  *db/migration/*.sql)
                    case "$status" in
                      M|R*)
                        echo "::error::FLYWAY_MODIFIED_APPLIED: ${path} modifies/renames an already-released migration — migrations must be append-only"
                        FAIL=1
                        ;;
                    esac
                    ;;
                esac
              done < <(git diff --name-status "origin/dev...HEAD" 2>/dev/null || true)
            else
              echo "::warning::push event without base_ref and origin/dev missing; skipping modify-guard (dedup + filename checks already ran)"
            fi
          else
            echo "::warning::event ${{ github.event_name }} has no base_ref; skipping modify-guard"
          fi

          if [ "$FAIL" -ne 0 ]; then
            exit 1
          fi
          echo "Flyway modify-guard: no already-released migrations were modified."

  # ============================================================
  # Job 2: 后端质量检查
  # ============================================================
  quality-check-backend:
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.backend-any == 'true' &&
      needs.detect-changes.outputs.skip_quality != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Backend compile and test
        run: cd ZXYZdatabaseBack && mvn -B test

  # ============================================================
  # Job 2.5: 前端质量检查
  # ============================================================
  quality-check-frontend:
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.frontend == 'true' &&
      needs.detect-changes.outputs.skip_quality != 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ZXYZdatabaseFront
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ZXYZdatabaseFront/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

  # ============================================================
  # Job 3: 构建并推送镜像（只构建有变更的服务，仅 push 触发）
  # ============================================================
  build-and-push:
    needs: [detect-changes, quality-check-backend, quality-check-frontend]
    # 显式白名单：质量 job 必须 success；skipped 仅在两种情况下豁免——
    # 1) 对应变更面不存在（前端无变更）；2) skip_quality=true 且已在 detect-changes 通过审计（强制非 latest 显式 tag）
    if: |
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.detect-changes.outputs.backend-any == 'true' &&
      (
        needs.quality-check-backend.result == 'success' ||
        (needs.quality-check-backend.result == 'skipped' && needs.detect-changes.outputs.skip_quality == 'true')
      ) &&
      (
        needs.quality-check-frontend.result == 'success' ||
        (needs.quality-check-frontend.result == 'skipped' &&
          (needs.detect-changes.outputs.frontend != 'true' || needs.detect-changes.outputs.skip_quality == 'true'))
      )
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # 后端 9 个服务（is_backend=true → backend-common 变更时也重建）
          - name: project-service
            context: .
            dockerfile: ZXYZdatabaseBack/Dockerfile
            module: zxyz-project-service
            change: ${{ needs.detect-changes.outputs.project-service }}
            is_backend: true
          - name: im-service
            context: .
            dockerfile: ZXYZdatabaseBack/Dockerfile
            module: zxyz-im-service
            change: ${{ needs.detect-changes.outputs.im-service }}
            is_backend: true
          - name: email-service
            context: .
            dockerfile: ZXYZdatabaseBack/Dockerfile
            module: zxyz-email-service
            change: ${{ needs.detect-changes.outputs.email-service }}
            is_backend: true
          - name: user-service
            context: .
            dockerfile: ZXYZdatabaseBack/Dockerfile
            module: zxyz-user-service
            change: ${{ needs.detect-changes.outputs.user-service }}
            is_backend: true
          - name: share-service
            context: .
            dockerfile: ZXYZdatabaseBack/Dockerfile
            module: zxyz-share-service
            change: ${{ needs.detect-changes.outputs.share-service }}
            is_backend: true
          - name: file-service
            context: .
            dockerfile: ZXYZdatabaseBack/Dockerfile
            module: zxyz-file-service
            change: ${{ needs.detect-changes.outputs.file-service }}
            is_backend: true
          - name: team-service
            context: .
            dockerfile: ZXYZdatabaseBack/Dockerfile
            module: zxyz-team-service
            change: ${{ needs.detect-changes.outputs.team-service }}
            is_backend: true
          - name: audit-service
            context: .
            dockerfile: ZXYZdatabaseBack/Dockerfile
            module: zxyz-audit-service
            change: ${{ needs.detect-changes.outputs.audit-service }}
            is_backend: true
          - name: admin-service
            context: .
            dockerfile: ZXYZdatabaseBack/Dockerfile
            module: zxyz-admin-service
            change: ${{ needs.detect-changes.outputs.admin-service }}
            is_backend: true
          - name: gateway
            context: .
            dockerfile: ZXYZdatabaseBack/Dockerfile
            module: zxyz-gateway
            change: ${{ needs.detect-changes.outputs.gateway }}
            is_backend: true
    steps:
      - name: Check if needs build
        id: should-build
        run: |
          # 后端服务：自身变更 || backend-common 变更
          if [ "${{ matrix.change }}" = "true" ] || \
             ([ "${{ matrix.is_backend }}" = "true" ] && [ "${{ needs.detect-changes.outputs.backend-common }}" = "true" ]); then
            echo "build=true" >> $GITHUB_OUTPUT
          else
            echo "build=false" >> $GITHUB_OUTPUT
            echo "⏭️ Skip: ${{ matrix.name }} (no changes)"
          fi

      - name: Checkout code
        if: steps.should-build.outputs.build == 'true'
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: steps.should-build.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: steps.should-build.outputs.build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Audit annotation for quality bypass
        if: steps.should-build.outputs.build == 'true' && needs.detect-changes.outputs.skip_quality == 'true'
        run: |
          echo "::warning::[AUDIT] BUILD_WITHOUT_QUALITY_CHECK | image=zxyz-${{ matrix.name }}:${{ needs.detect-changes.outputs.tag }} | actor=${{ github.actor }} | branch=${{ github.ref_name }} | run_id=${{ github.run_id }}"

      - name: Build and push
        if: steps.should-build.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: MODULE=${{ matrix.module }}
          labels: |
            zxyz.ci.quality-check-skipped=${{ needs.detect-changes.outputs.skip_quality }}
            zxyz.ci.run-id=${{ github.run_id }}
            zxyz.ci.actor=${{ github.actor }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/zxyz-${{ matrix.name }}:${{ needs.detect-changes.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}/zxyz-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # Job 3.5: 镜像安全扫描（Trivy，仅扫描实际构建的镜像）
  # 在 build-and-push 之后对所有后端镜像执行 SCA 漏洞扫描。
  # HIGH/CRITICAL 漏洞会导致本 job 失败，从而整条 run 变红。
  # 说明：
  #   - ignore-unfixed: true 只告警可修复漏洞，避免噪音
  #   - 若某个已知漏洞已在外部组件修复但尚无新镜像，可在必要时通过
  #     ignore 配置临时豁免（见下方示例，勿长期使用）
  #   - builder 现已改用官方 maven:3.9-eclipse-temurin-17（在 Docker Hub，
  #     可被 Trivy 按 tag 拉取扫描）。
  # ============================================================
  security-scan:
    needs: [detect-changes, build-and-push]
    if: |
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.detect-changes.outputs.backend-any == 'true' &&
      needs.build-and-push.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      # 一个服务检出漏洞不取消其他服务的扫描：一次看全全部服务的漏洞面
      fail-fast: false
      matrix:
        include:
          - name: project-service
            change: ${{ needs.detect-changes.outputs.project-service }}
            is_backend: true
          - name: im-service
            change: ${{ needs.detect-changes.outputs.im-service }}
            is_backend: true
          - name: email-service
            change: ${{ needs.detect-changes.outputs.email-service }}
            is_backend: true
          - name: user-service
            change: ${{ needs.detect-changes.outputs.user-service }}
            is_backend: true
          - name: share-service
            change: ${{ needs.detect-changes.outputs.share-service }}
            is_backend: true
          - name: file-service
            change: ${{ needs.detect-changes.outputs.file-service }}
            is_backend: true
          - name: team-service
            change: ${{ needs.detect-changes.outputs.team-service }}
            is_backend: true
          - name: audit-service
            change: ${{ needs.detect-changes.outputs.audit-service }}
            is_backend: true
          - name: admin-service
            change: ${{ needs.detect-changes.outputs.admin-service }}
            is_backend: true
          - name: gateway
            change: ${{ needs.detect-changes.outputs.gateway }}
            is_backend: true
    steps:
      # 仅当该服务真实构建过才扫描（与 build-and-push 的 should-build 逻辑一致）
      - name: Check if image was built
        id: was-built
        run: |
          if [ "${{ matrix.change }}" = "true" ] || \
             ([ "${{ matrix.is_backend }}" = "true" ] && [ "${{ needs.detect-changes.outputs.backend-common }}" = "true" ]); then
            echo "built=true" >> $GITHUB_OUTPUT
          else
            echo "built=false" >> $GITHUB_OUTPUT
            echo "⏭️ Skip scan: ${{ matrix.name }} (not built)"
          fi

      - name: Login to GHCR
        if: steps.was-built.outputs.built == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan image with Trivy
        if: steps.was-built.outputs.built == 'true'
        # tag 必须带 v 前缀（aquasecurity/trivy-action 的 release tag 均为 vX.Y.Z，
        # 无前缀的 0.29.0 从未存在，会导致 unable to resolve action）
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/zxyz-${{ matrix.name }}:${{ needs.detect-changes.outputs.tag }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '1'
          output: trivy-${{ matrix.name }}.txt

      # Trivy 漏洞表写入 output 文件而非 stdout：job 因 exit-code 失败时
      # 必须在日志里可见漏洞详情，否则无法评估修复
      - name: Show Trivy report
        if: always() && steps.was-built.outputs.built == 'true'
        run: |
          if [ -f "trivy-${{ matrix.name }}.txt" ]; then
            echo "===== Trivy report: ${{ matrix.name }} ====="
            cat "trivy-${{ matrix.name }}.txt"
          else
            echo "No trivy report file (scan may have failed before writing)"
          fi

      - name: Upload Trivy report (SARIF output with HIGH/CRITICAL summary)
        if: always() && steps.was-built.outputs.built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.name }}
          path: trivy-${{ matrix.name }}.txt
          if-no-files-found: ignore

  # ============================================================
  # Job 4: 部署到服务器（仅 push 触发且有镜像构建时）
  # ============================================================
  deploy:
    needs: [detect-changes, build-and-push]
    runs-on: ubuntu-latest
    if: always() && needs.build-and-push.result == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && 'production' || 'development' }}
    steps:
      - name: Determine deploy target
        id: target
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ] || [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "host=${{ secrets.PROD_DEPLOY_HOST }}" >> $GITHUB_OUTPUT
            echo "env=production" >> $GITHUB_OUTPUT
          else
            echo "host=${{ (secrets.DEV_DEPLOY_HOST || secrets.DEPLOY_HOST) }}" >> $GITHUB_OUTPUT
            echo "env=development" >> $GITHUB_OUTPUT
          fi

      - name: Determine SSH key
        id: ssh-key
        run: |
          # SSH 私钥是多行 PEM，GITHUB_ENV 单行 name=value 格式无法承载
          # （会报 Invalid format），必须用 heredoc 定界符语法写入多行值。
          if [[ "${{ github.ref }}" == "refs/heads/main" ]] || [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            {
              echo "ssh_key<<GH_SSH_KEY_EOF"
              echo "${{ secrets.PROD_SSH_KEY }}"
              echo "GH_SSH_KEY_EOF"
            } >> "$GITHUB_ENV"
          else
            {
              echo "ssh_key<<GH_SSH_KEY_EOF"
              echo "${{ (secrets.DEV_SSH_KEY || secrets.DEPLOY_SSH_KEY) }}"
              echo "GH_SSH_KEY_EOF"
            } >> "$GITHUB_ENV"
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          FAST_DEPLOY: ${{ github.event.inputs.fast_deploy || 'false' }}
          BACKEND_COMMON: ${{ needs.detect-changes.outputs.backend-common }}
          PROJECT_SVC: ${{ needs.detect-changes.outputs.project-service }}
          IM_SVC: ${{ needs.detect-changes.outputs.im-service }}
          EMAIL_SVC: ${{ needs.detect-changes.outputs.email-service }}
          USER_SVC: ${{ needs.detect-changes.outputs.user-service }}
          SHARE_SVC: ${{ needs.detect-changes.outputs.share-service }}
          FILE_SVC: ${{ needs.detect-changes.outputs.file-service }}
          TEAM_SVC: ${{ needs.detect-changes.outputs.team-service }}
          AUDIT_SVC: ${{ needs.detect-changes.outputs.audit-service }}
          ADMIN_SVC: ${{ needs.detect-changes.outputs.admin-service }}
          GATEWAY_SVC: ${{ needs.detect-changes.outputs.gateway }}
          DOCKER_CFG: ${{ needs.detect-changes.outputs.docker-config }}
        with:
          host: ${{ steps.target.outputs.host }}
          username: ${{ secrets.DEPLOY_USERNAME }}
          key: ${{ env.ssh_key }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          timeout: 600s
          envs: BACKEND_COMMON,PROJECT_SVC,IM_SVC,EMAIL_SVC,USER_SVC,SHARE_SVC,FILE_SVC,TEAM_SVC,AUDIT_SVC,ADMIN_SVC,GATEWAY_SVC,DOCKER_CFG,FAST_DEPLOY
          script: |
            #!/bin/bash
            set -euo pipefail

            DEPLOY_DIR="${{ secrets.DEPLOY_PATH || '/www/zxyz' }}"
            # 为什么：部署必须消费「不可变」tag，否则回滚无效。
            # build-and-push 已把镜像同时打了 dev/latest（可变）与 github.sha（不可变）两个 tag，
            # 这里只用 40 位全量 commit sha，与 :409 已推送的 sha tag 精确匹配；
            # .env.previous 复制出的旧 .env 也含旧 sha，rollback.sh 拉取 ...:<旧sha> 才能精确回滚。
            IMAGE_TAG="${{ github.sha }}"
            IMAGE_PREFIX="${{ env.IMAGE_PREFIX }}"
            cd "$DEPLOY_DIR"

            echo "===== Deploying to ${{ steps.target.outputs.env }} ====="
            echo "Image tag: $IMAGE_TAG"

            # --- 预部署备份（回滚前的最后一道防线：先备 MySQL，再覆盖）---
            # 为什么：部署会覆盖旧镜像/旧 .env，若部署中途失败且无备份则无回退点。
            # 此处只备 MySQL（状态核心，且快），全量/异地备份仍由 crontab 跑 backup.sh 完成。
            # 在 set -euo pipefail 下，backup.sh 返回非 0 即中止部署——这正是想要的行为。
            echo "===== Pre-deploy MySQL backup ====="
            if [ -f "$DEPLOY_DIR/scripts/backup.sh" ]; then
              if ! bash "$DEPLOY_DIR/scripts/backup.sh" --mysql-only; then
                echo "::error::PRE_DEPLOY_BACKUP_FAILED: 预部署 MySQL 备份失败，已中止部署以防无回退点"
                exit 1
              fi
              echo "::notice::PRE_DEPLOY_BACKUP_OK: 预部署 MySQL 备份完成"
            else
              echo "::warning::跳过预部署备份（backup.sh 不存在）"
            fi

            # --- 首次部署自动生成机密（幂等，已有值不覆盖）---
            # 为什么：新环境 .env 里一堆 CHANGE_ME_* 占位符强密码需手填，体验极差。
            # 本步骤在「校验/部署」之前、且独立于 REPO_DIR 是否存在，自动生成纯本地的
            # 系统内部机密（DB/Redis/RabbitMQ/Nacos/Jasypt/Grafana 等），写回 .env 持久化，
            # 完整值仅落服务器本地 init-secrets.log（chmod 600），终端只打码，不进 CI 公开日志。
            # 幂等：已有非占位符值跳过，避免重启后换密码破坏 MySQL/Redis/Jasypt 连接与跨服务 token 一致。
            # 外部凭证（OSS 访问密钥/邮箱密码/前端地址等）init-secrets.sh 不生成，仍由后续 validate-env 拦截手填。
            echo "===== Initializing secrets (if missing) ====="
            # 注意：不再要求 .env 预先存在 —— init-secrets.sh 自身在 .env 缺失时会
            # 自动从 .env.example 复制（N5）。此前要求「脚本与 .env 同时存在」，
            # 导致全新服务器直接跳过初始化，随后 compose 解析 ${SVC_GATEWAY_KEY:?...}
            # 硬失败（报错信息与真实原因相距很远，极难定位）。
            if [ -f "$DEPLOY_DIR/scripts/init-secrets.sh" ]; then
              if ! bash "$DEPLOY_DIR/scripts/init-secrets.sh" "$DEPLOY_DIR/.env"; then
                echo "::error::INIT_SECRETS_FAILED: 首次部署机密初始化失败，已中止部署"
                exit 1
              fi
            else
              echo "::warning::跳过机密初始化（init-secrets.sh 不存在）"
            fi

            # --- 记录当前版本用于回滚 ---
            echo "===== Recording current version for rollback ====="
            if [ -f "$DEPLOY_DIR/.env" ]; then
              if grep -qE "^APP_IMAGE_TAG=" "$DEPLOY_DIR/.env" 2>/dev/null; then
                cp "$DEPLOY_DIR/.env" "$DEPLOY_DIR/.env.previous"
                echo "Current tag recorded to .env.previous"
              else
                echo "WARN: APP_IMAGE_TAG not found in .env, skip rollback record"
              fi
            fi

            # --- 配置同步 ---
            REPO_DIR="${DEPLOY_DIR}-repo"
            UP_FLAGS=""
            if [ -d "$REPO_DIR" ]; then
              # --- 验签 .env（生产门禁）——在拉取/部署之前执行，失败即中止部署 ---
              # validate-env.sh 在检测到必需变量缺失/占位符(EERROR)时返回 1。
              # 此处不使用 --sync-only（它会跳过全部校验，等同于无效），
              # 也不吞掉失败；校验失败即硬失败中止部署。
              # --prod 门禁已是脚本默认行为（Nacos/RabbitMQ/OSS 等生产敏感项只在
              # 校验通过时放行）；此脚本当前不识别 --prod 参数，故直接用完整校验。
              if [ -f "$DEPLOY_DIR/scripts/validate-env.sh" ] && [ -f "$DEPLOY_DIR/.env" ]; then
                echo "===== Validating .env (prod gate) ====="
                if ! bash "$DEPLOY_DIR/scripts/validate-env.sh" "$DEPLOY_DIR/.env"; then
                  echo "::error::VALIDATE_ENV_FAILED: .env 校验未通过（必需变量缺失或仍为占位符），已中止部署"
                  exit 1
                fi
                echo "::notice::VALIDATE_ENV_PASSED: .env 校验通过"
                echo ""
              else
                echo "::warning::跳过 .env 校验（validate-env.sh 或 .env 不存在）"
              fi

              OLD_HASH=$(md5sum "$DEPLOY_DIR/docker-compose.yml" 2>/dev/null | cut -d' ' -f1)
              cd "$REPO_DIR" && git pull --ff-only -q

              # --- 漂移检测：拉取后若工作区非空即中止并要求人工确认 ---
              echo "===== 检测部署配置仓库工作区漂移 ====="
              DRIFT_OUTPUT=$(git -C "$REPO_DIR" status --porcelain)
              if [ -n "$DRIFT_OUTPUT" ]; then
                echo "::error::GIT_DRIFT_DETECTED: $REPO_DIR 工作区存在未提交/漂移变更"
                printf '%s\n' "$DRIFT_OUTPUT"
                echo "::error::若确需保留这些变更请人工确认并提交；在清理漂移前 CI 部署已中止，以防配置文件被静默覆盖"
                exit 1
              fi
              echo "工作区清洁，无漂移"

              cp "$REPO_DIR/docker-compose.yml" "$DEPLOY_DIR/docker-compose.yml"
              cd "$DEPLOY_DIR"
              NEW_HASH=$(md5sum "$DEPLOY_DIR/docker-compose.yml" | cut -d' ' -f1)
              [ "$OLD_HASH" != "$NEW_HASH" ] && UP_FLAGS="--force-recreate" && echo "docker-compose.yml changed, will force-recreate"
            fi

            # --- 更新 .env ---
            sed -i "s|^APP_IMAGE_TAG=.*|APP_IMAGE_TAG=$IMAGE_TAG|" .env 2>/dev/null || echo "APP_IMAGE_TAG=$IMAGE_TAG" >> .env
            PREFIX="${IMAGE_PREFIX%/}/"
            sed -i "s|^IMAGE_PREFIX=.*|IMAGE_PREFIX=$PREFIX|" .env 2>/dev/null || echo "IMAGE_PREFIX=$PREFIX" >> .env

            # --- 筛选需要更新的服务 ---
            UPDATE_SVC=()
            if [ "$BACKEND_COMMON" = "true" ]; then
              UPDATE_SVC+=(project-service im-service email-service user-service share-service file-service team-service audit-service admin-service gateway)
            else
              [ "$PROJECT_SVC" = "true" ] && UPDATE_SVC+=(project-service)
              [ "$IM_SVC" = "true" ] && UPDATE_SVC+=(im-service)
              [ "$EMAIL_SVC" = "true" ] && UPDATE_SVC+=(email-service)
              [ "$USER_SVC" = "true" ] && UPDATE_SVC+=(user-service)
              [ "$SHARE_SVC" = "true" ] && UPDATE_SVC+=(share-service)
              [ "$FILE_SVC" = "true" ] && UPDATE_SVC+=(file-service)
              [ "$TEAM_SVC" = "true" ] && UPDATE_SVC+=(team-service)
              [ "$AUDIT_SVC" = "true" ] && UPDATE_SVC+=(audit-service)
              [ "$ADMIN_SVC" = "true" ] && UPDATE_SVC+=(admin-service)
              [ "$GATEWAY_SVC" = "true" ] && UPDATE_SVC+=(gateway)
            fi
            [ "$DOCKER_CFG" = "true" ] && UPDATE_SVC=(project-service im-service email-service user-service share-service file-service team-service audit-service admin-service gateway)

            if [ ${#UPDATE_SVC[@]} -eq 0 ]; then
              echo "No service changed, skip deploy"
              exit 0
            fi
            echo "Will update: ${UPDATE_SVC[*]}"

            # --- 并行拉取镜像 ---
            echo "===== Pulling images ====="
            for svc in "${UPDATE_SVC[@]}"; do
              docker compose pull "$svc" &
            done
            wait
            echo "Pull finished"

            # --- 重启变更服务 ---
            echo "===== Restarting services ====="
            docker compose up -d $UP_FLAGS "${UPDATE_SVC[@]}"

            # --- 健康检查（fast_deploy 时跳过） ---
            if [ "$FAST_DEPLOY" = "true" ]; then
              echo "===== Fast deploy: skipping health checks, sleep 10s ====="
              sleep 10
            else
              HEALTH_OK=true

              # --- 分层健康检查 ---
              # 普通服务：6 次 × 5s = 30s
              echo "===== Waiting for common services ====="
              for i in $(seq 1 6); do
                if ! docker compose ps 2>/dev/null | grep -qE "(im-service|email-service|user-service|share-service|file-service|team-service|audit-service|admin-service).*(unhealthy|starting)"; then
                  echo "Common services ready"
                  break
                fi
                if [ "$i" -eq 6 ]; then
                  echo "ERROR: Common services not all healthy after 30s"
                  echo "--- 诊断: 容器状态 ---"
                  docker compose ps 2>/dev/null || true
                  echo "--- 诊断: 最近日志 ---"
                  for svc in im-service email-service user-service share-service file-service team-service audit-service admin-service; do
                    echo ">>> $svc <<<"
                    docker logs --tail 20 "zxyz-$svc" 2>&1 || true
                  done
                  HEALTH_OK=false
                fi
                sleep 5
              done

              # Gateway：12 次 × 5s = 60s
              if [ "$HEALTH_OK" = true ]; then
                echo "===== Waiting for gateway ====="
                for i in $(seq 1 12); do
                  if ! docker compose ps 2>/dev/null | grep -qE "gateway.*(unhealthy|starting)"; then
                    echo "Gateway ready"
                    break
                  fi
                  if [ "$i" -eq 12 ]; then
                    echo "ERROR: Gateway startup timeout after 60s"
                    echo "--- 诊断: 容器状态 ---"
                    docker compose ps 2>/dev/null || true
                    echo "--- 诊断: gateway 最近日志 ---"
                    docker logs --tail 30 zxyz-gateway 2>&1 || true
                    HEALTH_OK=false
                  fi
                  sleep 5
                done
              fi

              # --- 健康检查失败 → 自动回滚 ---
              if [ "$HEALTH_OK" = false ]; then
                echo "::error::HEALTH_CHECK_FAILED: triggering automatic rollback"
                echo "===== Starting automatic rollback ====="

                if [ -f "$DEPLOY_DIR/.env.previous" ]; then
                  PREV_TAG=$(sed -n 's/^APP_IMAGE_TAG=//p' "$DEPLOY_DIR/.env.previous" 2>/dev/null | head -1)
                  if [ -n "$PREV_TAG" ]; then
                    echo "Rolling back to previous tag: $PREV_TAG"

                    # 恢复 .env 到上一版本
                    sed -i "s|^APP_IMAGE_TAG=.*|APP_IMAGE_TAG=$PREV_TAG|" .env 2>/dev/null || true

                    # 拉取上一版本镜像
                    echo "===== Pulling previous version images ====="
                    for svc in "${UPDATE_SVC[@]}"; do
                      docker compose pull "$svc" &
                    done
                    wait
                    echo "Pull complete"

                    # 重启服务
                    echo "===== Restarting with previous version ====="
                    docker compose up -d "${UPDATE_SVC[@]}"

                    # 回滚后健康检查：6 次 × 10s = 60s
                    echo "===== Verifying rollback health ====="
                    ROLLBACK_OK=false
                    for i in $(seq 1 6); do
                      if ! docker compose ps 2>/dev/null | grep -qE "(unhealthy|starting)"; then
                        ROLLBACK_OK=true
                        echo "Rollback health check passed (${i}0s)"
                        break
                      fi
                      sleep 10
                    done

                    if [ "$ROLLBACK_OK" = true ]; then
                      echo "===== Rollback successful: services restored to $PREV_TAG ====="
                      docker compose ps
                      echo "::notice::AUTO_ROLLBACK_SUCCESS: reverted to $PREV_TAG"
                      exit 0
                    else
                      echo "::error::ROLLBACK_HEALTH_FAILED: services still unhealthy after rollback"
                      docker compose ps 2>/dev/null || true
                      exit 1
                    fi
                  else
                    echo "::error::ROLLBACK_FAILED: APP_IMAGE_TAG empty in .env.previous"
                    exit 1
                  fi
                else
                  echo "::error::ROLLBACK_FAILED: .env.previous not found, cannot auto-rollback"
                  exit 1
                fi
              fi
            fi

            echo "===== Container status ====="
            docker compose ps
            echo "===== Deploy complete ====="
