name: CI/CD - Selective Build & Deploy

on:
  push:
    branches: [dev, main]
    tags: ['v*']
    paths:
      - 'ZXYZdatabaseBack/**'
      - 'ZXYZdatabaseFront/**'
      - 'deploy/**'
      - 'docker-compose.yml'
      - '.env.example'
      - '.gitleaks.toml'
      - '.github/workflows/**'
  pull_request:
    branches: [dev, main]
    paths:
      - 'ZXYZdatabaseBack/**'
      - 'ZXYZdatabaseFront/**'
      - 'deploy/**'
      - 'docker-compose.yml'
      - '.env.example'
      - '.gitleaks.toml'
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像标签（如 v1.0.0、latest、dev）'
        required: true
        default: 'latest'
      skip_quality:
        description: '跳过质量检查（仅限非保护分支，main/dev 强制检查）'
        required: false
        type: boolean
        default: false
      fast_deploy:
        description: '快速部署（跳过部署健康检查等待）'
        required: false
        type: boolean
        default: false
      force_deploy:
        description: '强制全量构建并部署（忽略变更检测；用于换服务器/灾后首次部署）'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # 审计 2.3.2：原为 true。含 deploy 的整条流水线被取消时，正在执行的
  # `docker compose up -d` 会被中途杀掉，留下「部分服务新镜像、部分旧镜像」的半更新状态，
  # 且其后的健康检查与失败回滚都来不及跑。改为 false：同一 ref 的多次 push 串行排队执行，
  # 每次部署都能完整跑完（部署幂等，最后完成的那次生效），代价只是多花 CI 分钟。
  cancel-in-progress: false

permissions:
  packages: write

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}  # ← GitHub Container Registry
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ============================================================
  # Job 1: 检测哪些服务有变更 + 确定镜像标签
  # ============================================================
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      # force_deploy=true（手动 dispatch）时忽略变更检测，全部按"有变更"处理——
      # 用于换服务器/灾后首次部署：无代码变更也要全量构建并部署。
      backend-common: ${{ steps.force.outputs.on == 'true' && 'true' || steps.filter.outputs.backend-common }}
      project-service: ${{ steps.force.outputs.on == 'true' && 'true' || steps.filter.outputs.project-service }}
      im-service: ${{ steps.force.outputs.on == 'true' && 'true' || steps.filter.outputs.im-service }}
      email-service: ${{ steps.force.outputs.on == 'true' && 'true' || steps.filter.outputs.email-service }}
      user-service: ${{ steps.force.outputs.on == 'true' && 'true' || steps.filter.outputs.user-service }}
      share-service: ${{ steps.force.outputs.on == 'true' && 'true' || steps.filter.outputs.share-service }}
      file-service: ${{ steps.force.outputs.on == 'true' && 'true' || steps.filter.outputs.file-service }}
      team-service: ${{ steps.force.outputs.on == 'true' && 'true' || steps.filter.outputs.team-service }}
      audit-service: ${{ steps.force.outputs.on == 'true' && 'true' || steps.filter.outputs.audit-service }}
      admin-service: ${{ steps.force.outputs.on == 'true' && 'true' || steps.filter.outputs.admin-service }}
      gateway: ${{ steps.force.outputs.on == 'true' && 'true' || steps.filter.outputs.gateway }}
      docker-config: ${{ steps.force.outputs.on == 'true' && 'true' || steps.filter.outputs.docker-config }}
      frontend: ${{ steps.force.outputs.on == 'true' && 'true' || steps.filter.outputs.frontend }}
      backend-any: ${{ steps.force.outputs.on == 'true' && 'true' || steps.backend-any.outputs.changed }}
      # any-change：后端 / 前端 / compose+env 任一有变更。
      # 构建与部署门禁用它，而 quality-check-backend 仍用 backend-any。
      any-change: ${{ steps.force.outputs.on == 'true' && 'true' || steps.backend-any.outputs.any }}
      tag: ${{ steps.tag.outputs.tag }}
      skip_quality: ${{ steps.skip-quality.outputs.skip_quality }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve force_deploy flag
        id: force
        # 审计 2.3.6：github.event.inputs.* 一律经 env 中转再进 shell（表达式注入面）
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE_DEPLOY_INPUT: ${{ github.event.inputs.force_deploy }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$FORCE_DEPLOY_INPUT" = "true" ]; then
            echo "on=true" >> "$GITHUB_OUTPUT"
          else
            echo "on=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify sub-repo sync consistency
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "===== 子仓库同步一致性检查 ====="
          DRIFT=0
          for sub in ZXYZdatabaseBack ZXYZdatabaseFront; do
            echo "--- Checking $sub ---"
            git clone --depth 1 --single-branch \
              "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository_owner }}/${sub}.git" \
              "/tmp/${sub}" 2>/dev/null || {
              echo "::warning::无法克隆 ${sub}，跳过同步检查"
              continue
            }

            # 根仓库 HEAD 中该子目录的文件 blob hash
            git ls-tree -r HEAD -- "${sub}/" \
              | awk '{print $3, $4}' \
              | sed "s| ${sub}/| |" \
              | sort -k2 > /tmp/root_${sub}.txt

            # 子仓库 HEAD 的文件 blob hash
            git -C "/tmp/${sub}" ls-tree -r HEAD \
              | awk '{print $3, $4}' \
              | sort -k2 > /tmp/sub_${sub}.txt

            if ! diff -q /tmp/root_${sub}.txt /tmp/sub_${sub}.txt >/dev/null 2>&1; then
              DRIFT=1
              DIFF_COUNT=$(diff /tmp/root_${sub}.txt /tmp/sub_${sub}.txt | grep -c '^[<>]' || true)
              echo "::error::${sub} 不同步！共 ${DIFF_COUNT} 处差异"
              echo "不同步文件列表（前 20 条）:"
              diff /tmp/root_${sub}.txt /tmp/sub_${sub}.txt | grep '^[<>]' | head -20 || true
              echo ""
              echo "修复命令:"
              echo "  cd ${sub} && git add -A && git commit -m 'sync: 同步根仓库变更' && git push"
              echo "  cd .. && git add ${sub}/ && git commit -m 'sync: 更新 ${sub} 引用' && git push"
            else
              echo "[OK] ${sub} 同步一致"
            fi
            rm -rf "/tmp/${sub}" /tmp/root_${sub}.txt /tmp/sub_${sub}.txt
          done

          if [ "$DRIFT" -ne 0 ]; then
            echo ""
            echo "::error::SUBREPO_SYNC_DRIFT: 子仓库与根仓库内容不一致，请同步后重新推送"
            exit 1
          fi
          echo "===== 同步检查通过 ====="

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # 关键：显式指定 diff 基线为「本次推送之前的那个提交」。
          # 不设 base 时，dorny/paths-filter 默认拿「默认分支(master) 与本分支(dev) 的
          # merge-base」做 diff。master 长期停滞 → merge-base 停在很早的提交 →
          # diff 范围覆盖整条 dev 历史 → 所有 filter 全 true → 11 个镜像全量重建
          # （实测 run #108：日志打印 "Changes will be detected between master and dev"，
          #   merge-base=5b99fa9，13 个 Filter 全 true）。设了 base 才是真·选择性构建。
          # 新分支首推 / force-push 时 github.event.before 为全零，此时回退空串让 action
          # 走默认逻辑（宁可全量，不可漏建）；pull_request 事件无 before，同样回退默认。
          base: ${{ github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' && github.event.before || '' }}
          filters: |
            backend-common:
              - 'ZXYZdatabaseBack/pom.xml'
              - 'ZXYZdatabaseBack/zxyz-common/**'
              - 'ZXYZdatabaseBack/Dockerfile'
            project-service:
              - 'ZXYZdatabaseBack/zxyz-project-service/**'
            im-service:
              - 'ZXYZdatabaseBack/zxyz-im-service/**'
            email-service:
              - 'ZXYZdatabaseBack/zxyz-email-service/**'
            user-service:
              - 'ZXYZdatabaseBack/zxyz-user-service/**'
            share-service:
              - 'ZXYZdatabaseBack/zxyz-share-service/**'
            file-service:
              - 'ZXYZdatabaseBack/zxyz-file-service/**'
            team-service:
              - 'ZXYZdatabaseBack/zxyz-team-service/**'
            audit-service:
              - 'ZXYZdatabaseBack/zxyz-audit-service/**'
            admin-service:
              - 'ZXYZdatabaseBack/zxyz-admin-service/**'
            gateway:
              - 'ZXYZdatabaseBack/zxyz-gateway/**'
            docker-config:
              - 'docker-compose.yml'
              - '.env.example'
            frontend:
              - 'ZXYZdatabaseFront/**'

      - name: Check if any backend changed
        id: backend-any
        run: |
          BACKEND=false
          if [ "${{ steps.filter.outputs.backend-common }}" = "true" ] || \
             [ "${{ steps.filter.outputs.project-service }}" = "true" ] || \
             [ "${{ steps.filter.outputs.im-service }}" = "true" ] || \
             [ "${{ steps.filter.outputs.email-service }}" = "true" ] || \
             [ "${{ steps.filter.outputs.user-service }}" = "true" ] || \
             [ "${{ steps.filter.outputs.share-service }}" = "true" ] || \
             [ "${{ steps.filter.outputs.file-service }}" = "true" ] || \
             [ "${{ steps.filter.outputs.team-service }}" = "true" ] || \
             [ "${{ steps.filter.outputs.audit-service }}" = "true" ] || \
             [ "${{ steps.filter.outputs.admin-service }}" = "true" ] || \
             [ "${{ steps.filter.outputs.gateway }}" = "true" ]; then
            BACKEND=true
          fi
          echo "changed=$BACKEND" >> $GITHUB_OUTPUT

          # any-change：后端 / 前端 / compose+.env 任一变更。
          # 为什么单列一个输出：此前 build-and-push 的门禁只看 backend-any，于是
          # 「仅前端变更」或「仅 docker-compose.yml / .env.example 变更」时构建 job 被整体
          # 跳过 → 镜像不重建、部署不执行（前端改了却永远不上线的静默故障）。
          ANY=false
          if [ "$BACKEND" = "true" ] || \
             [ "${{ steps.filter.outputs.frontend }}" = "true" ] || \
             [ "${{ steps.filter.outputs.docker-config }}" = "true" ]; then
            ANY=true
          fi
          echo "any=$ANY" >> $GITHUB_OUTPUT

      - name: Determine image tag
        id: tag
        # 审计 2.3.6：输入经 env 中转，并对 tag 做白名单校验后再使用
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # 该输入会直接成为镜像 tag 传给 docker build/push，先做字符白名单校验（防注入/防非法 tag）
            if ! printf '%s' "$INPUT_TAG" | grep -qE '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'; then
              echo "::error::tag 输入非法：仅允许字母/数字/./_/-，长度 1~128，且不得以符号开头"
              exit 1
            fi
            echo "tag=$INPUT_TAG" >> $GITHUB_OUTPUT
          elif [ "$REF_NAME" = "refs/heads/dev" ]; then
            echo "tag=dev" >> $GITHUB_OUTPUT
          elif [ "$REF_NAME" = "refs/heads/main" ]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          elif [[ "$REF_NAME" == refs/tags/v* ]]; then
            echo "tag=${REF_NAME#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=dev" >> $GITHUB_OUTPUT
          fi

      - name: Determine skip quality
        id: skip-quality
        # 审计 2.3.6：所有来自 github.event.inputs / github.ref_name / github.actor 的值
        # 一律经 env 中转，避免直接内插到 shell 脚本造成表达式注入
        env:
          REQUESTED_INPUT: ${{ github.event.inputs.skip_quality }}
          BRANCH_NAME: ${{ github.ref_name }}
          ACTOR_NAME: ${{ github.actor }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref }}
          RUN_ID: ${{ github.run_id }}
        run: |
          REQUESTED="${REQUESTED_INPUT:-false}"
          BRANCH="$BRANCH_NAME"
          ACTOR="$ACTOR_NAME"

          # 保护分支（main/dev）永远不允许跳过质量检查
          if [ "$BRANCH" = "main" ] || [ "$BRANCH" = "dev" ]; then
            if [ "$REQUESTED" = "true" ]; then
              echo "::warning::[AUDIT] skip_quality=true was requested by '${ACTOR}' on protected branch '${BRANCH}' — DENIED. Quality checks are mandatory for protected branches."
            fi
            echo "skip_quality=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 非保护分支：允许跳过，但必须使用非 latest 的显式镜像标签并记录审计日志
          if [ "$REQUESTED" = "true" ]; then
            TAG_INPUT="${INPUT_TAG:-}"
            if [ -z "$TAG_INPUT" ] || [ "$TAG_INPUT" = "latest" ]; then
              echo "::error::SKIP_QUALITY_TAG_DENIED: skip_quality=true 时必须指定非 latest 的显式镜像标签（当前: '${TAG_INPUT:-<empty>}'），以防未经质量检查的镜像覆盖 latest"
              exit 1
            fi
            echo "::warning::[AUDIT] skip_quality=true | actor=${ACTOR} | branch=${BRANCH} | ref=${REF_NAME} | tag=${TAG_INPUT} | run_id=${RUN_ID} | triggered_at=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "skip_quality=true" >> $GITHUB_OUTPUT
          else
            echo "skip_quality=false" >> $GITHUB_OUTPUT
          fi

  # ============================================================
  # Job 1.5: Flyway 迁移门禁
  # 守卫两类会导致生产 Flyway 失败 / 非确定性的提交：
  #   1) 重复版本号：同一服务内两个迁移文件共享同一 V<num>__ 前缀（按「服务:版本」判重，
  #      跨服务的同版本号各走独立 flyway_schema_history，属合法重复，不拦截）。
  #   2) 篡改已发布迁移：修改已存在于基线分支的迁移文件（迁移必须只追加）。
  # 另外拒绝不合规的文件名（缺 __ 或使用非法字符）。
  # 在 PR 上基于 github.base_ref 做 diff；push 事件无 base_ref 时优雅降级。
  # ============================================================
  flyway-check:
    needs: detect-changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so we can diff against the base branch

      - name: Flyway version number dedup
        run: |
          # Collect all migration files, exclude any target/ build output paths
          mapfile -t FILES < <(git ls-files 'ZXYZdatabaseBack/*/src/main/resources/db/migration/V*.sql' | grep -v '/target/' || true)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No Flyway migration files found; skipping dedup."
            exit 0
          fi

          # key = "service:version" — each service owns an independent
          # flyway_schema_history, so a version may legitimately repeat across
          # services; only a duplicate *within the same service* is a real conflict.
          declare -A VERSION_MAP
          for f in "${FILES[@]}"; do
            svc="$(echo "$f" | cut -d/ -f2)"   # ZXYZdatabaseBack/<svc>/...
            ver="$(basename "$f" | sed -nE 's/^V([0-9]+)__.*\.sql$/\1/p')"
            [ -z "$ver" ] && continue
            VERSION_MAP["${svc}:${ver}"]="${VERSION_MAP[${svc}:${ver}]:-} $f"
          done

          DUP_FOUND=0
          for key in "${!VERSION_MAP[@]}"; do
            n=$(echo ${VERSION_MAP[$key]} | wc -w)
            if [ "$n" -gt 1 ]; then
              DUP_FOUND=1
              echo "::error::FLYWAY_DUP_VERSION: key '${key}' appears in:${VERSION_MAP[$key]}"
            fi
          done

          if [ "$DUP_FOUND" -ne 0 ]; then
            exit 1
          fi
          echo "Flyway version dedup: no duplicates found."

      - name: Flyway filename sanity
        run: |
          mapfile -t FILES < <(git ls-files 'ZXYZdatabaseBack/*/src/main/resources/db/migration/V*.sql' | grep -v '/target/' || true)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No Flyway migration files found; skipping filename check."
            exit 0
          fi

          BAD=0
          for f in "${FILES[@]}"; do
            base="$(basename "$f")"
            # Reject anything not matching ^V[0-9]+__[A-Za-z0-9_]+\.sql$
            if ! printf '%s' "$base" | grep -qE '^V[0-9]+__[A-Za-z0-9_]+\.sql$'; then
              BAD=1
              echo "::error::FLYWAY_BAD_FILENAME: '$f' does not match ^V<num>__<name>.sql$"
            fi
          done

          if [ "$BAD" -ne 0 ]; then
            exit 1
          fi
          echo "Flyway filename sanity: all filenames valid."

      - name: Reject modifying applied migrations (diff guard)
        run: |
          FAIL=0
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.base_ref }}"
            git fetch origin "$BASE" --quiet 2>/dev/null || true
            # diff guard: status 'M' on an existing db/migration/*.sql = modified applied migration
            while IFS=$'\t' read -r status path; do
              case "$path" in
                *db/migration/*.sql)
                  case "$status" in
                    M|R*)
                      echo "::error::FLYWAY_MODIFIED_APPLIED: ${path} modifies/renames an already-released migration — migrations must be append-only"
                      FAIL=1
                      ;;
                  esac
                  ;;
              esac
            done < <(git diff --name-status "origin/${BASE}...HEAD" 2>/dev/null || true)
          elif [ "${{ github.event_name }}" = "push" ]; then
            # push: no base_ref. Fall back to origin/dev if it exists.
            if git rev-parse --verify origin/dev >/dev/null 2>&1; then
              echo "push event without base_ref; falling back to origin/dev for modify-guard."
              while IFS=$'\t' read -r status path; do
                case "$path" in
                  *db/migration/*.sql)
                    case "$status" in
                      M|R*)
                        echo "::error::FLYWAY_MODIFIED_APPLIED: ${path} modifies/renames an already-released migration — migrations must be append-only"
                        FAIL=1
                        ;;
                    esac
                    ;;
                esac
              done < <(git diff --name-status "origin/dev...HEAD" 2>/dev/null || true)
            else
              echo "::warning::push event without base_ref and origin/dev missing; skipping modify-guard (dedup + filename checks already ran)"
            fi
          else
            echo "::warning::event ${{ github.event_name }} has no base_ref; skipping modify-guard"
          fi

          if [ "$FAIL" -ne 0 ]; then
            exit 1
          fi
          echo "Flyway modify-guard: no already-released migrations were modified."

  # ============================================================
  # Job: 密钥泄漏扫描（Gitleaks）
  # ============================================================
  # 动机：线上 `.env` 里有真实 OSS AK/SK（长期有效），一旦误提交后果不可逆；
  # 而此前**完全没有密钥扫描**（doc 10 的 P0-6，与 doc 07 的 P0-1 信息外泄同属安全）。
  #
  # 为什么是 v3 而不是 v2：v2 跑在 Node 20 上，该 runtime 正在被 GitHub 淘汰
  # （届时 v2 会直接失效）。v3 迁到 Node 24，输入/输出/行为均无变化，
  # 只是版本号与 checkout 版本之差。本仓是**个人账号** ⇒ 无需 GITLEAKS_LICENSE
  # （该 license 仅组织账号需要）。
  #
  # 本 job **不设 `if:`**（与 flyway-check 一致）⇒ 任何触发都会运行、永不 `skipped`，
  # 因此可以安全地作为 deploy 的硬前置条件。（若设了 `if:`，一旦被判 skipped，
  # 下游 `needs.*.result == 'success'` 恒 false，deploy 会**永远不放行**。）
  secret-scan:
    needs: detect-changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需完整历史才能正确计算本次 push 的提交区间

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 仓库根是 `.gitleaks.toml`（带点），而 action 的自动探测只认 `gitleaks.toml`，
          # 故必须显式指定；否则会静默退回默认配置 —— 豁免失效、文档示例变误报红。
          GITLEAKS_CONFIG: .gitleaks.toml

  # ============================================================
  # Job 2: 后端质量检查
  # ============================================================
  quality-check-backend:
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.backend-any == 'true' &&
      needs.detect-changes.outputs.skip_quality != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Backend compile and test
        run: cd ZXYZdatabaseBack && mvn -B test

      # 覆盖率汇总：把各模块 jacoco 报告里的 LINE 覆盖率打印到 CI 日志，并上传报告。
      # 动机：后端覆盖率阈值将采用与前端一致的「棘轮」做法（实测基线 → 阈值取基线下方约 4 点
      # → 达标后上调），而棘轮的前提是**能随时看到当前真实数字**。此前 jacoco 只生成报告、
      # 从不打印，也就无法在 CI 里观察到覆盖率变化。
      # 注：jacoco 的 report 绑在 test phase（pom.xml），所以 `mvn test` 后即有报告。
      - name: Backend coverage summary
        if: always()
        run: |
          cd ZXYZdatabaseBack
          printf '%-24s %8s %8s %8s\n' MODULE LINES MISSED RATIO
          total_cov=0; total_miss=0; found=0
          for csv in $(find . -path '*/target/site/jacoco/jacoco.csv' | sort); do
            mod=$(echo "$csv" | sed 's|^\./||; s|/target/site/jacoco/jacoco.csv$||')
            # jacoco.csv 列序：1 GROUP,2 PACKAGE,3 CLASS,4 INSTR_MISSED,5 INSTR_COVERED,
            #                6 BRANCH_MISSED,7 BRANCH_COVERED,8 LINE_MISSED,9 LINE_COVERED
            read -r cov miss < <(awk -F, 'NR>1{c+=$9; m+=$8} END{print c+0, m+0}' "$csv")
            tot=$((cov + miss))
            if [ "$tot" -gt 0 ]; then ratio=$(awk -v c="$cov" -v t="$tot" 'BEGIN{printf "%.2f%%", c*100/t}'); else ratio='n/a'; fi
            printf '%-24s %8d %8d %8s\n' "$mod" "$cov" "$miss" "$ratio"
            total_cov=$((total_cov + cov)); total_miss=$((total_miss + miss)); found=$((found + 1))
          done
          if [ "$found" -eq 0 ]; then
            echo "::warning::未找到任何 jacoco 报告（target/site/jacoco/jacoco.csv）"
          else
            awk -v c="$total_cov" -v m="$total_miss" 'BEGIN{
              t=c+m; if(t>0) printf "%-24s %8d %8d %7.2f%%\n", "TOTAL(含集成测试)", c, m, c*100/t
            }'
          fi

      - name: Upload backend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco-report
          path: ZXYZdatabaseBack/**/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14

  # ============================================================
  # Job 2.5: 前端质量检查
  # ============================================================
  quality-check-frontend:
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.frontend == 'true' &&
      needs.detect-changes.outputs.skip_quality != 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ZXYZdatabaseFront
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ZXYZdatabaseFront/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # 类型检查门禁（U14）：此前 CI 只跑 lint + test，JS 项目里 vue-tsc --noEmit
      # 是最能拦住「类型级回归」的一环（如 props 契约变更、stores 类型漂移）。
      #
      # ⚠️ 不要误以为它覆盖了全部 JS：tsconfig.json 是 allowJs:true + checkJs:false，
      #    JS 文件只被解析、不被检查。真实覆盖 = 全部 .ts + 首行写了 // @ts-check 的 .js。
      #    已点亮范围由下一步 `typecheck:scope` 校验（棘轮：只增不减）。
      - name: Typecheck
        run: npm run typecheck

      # typecheck 覆盖范围校验：防止有人为了让 CI 变绿而悄悄删掉某文件的 // @ts-check，
      # 导致覆盖面无声缩小 —— 那是「假绿灯」的另一种形态。
      - name: Typecheck scope
        run: npm run typecheck:scope

      # 覆盖率门禁：必须带 --coverage，否则 vite.config.js 里配的 thresholds 根本不会被评估。
      # 此前 CI 跑的是 `npm run test`（= vitest run，无 --coverage）⇒ 4 组精心调过的棘轮
      # 阈值从未被执行过一次。阈值同样遵循棘轮：先测真实基线，取值在基线下方约 4 点，达标后上调。
      - name: Test
        run: npm run test:coverage

  # ============================================================
  # Job 3: 构建并推送镜像（只构建有变更的服务，仅 push 触发）
  # ============================================================
  build-and-push:
    needs: [detect-changes, quality-check-backend, quality-check-frontend]
    # 显式白名单：质量 job 必须 success；skipped 仅在两种情况下豁免——
    # 1) 对应变更面不存在（前端无变更）；2) skip_quality=true 且已在 detect-changes 通过审计（强制非 latest 显式 tag）
    if: |
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.detect-changes.outputs.any-change == 'true' &&
      (
        needs.quality-check-backend.result == 'success' ||
        (needs.quality-check-backend.result == 'skipped' &&
          (needs.detect-changes.outputs.backend-any != 'true' || needs.detect-changes.outputs.skip_quality == 'true'))
      ) &&
      (
        needs.quality-check-frontend.result == 'success' ||
        (needs.quality-check-frontend.result == 'skipped' &&
          (needs.detect-changes.outputs.frontend != 'true' || needs.detect-changes.outputs.skip_quality == 'true'))
      )
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # 后端 9 个服务（is_backend=true → backend-common 变更时也重建）
          - name: project-service
            context: .
            dockerfile: ZXYZdatabaseBack/Dockerfile
            module: zxyz-project-service
            change: ${{ needs.detect-changes.outputs.project-service }}
            is_backend: true
          - name: im-service
            context: .
            dockerfile: ZXYZdatabaseBack/Dockerfile
            module: zxyz-im-service
            change: ${{ needs.detect-changes.outputs.im-service }}
            is_backend: true
          - name: email-service
            context: .
            dockerfile: ZXYZdatabaseBack/Dockerfile
            module: zxyz-email-service
            change: ${{ needs.detect-changes.outputs.email-service }}
            is_backend: true
          - name: user-service
            context: .
            dockerfile: ZXYZdatabaseBack/Dockerfile
            module: zxyz-user-service
            change: ${{ needs.detect-changes.outputs.user-service }}
            is_backend: true
          - name: share-service
            context: .
            dockerfile: ZXYZdatabaseBack/Dockerfile
            module: zxyz-share-service
            change: ${{ needs.detect-changes.outputs.share-service }}
            is_backend: true
          - name: file-service
            context: .
            dockerfile: ZXYZdatabaseBack/Dockerfile
            module: zxyz-file-service
            change: ${{ needs.detect-changes.outputs.file-service }}
            is_backend: true
          - name: team-service
            context: .
            dockerfile: ZXYZdatabaseBack/Dockerfile
            module: zxyz-team-service
            change: ${{ needs.detect-changes.outputs.team-service }}
            is_backend: true
          - name: audit-service
            context: .
            dockerfile: ZXYZdatabaseBack/Dockerfile
            module: zxyz-audit-service
            change: ${{ needs.detect-changes.outputs.audit-service }}
            is_backend: true
          - name: admin-service
            context: .
            dockerfile: ZXYZdatabaseBack/Dockerfile
            module: zxyz-admin-service
            change: ${{ needs.detect-changes.outputs.admin-service }}
            is_backend: true
          - name: gateway
            context: .
            dockerfile: ZXYZdatabaseBack/Dockerfile
            module: zxyz-gateway
            change: ${{ needs.detect-changes.outputs.gateway }}
            is_backend: true
          # 前端入口容器（nginx + 静态资源）：用户访问系统的唯一入口
          - name: frontend-nginx
            context: .
            dockerfile: ZXYZdatabaseFront/Dockerfile
            change: ${{ needs.detect-changes.outputs.frontend }}
            is_backend: false
    steps:
      - name: Check if needs build
        id: should-build
        run: |
          # 后端服务：自身变更 || backend-common 变更
          if [ "${{ matrix.change }}" = "true" ] || \
             ([ "${{ matrix.is_backend }}" = "true" ] && [ "${{ needs.detect-changes.outputs.backend-common }}" = "true" ]); then
            echo "build=true" >> $GITHUB_OUTPUT
          else
            echo "build=false" >> $GITHUB_OUTPUT
            echo "⏭️ Skip: ${{ matrix.name }} (no changes)"
          fi

      - name: Checkout code
        if: steps.should-build.outputs.build == 'true'
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: steps.should-build.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: steps.should-build.outputs.build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Audit annotation for quality bypass
        if: steps.should-build.outputs.build == 'true' && needs.detect-changes.outputs.skip_quality == 'true'
        env:
          IMAGE_TAG: ${{ needs.detect-changes.outputs.tag }}
          ACTOR_NAME: ${{ github.actor }}
          BRANCH_NAME: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          echo "::warning::[AUDIT] BUILD_WITHOUT_QUALITY_CHECK | image=zxyz-${{ matrix.name }}:$IMAGE_TAG | actor=$ACTOR_NAME | branch=$BRANCH_NAME | run_id=$RUN_ID"

      - name: Build and push
        if: steps.should-build.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: MODULE=${{ matrix.module }}
          labels: |
            zxyz.ci.quality-check-skipped=${{ needs.detect-changes.outputs.skip_quality }}
            zxyz.ci.run-id=${{ github.run_id }}
            zxyz.ci.actor=${{ github.actor }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/zxyz-${{ matrix.name }}:${{ needs.detect-changes.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}/zxyz-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # Job 3.5: 镜像安全扫描（Trivy，仅扫描实际构建的镜像）
  # 在 build-and-push 之后对所有后端镜像执行 SCA 漏洞扫描。
  # HIGH/CRITICAL 漏洞会导致本 job 失败，从而整条 run 变红。
  # 说明：
  #   - ignore-unfixed: true 只告警可修复漏洞，避免噪音
  #   - 若某个已知漏洞已在外部组件修复但尚无新镜像，可在必要时通过
  #     ignore 配置临时豁免（见下方示例，勿长期使用）
  #   - builder 现已改用官方 maven:3.9-eclipse-temurin-17（在 Docker Hub，
  #     可被 Trivy 按 tag 拉取扫描）。
  # ============================================================
  security-scan:
    needs: [detect-changes, build-and-push]
    if: |
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.detect-changes.outputs.any-change == 'true' &&
      needs.build-and-push.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      # 一个服务检出漏洞不取消其他服务的扫描：一次看全全部服务的漏洞面
      fail-fast: false
      matrix:
        include:
          - name: project-service
            change: ${{ needs.detect-changes.outputs.project-service }}
            is_backend: true
          - name: im-service
            change: ${{ needs.detect-changes.outputs.im-service }}
            is_backend: true
          - name: email-service
            change: ${{ needs.detect-changes.outputs.email-service }}
            is_backend: true
          - name: user-service
            change: ${{ needs.detect-changes.outputs.user-service }}
            is_backend: true
          - name: share-service
            change: ${{ needs.detect-changes.outputs.share-service }}
            is_backend: true
          - name: file-service
            change: ${{ needs.detect-changes.outputs.file-service }}
            is_backend: true
          - name: team-service
            change: ${{ needs.detect-changes.outputs.team-service }}
            is_backend: true
          - name: audit-service
            change: ${{ needs.detect-changes.outputs.audit-service }}
            is_backend: true
          - name: admin-service
            change: ${{ needs.detect-changes.outputs.admin-service }}
            is_backend: true
          - name: gateway
            change: ${{ needs.detect-changes.outputs.gateway }}
            is_backend: true
    steps:
      # 仅当该服务真实构建过才扫描（与 build-and-push 的 should-build 逻辑一致）
      - name: Check if image was built
        id: was-built
        run: |
          if [ "${{ matrix.change }}" = "true" ] || \
             ([ "${{ matrix.is_backend }}" = "true" ] && [ "${{ needs.detect-changes.outputs.backend-common }}" = "true" ]); then
            echo "built=true" >> $GITHUB_OUTPUT
          else
            echo "built=false" >> $GITHUB_OUTPUT
            echo "⏭️ Skip scan: ${{ matrix.name }} (not built)"
          fi

      - name: Login to GHCR
        if: steps.was-built.outputs.built == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan image with Trivy
        if: steps.was-built.outputs.built == 'true'
        # tag 必须带 v 前缀（aquasecurity/trivy-action 的 release tag 均为 vX.Y.Z，
        # 无前缀的 0.29.0 从未存在，会导致 unable to resolve action）
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/zxyz-${{ matrix.name }}:${{ needs.detect-changes.outputs.tag }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '1'
          output: trivy-${{ matrix.name }}.txt

      # Trivy 漏洞表写入 output 文件而非 stdout：job 因 exit-code 失败时
      # 必须在日志里可见漏洞详情，否则无法评估修复
      - name: Show Trivy report
        if: always() && steps.was-built.outputs.built == 'true'
        run: |
          if [ -f "trivy-${{ matrix.name }}.txt" ]; then
            echo "===== Trivy report: ${{ matrix.name }} ====="
            cat "trivy-${{ matrix.name }}.txt"
          else
            echo "No trivy report file (scan may have failed before writing)"
          fi

      - name: Upload Trivy report (SARIF output with HIGH/CRITICAL summary)
        if: always() && steps.was-built.outputs.built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.name }}
          path: trivy-${{ matrix.name }}.txt
          if-no-files-found: ignore

  # ============================================================
  # Job 4: 部署到服务器（仅 push 触发且有镜像构建时）
  # ============================================================
  deploy:
    # 审计 2.3.6：security-scan（Trivy HIGH/CRITICAL，exit-code=1）必须成为部署硬前置，
    # 否则扫出高危漏洞的镜像照样上线。安全前提：security-scan 的 if 只比 build-and-push
    # 多一个 any-change=='true'，而 build-and-push 自身的 if 已强制要求 any-change=='true'，
    # 因此「build-and-push 成功」⇒ security-scan 不可能被 skipped ⇒ 不会把 deploy 永久锁死。
    needs: [detect-changes, build-and-push, secret-scan, security-scan]
    runs-on: ubuntu-latest
    if: always() && needs.build-and-push.result == 'success' && needs.secret-scan.result == 'success' && needs.security-scan.result == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    # 审计 2.3.2：部署再套一层独立且不取消的并发组，保证同一 ref 的两次部署串行执行。
    # 真正消除「中途取消」靠的是 workflow 级 concurrency 已改为 cancel-in-progress:false。
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    environment: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && 'production' || 'development' }}
    steps:
      - name: Determine deploy target
        id: target
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ] || [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "host=${{ secrets.PROD_DEPLOY_HOST }}" >> $GITHUB_OUTPUT
            echo "env=production" >> $GITHUB_OUTPUT
          else
            echo "host=${{ (secrets.DEV_DEPLOY_HOST || secrets.DEPLOY_HOST) }}" >> $GITHUB_OUTPUT
            echo "env=development" >> $GITHUB_OUTPUT
          fi

      - name: Determine SSH key
        id: ssh-key
        run: |
          # SSH 私钥是多行 PEM，GITHUB_ENV 单行 name=value 格式无法承载
          # （会报 Invalid format），必须用 heredoc 定界符语法写入多行值。
          if [[ "${{ github.ref }}" == "refs/heads/main" ]] || [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            {
              echo "ssh_key<<GH_SSH_KEY_EOF"
              echo "${{ secrets.PROD_SSH_KEY }}"
              echo "GH_SSH_KEY_EOF"
            } >> "$GITHUB_ENV"
          else
            {
              echo "ssh_key<<GH_SSH_KEY_EOF"
              echo "${{ (secrets.DEV_SSH_KEY || secrets.DEPLOY_SSH_KEY) }}"
              echo "GH_SSH_KEY_EOF"
            } >> "$GITHUB_ENV"
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          FAST_DEPLOY: ${{ github.event.inputs.fast_deploy || 'false' }}
          BACKEND_COMMON: ${{ needs.detect-changes.outputs.backend-common }}
          PROJECT_SVC: ${{ needs.detect-changes.outputs.project-service }}
          IM_SVC: ${{ needs.detect-changes.outputs.im-service }}
          EMAIL_SVC: ${{ needs.detect-changes.outputs.email-service }}
          USER_SVC: ${{ needs.detect-changes.outputs.user-service }}
          SHARE_SVC: ${{ needs.detect-changes.outputs.share-service }}
          FILE_SVC: ${{ needs.detect-changes.outputs.file-service }}
          TEAM_SVC: ${{ needs.detect-changes.outputs.team-service }}
          AUDIT_SVC: ${{ needs.detect-changes.outputs.audit-service }}
          ADMIN_SVC: ${{ needs.detect-changes.outputs.admin-service }}
          GATEWAY_SVC: ${{ needs.detect-changes.outputs.gateway }}
          FRONTEND: ${{ needs.detect-changes.outputs.frontend }}
          DOCKER_CFG: ${{ needs.detect-changes.outputs.docker-config }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/www/zxyz' }}
          IMAGE_TAG: ${{ github.sha }}
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
          DEPLOY_ENV: ${{ steps.target.outputs.env }}
        with:
          host: ${{ steps.target.outputs.host }}
          username: ${{ secrets.DEPLOY_USERNAME }}
          key: ${{ env.ssh_key }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          timeout: 1500s
          # command_timeout 是远端命令执行超时（默认 10m）：全量重建时 11 镜像拉取 +
          # 10 个 JVM 同启远超 10 分钟，曾致 Run Command Timeout 假失败；连接超时是上面的 timeout
          command_timeout: 40m
          envs: BACKEND_COMMON,PROJECT_SVC,IM_SVC,EMAIL_SVC,USER_SVC,SHARE_SVC,FILE_SVC,TEAM_SVC,AUDIT_SVC,ADMIN_SVC,GATEWAY_SVC,FRONTEND,DOCKER_CFG,FAST_DEPLOY,DEPLOY_PATH,IMAGE_TAG,IMAGE_PREFIX,DEPLOY_ENV
          script: |
            #!/bin/bash
            # =============================================================================
            # 引导层（Bootstrap）：刻意保持极薄，只做两件事 —— 「取到最新脚本」→「交给它跑」。
            #
            # 为什么部署脚本不内嵌在这里：
            #   GitHub 对 workflow 中单个标量的长度上限是 21000 —— 单位是 **UTF-8 字节**，不是字符
            #   （中文注释每字 3 字节）。原内嵌脚本实测已达 20860 字节、只剩约 140 字节余量，任何追加
            #   都会让整个 workflow 变成 "Invalid workflow file"：run 以文件路径为名、0 个 job 直接失败，
            #   报错 "(Line: N, Col: C): Exceeded max expression length 21000"（提交 aee98bb 即因此挂掉）。
            #   脚本实体现已移至 scripts/deploy-on-server.sh，该上限彻底解除。
            #   ⚠️ 不要再往本块里加逻辑 —— 要加就加到那个脚本文件里。
            # =============================================================================
            set -euo pipefail

            DEPLOY_DIR="${DEPLOY_PATH:-/www/zxyz}"
            REPO_DIR="${DEPLOY_DIR}-repo"

            # 必须先刷新克隆，才能拿到「本次提交」里的脚本实体（否则会拿上一次的旧脚本去部署）。
            # 拉取失败必须中止：继续用旧脚本部署比直接失败更危险（run #104 的教训）。
            if [ -d "$REPO_DIR/.git" ]; then
              if ! git -C "$REPO_DIR" pull --ff-only -q; then
                echo "::error::REPO_PULL_FAILED: 无法更新 $REPO_DIR，取不到最新部署脚本，已中止"
                git -C "$REPO_DIR" status --porcelain 2>/dev/null || true
                exit 1
              fi
            else
              echo "::warning::REPO_MISSING: 未找到 $REPO_DIR 克隆，回退使用 $DEPLOY_DIR/scripts 下的副本"
            fi

            # 优先克隆内的最新脚本，回退长期部署目录的副本（与脚本内 pick_script 的策略一致）
            SCRIPT="$REPO_DIR/scripts/deploy-on-server.sh"
            [ -f "$SCRIPT" ] || SCRIPT="$DEPLOY_DIR/scripts/deploy-on-server.sh"
            if [ ! -f "$SCRIPT" ]; then
              echo "::error::DEPLOY_SCRIPT_MISSING: 在 $REPO_DIR/scripts 与 $DEPLOY_DIR/scripts 均未找到 deploy-on-server.sh"
              exit 1
            fi

            echo "===== Running $SCRIPT ====="
            exec bash "$SCRIPT"

      # ⚠️ 关于 workflow 单标量的 21000 字节上限（改本文件前务必先读）：
      # GitHub 对 workflow 中单个标量的长度上限是 21000 —— 单位是 **UTF-8 字节**，不是字符
      # （中文注释每字 3 字节，特别吃额度）。此前 `Deploy via SSH` 的 script 曾达 20860 字节、
      # 只剩约 140 字节余量，因此一次追加就让整个 workflow 变成 "Invalid workflow file"
      # （run 以文件路径为名、**0 个 job** 直接失败；提交 aee98bb 即如此，报错原文
      #   "(Line: 762, Col: 19): Exceeded max expression length 21000"）。
      # 现已把部署脚本实体抽到 scripts/deploy-on-server.sh，该 script 只余 2 KB 引导层，
      # 上限不再构成约束。往部署流程加逻辑请改那个脚本文件，或像下面这样做成**独立步骤**。
      # 核对当前字节数的命令见 scripts/prune-old-images.sh 顶部注释。
      - name: Prune old images on server
        # 仅当部署成功后才清理：部署失败时可能需要靠旧镜像回滚，不能删
        if: success()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.target.outputs.host }}
          username: ${{ secrets.DEPLOY_USERNAME }}
          key: ${{ env.ssh_key }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          timeout: 120s
          command_timeout: 15m
          script: |
            set -uo pipefail
            DEPLOY_DIR="${{ secrets.DEPLOY_PATH || '/www/zxyz' }}"
            PRUNE_SCRIPT="$DEPLOY_DIR/scripts/prune-old-images.sh"
            if [ ! -f "$PRUNE_SCRIPT" ]; then
              echo "::warning::prune-old-images.sh 未找到（$PRUNE_SCRIPT），跳过旧镜像清理"
              exit 0
            fi
            # 该脚本按仓库保留最近 N 个 tag，并保护容器在用镜像与 .env/.env.previous 的回滚锚点；
            # 它自身退出码恒为 0，这里再加一层保险——清理绝不能影响部署结果。
            bash "$PRUNE_SCRIPT" || echo "::warning::PRUNE_OLD_IMAGES_FAILED: 旧镜像清理失败（不影响本次部署）"
