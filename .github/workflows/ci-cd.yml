name: CI/CD - Selective Build & Deploy

on:
  push:
    branches: [dev, main]
    tags: ['v*']
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像标签（如 v1.0.0、latest、dev）'
        required: true
        default: 'latest'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKERHUB_PREFIX: aclouda  # ← DockerHub 用户名

jobs:
  # ============================================================
  # Job 1: 检测哪些服务有变更 + 确定镜像标签
  # ============================================================
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend-common: ${{ steps.filter.outputs.backend-common }}
      project-service: ${{ steps.filter.outputs.project-service }}
      im-service: ${{ steps.filter.outputs.im-service }}
      email-service: ${{ steps.filter.outputs.email-service }}
      user-service: ${{ steps.filter.outputs.user-service }}
      share-service: ${{ steps.filter.outputs.share-service }}
      file-service: ${{ steps.filter.outputs.file-service }}
      team-service: ${{ steps.filter.outputs.team-service }}
      audit-service: ${{ steps.filter.outputs.audit-service }}
      gateway: ${{ steps.filter.outputs.gateway }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker-config: ${{ steps.filter.outputs.docker-config }}
      backend-any: ${{ steps.backend-any.outputs.changed }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend-common:
              - 'ZXYZdatabaseBack/pom.xml'
              - 'ZXYZdatabaseBack/zxyz-common/**'
              - 'ZXYZdatabaseBack/Dockerfile'
            project-service:
              - 'ZXYZdatabaseBack/zxyz-project-service/**'
            im-service:
              - 'ZXYZdatabaseBack/zxyz-im-service/**'
            email-service:
              - 'ZXYZdatabaseBack/zxyz-email-service/**'
            user-service:
              - 'ZXYZdatabaseBack/zxyz-user-service/**'
            share-service:
              - 'ZXYZdatabaseBack/zxyz-share-service/**'
            file-service:
              - 'ZXYZdatabaseBack/zxyz-file-service/**'
            team-service:
              - 'ZXYZdatabaseBack/zxyz-team-service/**'
            audit-service:
              - 'ZXYZdatabaseBack/zxyz-audit-service/**'
            gateway:
              - 'ZXYZdatabaseBack/zxyz-gateway/**'
            frontend:
              - 'ZXYZdatabaseFront/**'
              - 'deploy/nginx/**'
            docker-config:
              - 'docker-compose.yml'
              - '.env.example'

      - name: Check if any backend changed
        id: backend-any
        run: |
          if [ "${{ steps.filter.outputs.backend-common }}" = "true" ] || \
             [ "${{ steps.filter.outputs.project-service }}" = "true" ] || \
             [ "${{ steps.filter.outputs.im-service }}" = "true" ] || \
             [ "${{ steps.filter.outputs.email-service }}" = "true" ] || \
             [ "${{ steps.filter.outputs.user-service }}" = "true" ] || \
             [ "${{ steps.filter.outputs.share-service }}" = "true" ] || \
             [ "${{ steps.filter.outputs.file-service }}" = "true" ] || \
             [ "${{ steps.filter.outputs.team-service }}" = "true" ] || \
             [ "${{ steps.filter.outputs.audit-service }}" = "true" ] || \
             [ "${{ steps.filter.outputs.gateway }}" = "true" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Determine image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            echo "tag=dev" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=dev" >> $GITHUB_OUTPUT
          fi

  # ============================================================
  # Job 2a: 前端质量检查（与后端并行）
  # ============================================================
  quality-check-frontend:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ZXYZdatabaseFront/package-lock.json

      - name: Install frontend deps
        run: cd ZXYZdatabaseFront && npm ci

      - name: Lint frontend
        run: cd ZXYZdatabaseFront && npm run lint

      - name: Test frontend
        run: cd ZXYZdatabaseFront && npm run test

  # ============================================================
  # Job 2b: 后端质量检查（与前端并行）
  # ============================================================
  quality-check-backend:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend-any == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # 注意：当前后端 Dockerfile 跳过测试（-Dmaven.test.skip=true），
      # 因为测试源码存在编译问题。待修复后应改为 mvn test。
      - name: Backend compile
        run: cd ZXYZdatabaseBack && mvn -B compile -Dmaven.test.skip=true

  # ============================================================
  # Job 3: 构建并推送镜像（只构建有变更的服务，仅 push 触发）
  # ============================================================
  build-and-push:
    needs: [detect-changes, quality-check-frontend, quality-check-backend]
    if: |
      always() &&
      needs.quality-check-frontend.result != 'failure' &&
      needs.quality-check-backend.result != 'failure' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # 后端 9 个服务（is_backend=true → backend-common 变更时也重建）
          - name: project-service
            context: .
            dockerfile: ZXYZdatabaseBack/Dockerfile
            module: zxyz-project-service
            change: ${{ needs.detect-changes.outputs.project-service }}
            is_backend: true
          - name: im-service
            context: .
            dockerfile: ZXYZdatabaseBack/Dockerfile
            module: zxyz-im-service
            change: ${{ needs.detect-changes.outputs.im-service }}
            is_backend: true
          - name: email-service
            context: .
            dockerfile: ZXYZdatabaseBack/Dockerfile
            module: zxyz-email-service
            change: ${{ needs.detect-changes.outputs.email-service }}
            is_backend: true
          - name: user-service
            context: .
            dockerfile: ZXYZdatabaseBack/Dockerfile
            module: zxyz-user-service
            change: ${{ needs.detect-changes.outputs.user-service }}
            is_backend: true
          - name: share-service
            context: .
            dockerfile: ZXYZdatabaseBack/Dockerfile
            module: zxyz-share-service
            change: ${{ needs.detect-changes.outputs.share-service }}
            is_backend: true
          - name: file-service
            context: .
            dockerfile: ZXYZdatabaseBack/Dockerfile
            module: zxyz-file-service
            change: ${{ needs.detect-changes.outputs.file-service }}
            is_backend: true
          - name: team-service
            context: .
            dockerfile: ZXYZdatabaseBack/Dockerfile
            module: zxyz-team-service
            change: ${{ needs.detect-changes.outputs.team-service }}
            is_backend: true
          - name: audit-service
            context: .
            dockerfile: ZXYZdatabaseBack/Dockerfile
            module: zxyz-audit-service
            change: ${{ needs.detect-changes.outputs.audit-service }}
            is_backend: true
          - name: gateway
            context: .
            dockerfile: ZXYZdatabaseBack/Dockerfile
            module: zxyz-gateway
            change: ${{ needs.detect-changes.outputs.gateway }}
            is_backend: true
          # 前端（独立构建，不受 backend-common 变更影响）
          - name: frontend-nginx
            context: .
            dockerfile: ZXYZdatabaseFront/Dockerfile
            module: frontend
            change: ${{ needs.detect-changes.outputs.frontend }}
            is_backend: false
    steps:
      - name: Check if needs build
        id: should-build
        run: |
          # 后端服务：自身变更 || backend-common 变更
          # 前端：自身变更（docker-compose 改动不触发重建，compose 是运行时配置）
          if [ "${{ matrix.change }}" = "true" ] || \
             ([ "${{ matrix.is_backend }}" = "true" ] && [ "${{ needs.detect-changes.outputs.backend-common }}" = "true" ]); then
            echo "build=true" >> $GITHUB_OUTPUT
          else
            echo "build=false" >> $GITHUB_OUTPUT
            echo "⏭️ Skip: ${{ matrix.name }} (no changes)"
          fi

      - name: Checkout code
        if: steps.should-build.outputs.build == 'true'
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: steps.should-build.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        if: steps.should-build.outputs.build == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push
        if: steps.should-build.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: ${{ matrix.module != 'frontend' && format('MODULE={0}', matrix.module) || '' }}
          tags: |
            ${{ env.DOCKERHUB_PREFIX }}/zxyz-${{ matrix.name }}:${{ needs.detect-changes.outputs.tag }}
            ${{ env.DOCKERHUB_PREFIX }}/zxyz-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # Job 4: 部署到服务器（仅 push 触发且有镜像构建时）
  # ============================================================
  deploy:
    needs: [detect-changes, build-and-push]
    runs-on: ubuntu-latest
    if: always() && needs.build-and-push.result == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Determine deploy target
        id: target
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ] || [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "host=${{ secrets.PROD_DEPLOY_HOST }}" >> $GITHUB_OUTPUT
            echo "env=production" >> $GITHUB_OUTPUT
          else
            echo "host=${{ secrets.DEV_DEPLOY_HOST || secrets.DEPLOY_HOST }}" >> $GITHUB_OUTPUT
            echo "env=development" >> $GITHUB_OUTPUT
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          SSH_KEY: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') && secrets.PROD_SSH_KEY || secrets.DEV_SSH_KEY || secrets.DEPLOY_SSH_KEY }}
          BACKEND_COMMON: ${{ needs.detect-changes.outputs.backend-common }}
          PROJECT_SVC: ${{ needs.detect-changes.outputs.project-service }}
          IM_SVC: ${{ needs.detect-changes.outputs.im-service }}
          EMAIL_SVC: ${{ needs.detect-changes.outputs.email-service }}
          USER_SVC: ${{ needs.detect-changes.outputs.user-service }}
          SHARE_SVC: ${{ needs.detect-changes.outputs.share-service }}
          FILE_SVC: ${{ needs.detect-changes.outputs.file-service }}
          TEAM_SVC: ${{ needs.detect-changes.outputs.team-service }}
          AUDIT_SVC: ${{ needs.detect-changes.outputs.audit-service }}
          GATEWAY_SVC: ${{ needs.detect-changes.outputs.gateway }}
          FRONTEND_SVC: ${{ needs.detect-changes.outputs.frontend }}
          DOCKER_CFG: ${{ needs.detect-changes.outputs.docker-config }}
        with:
          host: ${{ steps.target.outputs.host }}
          username: ${{ secrets.DEPLOY_USERNAME }}
          key: ${{ env.SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          timeout: 600s
          envs: BACKEND_COMMON,PROJECT_SVC,IM_SVC,EMAIL_SVC,USER_SVC,SHARE_SVC,FILE_SVC,TEAM_SVC,AUDIT_SVC,GATEWAY_SVC,FRONTEND_SVC,DOCKER_CFG
          script: |
            #!/bin/bash
            set +e

            DEPLOY_DIR="${{ secrets.DEPLOY_PATH || '/www/zxyz' }}"
            IMAGE_TAG="${{ needs.detect-changes.outputs.tag }}"
            DOCKERHUB_PREFIX="${{ env.DOCKERHUB_PREFIX }}"
            cd "$DEPLOY_DIR"

            echo "===== Deploying to ${{ steps.target.outputs.env }} ====="
            echo "Image tag: $IMAGE_TAG"

            # --- 配置同步 ---
            REPO_DIR="${DEPLOY_DIR}-repo"
            UP_FLAGS=""
            if [ -d "$REPO_DIR" ]; then
              OLD_HASH=$(md5sum "$DEPLOY_DIR/docker-compose.yml" 2>/dev/null | cut -d' ' -f1)
              cd "$REPO_DIR" && git pull --ff-only -q
              cp "$REPO_DIR/docker-compose.yml" "$DEPLOY_DIR/docker-compose.yml"
              cp "$REPO_DIR/deploy/nginx/default.conf" "$DEPLOY_DIR/deploy/nginx/default.conf"
              cd "$DEPLOY_DIR"
              NEW_HASH=$(md5sum "$DEPLOY_DIR/docker-compose.yml" | cut -d' ' -f1)
              [ "$OLD_HASH" != "$NEW_HASH" ] && UP_FLAGS="--force-recreate" && echo "docker-compose.yml changed, will force-recreate"
            fi

            # --- 更新 .env ---
            sed -i "s|^APP_IMAGE_TAG=.*|APP_IMAGE_TAG=$IMAGE_TAG|" .env 2>/dev/null || echo "APP_IMAGE_TAG=$IMAGE_TAG" >> .env
            PREFIX="${DOCKERHUB_PREFIX%/}/"
            sed -i "s|^DOCKERHUB_PREFIX=.*|DOCKERHUB_PREFIX=$PREFIX|" .env 2>/dev/null || echo "DOCKERHUB_PREFIX=$PREFIX" >> .env

            # --- 筛选需要更新的服务 ---
            UPDATE_SVC=()
            if [ "$BACKEND_COMMON" = "true" ]; then
              UPDATE_SVC+=(project-service im-service email-service user-service share-service file-service team-service audit-service gateway)
            else
              [ "$PROJECT_SVC" = "true" ] && UPDATE_SVC+=(project-service)
              [ "$IM_SVC" = "true" ] && UPDATE_SVC+=(im-service)
              [ "$EMAIL_SVC" = "true" ] && UPDATE_SVC+=(email-service)
              [ "$USER_SVC" = "true" ] && UPDATE_SVC+=(user-service)
              [ "$SHARE_SVC" = "true" ] && UPDATE_SVC+=(share-service)
              [ "$FILE_SVC" = "true" ] && UPDATE_SVC+=(file-service)
              [ "$TEAM_SVC" = "true" ] && UPDATE_SVC+=(team-service)
              [ "$AUDIT_SVC" = "true" ] && UPDATE_SVC+=(audit-service)
              [ "$GATEWAY_SVC" = "true" ] && UPDATE_SVC+=(gateway)
            fi
            [ "$FRONTEND_SVC" = "true" ] && UPDATE_SVC+=(frontend-nginx)
            [ "$DOCKER_CFG" = "true" ] && UPDATE_SVC=(project-service im-service email-service user-service share-service file-service team-service audit-service gateway frontend-nginx)

            if [ ${#UPDATE_SVC[@]} -eq 0 ]; then
              echo "No service changed, skip deploy"
              exit 0
            fi
            echo "Will update: ${UPDATE_SVC[*]}"

            # --- 并行拉取镜像 ---
            echo "===== Pulling images ====="
            for svc in "${UPDATE_SVC[@]}"; do
              docker compose pull "$svc" &
            done
            wait
            echo "Pull finished"

            # --- 重启变更服务 ---
            echo "===== Restarting services ====="
            docker compose up -d $UP_FLAGS "${UPDATE_SVC[@]}"

            # --- 分层健康检查 ---
            # 普通服务：10 次 × 5s = 50s
            echo "===== Waiting for common services ====="
            for i in $(seq 1 10); do
              if ! docker compose ps 2>/dev/null | grep -qE "(im-service|email-service|user-service|share-service|file-service|team-service|audit-service|frontend-nginx).*(unhealthy|starting)"; then
                echo "Common services ready"
                break
              fi
              sleep 5
            done

            # Gateway 单独长等待：25 次 × 10s = 250s
            echo "===== Waiting for gateway ====="
            for i in $(seq 1 25); do
              if ! docker compose ps 2>/dev/null | grep -q "gateway.*(unhealthy|starting)"; then
                echo "Gateway ready"
                break
              fi
              if [ "$i" -eq 25 ]; then
                echo "WARN: Gateway startup timeout, continuing"
              fi
              sleep 10
            done

            echo "===== Container status ====="
            docker compose ps
            echo "===== Deploy complete ====="
