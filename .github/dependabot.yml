# =============================================================================
# Dependabot 配置 — 根仓库依赖/镜像/操作依赖自动更新
# 覆盖 5 个生态系统：Maven、npm、Docker、Docker Compose、GitHub Actions。
# =============================================================================
version: 2
updates:

  # --- Maven（后端 ZXYZdatabaseBack） ---
  - package-ecosystem: maven
    directory: /ZXYZdatabaseBack/
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    labels:
      - dependencies
      - maven

  # --- npm（前端 ZXYZdatabaseFront） ---
  - package-ecosystem: npm
    directory: /ZXYZdatabaseFront/
    schedule:
      interval: weekly
      day: tuesday
      time: "03:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 20
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    labels:
      - dependencies
      - npm

  # --- Docker: 后端镜像（Dockerfile） ---
  # 用于维护后端构建/运行基础镜像标签（maven、eclipse-temurin 等）。
  # 这些镜像已钉定为「版本 tag + 不可变 @sha256 digest」，Dependabot 会同时
  # 建议 tag 与 digest 升级，在保持可复现构建的前提下跟进安全更新。
  - package-ecosystem: docker
    directory: /ZXYZdatabaseBack/
    schedule:
      interval: weekly
      day: wednesday
      time: "03:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - docker

  # --- Docker: 前端镜像（node/nginx） ---
  - package-ecosystem: docker
    directory: /ZXYZdatabaseFront/
    schedule:
      interval: weekly
      day: wednesday
      time: "03:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - docker

  # --- Docker Compose: 基础设施镜像（docker-compose.yml） ---
  # 用于维护 compose 中直接拉取的基础设施镜像（redis、rabbitmq、alpine 等）。
  # 这些镜像已钉定为「版本 tag + 不可变 @sha256 digest」，Dependabot 会同时建议
  # tag 与 digest 升级。注意：缺少本条目时 compose 里的镜像完全不被监控——
  # 未钉定会静默漂移、钉定后又会冻结，两种情况都不可接受。
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      time: "03:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - docker

  # --- Docker Compose: 可观测栈镜像（docker-compose.observability.yml） ---
  # 62e/66 号二.8：观测栈此前完全不在 Dependabot 视野（loki/prometheus/grafana/
  # alertmanager 等镜像无监控）。默认 profile 不启动不影响 PR 安全性。
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      time: "04:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps-obs)"
    labels:
      - dependencies
      - docker
      - observability

  # --- GitHub Actions（根仓库 .github/workflows） ---
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: thursday
      time: "03:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
    commit-message:
      prefix: "ci(deps)"
    labels:
      - dependencies
      - ci