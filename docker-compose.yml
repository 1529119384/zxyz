# ---------------------------------------------------------------------------
# 服务间鉴权（P2-A2 每服务独立密钥 + 白名单矩阵）
#
# 当前默认：矩阵**已全量启用**（不再是"过渡模式 / allowed-sources 为空 map"）——
# 9 个业务服务 + gateway 的 environment 均以 SPRING_APPLICATION_JSON 预置完整的
# app.internal.allowed-sources 映射（来源服务名 -> 该来源的 SVC_*_KEY），
# 且每个 SVC_*_KEY 都用 `:?` 硬失败：缺任一键则对应服务拒绝启动。
# 服务间校验**不再**回退到单一 INTERNAL_SERVICE_TOKEN。
#
# 机制说明（以下 1)~4) 是"矩阵由哪些部分构成"，不是"待做的启用步骤"）：
#   1) SVC_*_KEY 由 scripts/init-secrets.sh 自动生成（每服务独立、互不相同、≠ INTERNAL_SERVICE_TOKEN），
#      .env.example 中已取消注释；运行 init-secrets.sh 即写入 .env，无需手填。
#   2) 各服务 environment 已注入 `APP_INTERNAL_SERVICE_KEY: ${SVC_<SERVICE>_KEY}`
#      （= 该服务自己向收方签发的密钥；缺此则发方持 legacy token 会被收方拒）。
#   3) 收方 app.internal.allowed-sources 由本文件的 SPRING_APPLICATION_JSON 逐服务预置
#      "允许来源服务名 -> 该来源密钥" 的**完整映射**；10 个服务均已预置
#      （email-service 是当初的试点，现已是全量）。
#   4) gateway 服务 environment 已注入 `SVC_GATEWAY_KEY: ${SVC_GATEWAY_KEY:?启用矩阵必须设置 SVC_GATEWAY_KEY}`
#      （用 :? 硬失败；变量缺失则网关拒绝启动，桥接不会带空 token 401）。
#      网关已用 StripInternalHeadersFilter 剥离外部伪造的 X-Internal-Service-Token / X-Internal-Caller-Service，
#      并在 admin-email 桥接路由以 zxyz-gateway 身份自注入受信内部头：
#      token 取 ${SVC_GATEWAY_KEY:${INTERNAL_SERVICE_TOKEN}}（矩阵优先、过渡回退）。
#      admin-database 路由不注入内部头（该路径走 Sa-Token 登录态 + @SaCheckRole，不消费内部 token）。
# 警告：allowed-sources 一旦启用，任何未列举来源将被拒（fail-closed）；密钥键禁 YAML 默认值，
#      未定义环境变量对应服务拒绝启动（强制配齐）。SVC_GATEWAY_KEY 必须与 email 的 allowed-sources
#      中 zxyz-gateway 项一致，否则 admin 邮件管理经网关调用在矩阵下 401。
#      灰度已完成（email 先行，随后铺开到全部 10 个服务）；完整手稿见 docs/matrix-enable-guide.md。
# ---------------------------------------------------------------------------
# 【重要】本文件的任何改动（哪怕只改注释）都会走「配置变更 ⇒ 全量重建」：
#   detect-changes 的 docker-config 组命中本文件 ⇒ scripts/deploy-on-server.sh 把 UPDATE_SVC
#   覆盖为全部 11 个服务（含 frontend-nginx），且 IMAGE_TAG 取**本次新 sha**。
#   因此 CI 的 build-and-push 必须把 11 个镜像**全部构建**：否则该 sha 的镜像不存在，
#   部署会在镜像预检处 IMAGE_MISSING 硬失败（run 34733088945 即此故 —— 仅配置变更 +
#   前端无变更 ⇒ 前端行被判「no changes」跳过 ⇒ 整条部署中止；fail-safe，生产未被半更新）。
#   ⇒ 该耦合已在 ci-cd.yml 的行级 should-build / was-built 门禁中补上 docker-config 分支。
#     **不要**把它挪回 job 级 any-change：job 级只管「要不要起这个矩阵」，管不到「某一行要不要构建」。
# ---------------------------------------------------------------------------
# 【2026-10-03 内存 limits 压降（未完成清单 B-1）】
# ---------------------------------------------------------------------------
# 背景：生产为 4 核 / **7.94 GB（≈8130 MiB）物理内存 / 无 swap**，而本文件 15 组
#   `deploy.resources.limits.memory` 累加原为 **8064 MiB = 7.875 GiB = 物理内存的 99.2%**
#   —— 余量仅 66 MiB，等于**没有内存溢出余量**：任一服务峰值一起上（10 个 JVM 同启、
#   MySQL buffer pool 涨、Nacos 建表迁移）就会触发宿主机 OOM Killer 随机杀容器，
#   且**没有 swap 兜底**，失败面是全站而不是单个服务。
#
# 本批改动（**按比例下调，且刻意保持「堆:限」与「非堆余量:限」两个比例不变**）：
#   mysql              1024M → 896M   （reservations 512M → 448M）
#   nacos              1024M → 768M   （reservations 256M → 192M）
#   rabbitmq            512M → 384M
#   10 个后端 + gateway 512M → 448M   （各 reservations 256M → 224M）
#   redis 256M / frontend-nginx 128M  **不动**（本就小，且 redis 是 AOF 持久化关键路径）
#
# 改后累加 = 896 + 768 + 256 + 384 + 448×10 + 128 = **6912 MiB = 6.75 GiB**
#   （⚠️ 是 **448×10** 不是 ×11 —— 10 个 448M 服务 = project/im/email/share/file/team/
#     audit/admin/user + gateway；frontend-nginx 是 128M，别把它算进 448 那组。）
#   占物理内存 6912 / 8130.56 = **85.0%**，余量 = 8130.56 − 6912 = **1218.56 MiB ≈ 1.190 GiB（15.0%）**
#   即把「0.8% 余量」提到「15.0% 余量」，够覆盖宿主机自身 + Docker daemon + 页缓存抖动。
#   （改前 8064 MiB / 99.2% / 余量仅 66.56 MiB）
#
# 【2026-10-10 ISSUE/51 P1 内存防线追加】redis 256M → 896M（db9 会话防线，见 redis 服务注释；
#   reservations 128M → 448M 同步上调）；rabbitmq limit 384M 不动，改加内存水位线。
#   ⇒ 改后累加 = 896 + 768 + 896 + 384 + 448×10 + 128 = **7552 MiB = 7.375 GiB**
#   占物理内存 7552 / 8130.56 = **92.9%**，余量 578.56 MiB（7.1%）——
#   低于 2026-10-03 的 15% 余量，属有意取舍：用宿主余量换「Redis OOM = 全站会话丢失」
#   失败面的消失（noeviction + 896M limit 后 Redis 只会拒写、不会被 OOM 杀）。
#
# 🔴 为什么是「同比例」而不是「只压 limits」：
#   JVM 堆由环境变量 `JAVA_OPTS: -XX:MaxRAMPercentage=75.0` **按容器 limit 推算**
#   （JDK 10+ 容器感知）。所以压 limit 而不动百分比时，堆天花板会同比例下降 ——
#   512M→448M 时堆 384M→336M（−12.5%）**并非意外，而是同一比例的结果**；
#   非堆余量（Metaspace/CodeCache/线程栈/Direct）128M→112M 也同比例。
#   两个比例都不变 ⇒ 安全画像与线上已跑通的现状一致，降低的是**总量**而非**结构**。
#
#   ⚠️ 反例（**不要做**）—— 数字化，便于事后判定是否有人改错方向：
#      在 limit 保持 448M 的前提下上调 MaxRAMPercentage，非堆余量会被堆挤掉：
#        75%（本批取值）→ 堆 336 MiB，非堆余量 **112 MiB**
#        78%           → 堆 349 MiB，非堆余量  99 MiB
#        80%           → 堆 358 MiB，非堆余量  **90 MiB**（比改前的 128 MiB 紧 38 MiB，−30%）
#        85%           → 堆 381 MiB，非堆余量  67 MiB（比改前紧 61 MiB，−48%）
#        90%           → 堆 403 MiB，非堆余量  45 MiB（比改前紧 83 MiB，−65%）
#      ⇒ 判据：**只允许 75.0（或更低）**。非堆余量 < 112 MiB 即代表有人上调过百分比，
#        此时 OOM 风险**比改前更高**（改前还有 128 MiB），必须改回。
#        理由：Metaspace/CodeCache/线程栈/Direct 是**不可压缩**的常驻开销，
#        堆挤过去不会"自动让出来"，只会让容器在峰值时被 OOM Killer 杀掉（无 swap 兜底）。
#
# ⚠️ 三项必须同批（同一次全量重建）执行，否则「限压了但 .env 没改」这类半更新会
#   让线上停在新旧混合状态：
#   ① 本文件的内存 limits（本段）
#   ② 服务器 .env 删除 `REDIS_DATABASE=0`（见 .env.example 的 I-4 说明）
#   ③ 服务器 .env 切 `CONFIG_DB_USERNAME=zxyz_config`（见下方 flyway 服务的 I-9 说明）
#   完整执行步骤与上线后验证命令：**docs/claude-infra.md《维护窗口》章节**。
# ---------------------------------------------------------------------------
services:
  mysql:
    image: mysql:8.4.0-oraclelinux8@sha256:f7a8e140a7d6d1e6e0c99eeb0489c50a186ee4ac44ff55323a176529b9a43d33
    container_name: zxyz-mysql
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 896M
          cpus: '1.0'
        reservations:
          memory: 448M
          cpus: '0.5'
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      # PITR（时间点恢复）：显式开启 ROW 格式 binlog（MySQL 8 默认已开，此处固化名称
      # 便于 backup.sh 增量拷贝）。RPO 从每日全量的 24h 降到分钟级。
      # 注意：保留期必须用 --binlog-expire-logs-seconds —— --expire-logs-days 已在
      # MySQL 8.2 移除，8.4 下使用会导致 mysqld 启动直接报错（容器起不来）。
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-expire-logs-seconds=604800
    volumes:
      - ${DATA_DIR:-./data}/mysql:/var/lib/mysql
      - ./sql/00-init-zxyz.sh:/docker-entrypoint-initdb.d/00-init-zxyz.sh:ro
      # Nacos 3.x 的 MySQL 模式不会自动建表（数据源自检失败报 No DataSource set），
      # schema 必须随 initdb 导入；文件取自 nacos-server:3.2.1 镜像内 conf/mysql-schema.sql
      - ./sql/nacos-mysql-schema.sql:/docker-entrypoint-initdb.d/01-nacos-schema.sql:ro
    networks:
      - zxyz-net
    healthcheck:
      # 密码经容器内环境变量 MYSQL_PWD 传递，不在 mysqladmin argv 中出现（避免 ps 泄露）
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\" mysqladmin ping -h127.0.0.1 -uroot --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      # 首次启动要初始化数据目录 + 临时 server + initdb 脚本（实测 46s+），
      # 30s 窗口内 ready 不了 → compose 判 unhealthy → 依赖它的全部服务起不来。
      # 120s 覆盖慢盘首启；后续重启数据目录已就绪，几秒即 healthy 不受影响。
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"

  nacos:
    image: nacos/nacos-server:v3.2.1@sha256:8b9bbcf2367b90b14f9657d1b6e3a0d4d12050f2c722e0d64a97259da7cb9d00
    container_name: zxyz-nacos
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '0.5'
        reservations:
          memory: 192M
          cpus: '0.25'
    environment:
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: nacos
      MYSQL_SERVICE_USER: ${NACOS_DB_USERNAME:?缺少 NACOS_DB_USERNAME，请先运行 scripts/init-secrets.sh}
      MYSQL_SERVICE_PASSWORD: ${NACOS_DB_PASSWORD:?缺少 NACOS_DB_PASSWORD，请先运行 scripts/init-secrets.sh}
      MYSQL_SERVICE_DB_PARAM: "useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
      JVM_XMS: 512m
      JVM_XMX: 512m
      JVM_XMN: 256m
      # Nacos 鉴权配置 — 生产环境必须通过环境变量注入，禁止使用默认密码
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE}
      # Nacos 控制台管理员密码，必须在 .env 中覆盖默认值
      NACOS_PASSWORD: ${NACOS_PASSWORD}
    ports:
      - "127.0.0.1:${NACOS_PORT:-8848}:8848"
      - "127.0.0.1:${NACOS_CONSOLE_PORT:-8080}:8080"
      # Nacos 3.x gRPC 端口（主端口+1000，客户端自动 +1000 连接，宿主端口须为 NACOS_PORT+1000）
      - "127.0.0.1:${NACOS_GRPC_PORT:-19048}:9848"
    volumes:
      - ${DATA_DIR:-./data}/nacos:/home/nacos/data
      - ${DATA_DIR:-./data}/nacos-logs:/home/nacos/logs
    networks:
      - zxyz-net
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      # Nacos 3.x: console API returns 500; use /next/ (React UI) which returns 200
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/next/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      # Nacos 3.x 首启要连 MySQL 建表/做 v2→v3 迁移（512m 堆），实测远超 120s；
      # 窗口内判死会让 depends_on 的 10 个应用服务全部无法启动
      start_period: 300s
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"

  nacos-log-cleanup:
    image: alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    container_name: zxyz-nacos-log-cleanup
    restart: unless-stopped
    entrypoint: /bin/sh
    command: -c "while true; do find /logs -name '*.log.*' -mtime +7 -delete 2>/dev/null; find /logs -name 'nacos.log' -size +100M -exec truncate -s 20M {} \\; 2>/dev/null; sleep 3600; done"
    volumes:
      - ${DATA_DIR:-./data}/nacos-logs:/logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "1"

  # --- 运维工具（默认不启动；用法：docker compose --profile tools run --rm flyway <args>） ---
  # 审计 D4a：原先是 scripts/deploy-fast.sh 里裸的 `docker run flyway/flyway:10.12`，只有 tag。
  # 把 digest 钉在 .sh 里没用 —— Dependabot 的 docker / docker-compose 生态**只扫 Dockerfile 与
  # compose、不看 .sh**，那样这个 pin 永远不被监控（连"上游发新版"都不会有人知道），
  # 恰好重演本项目已踩过的"镜像不被监控"。收成 compose 服务后，digest 就落在
  # .github/dependabot.yml 已有的 `docker-compose` 生态视野内。
  flyway:
    image: flyway/flyway:10.12@sha256:ac06f3b8d08887be37b7753f40f4a7315df750d9b42ad3ee5bcd10e29f163a3e
    container_name: zxyz-flyway
    profiles: ["tools"]
    restart: "no"
    # 默认只打印帮助：避免有人 `docker compose --profile tools up` 时误跑迁移
    command: ["-?"]
    environment:
      # 审计 D4a：不再用 root，复用 admin-service 那套凭证。
      #
      # ⚠️ 2026-10-03 事实订正（审计 I-9 / 未完成清单 B-1）：
      #   原文写「当前线上 .env 的 CONFIG_DB_USERNAME=root ⇒ 与改造前**完全等价**；
      #   待运维窗口把 .env 切成 zxyz_config 后，repair 自动变成最小权限」——
      #   这句「待运维窗口」已从**临时状态变成永久状态**，注释与事实相反，故订正为：
      #   仓库工作区 .env 实测仍为 `CONFIG_DB_USERNAME=root`（2026-10-03 复核），
      #   即 admin-service 与 flyway 容器仍以 MySQL **root** 跑 zxyz_config 的 Flyway DDL，
      #   U1「最小权限」改造在 config 库**未闭合**；grant-least-privilege.sh 每次部署都会
      #   建好的 `zxyz_config` 账户（scripts/grant-least-privilege.sh:139 映射表）无人使用。
      #   风险：admin-service 或该容器被攻破 = 拿到全库 DBA，爆炸半径收敛目标在 config 库落空。
      #
      #   ⇒ 切换动作（**已并入本次「维护窗口」批**，与 .env.example 的 REDIS_DATABASE 删除同批）：
      #       sed -i 's/^CONFIG_DB_USERNAME=.*/CONFIG_DB_USERNAME=zxyz_config/' /www/zxyz/.env
      #       cd /www/zxyz && docker compose up -d admin-service flyway
      #     前提：grant-least-privilege.sh 已跑过（部署流程会自动跑，账户已存在）。
      #     注意：改 .env 后 `restart` 不重载环境变量，必须 `up -d`
      #     （本批本来就是全量重建，见 docs/claude-infra.md 的维护窗口章节）。
      #     回退：把 CONFIG_DB_USERNAME 改回 root 并把 CONFIG_DB_PASSWORD 设为
      #     MYSQL_ROOT_PASSWORD 同值（compose 不支持嵌套 ${A:-${B}}，必须显式写同值）。
      FLYWAY_URL: jdbc:mysql://mysql:3306/zxyz_config?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      FLYWAY_USER: ${CONFIG_DB_USERNAME:?缺少 CONFIG_DB_USERNAME，请先运行 scripts/init-secrets.sh}
      FLYWAY_PASSWORD: ${CONFIG_DB_PASSWORD:?缺少 CONFIG_DB_PASSWORD，请先运行 scripts/init-secrets.sh}
    networks:
      - zxyz-net
    depends_on:
      mysql:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "1"

  redis:
    image: redis:8.10-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
    container_name: zxyz-redis
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # ISSUE/51 P1（2026-10-10）：256M → 896M。db9 已承载全部用户会话（Boot4 迁移终验通过），
          # 「Redis 被 OOM 杀 = 全站下线」的失败面必须收窄：
          #   maxmemory 512mb（见 command 行注释）写死数据集上限，896M limit = 512mb 数据集
          #   + AOF 重写 fork COW / 连接缓冲 / 碎片等 Redis 自身开销的余量；
          #   先由 maxmemory 拒写自保护，cgroup limit 只作最后兜底。
          memory: 896M
          cpus: '0.5'
        reservations:
          # 与 limits 同步上调（本文件惯例：reservations ≈ limits 50%，参照 mysql 896M/448M），
          # 避免宿主回收压力下会话存储容器被优先驱逐。
          memory: 448M
          cpus: '0.25'
    # ISSUE/51 P1（2026-10-10）内存防线，两个参数缺一不可：
    #   --maxmemory 512mb —— db9 只存 Sa-Token 会话，单 session 键 <2KB，万级用户 << 512mb；
    #     无上限时 Redis 内存无界增长，宿主 OOM Killer 会随机选牺牲者（rabbitmq 已被这样杀过一次）。
    #   --maxmemory-policy noeviction —— 到达上限后拒绝写入并报错（新登录显式失败、易定位），
    #     绝不按策略逐出既有键（evicted 会话 = 用户被莫名登出 = 静默故障）。
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\" --maxmemory 512mb --maxmemory-policy noeviction"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - ${DATA_DIR:-./data}/redis:/data
    networks:
      - zxyz-net
    healthcheck:
      # 审计 2.3.7：密码经环境变量 REDISCLI_AUTH 传入，不再出现在 argv 里
      # （`redis-cli -a <pwd>` 会让同机任意进程从 /proc/<pid>/cmdline 读到密码）。
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  rabbitmq:
    image: rabbitmq:3.13-management-alpine@sha256:606d8c0d6b3c18d1da9afc53bc7cdb2a8d5486df91b5a9830e9e07626c9ae281
    container_name: zxyz-rabbitmq
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # ISSUE/51 P1（2026-10-10）：limit 保持 384M 不动（总内存预算不再增加），
          # 内存防线交给下方 watermark：先触发 memory alarm 降级，cgroup limit 只作最后兜底。
          memory: 384M
          cpus: '0.5'
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      # ISSUE/51 P1（2026-10-10）内存水位线：0.6 = 相对值（rabbitmq 曾被 OOM Killer 杀过一次）。
      # 选相对值而非 absolute 的理由：RabbitMQ 3.12+ 在容器内会探测 cgroup memory limit
      #   并把相对水位锚定到它（0.6 × 384M ≈ 230MB），将来调容器 limit 时水位自动跟随。
      # 到达水位即触发 memory alarm：阻塞发布者、先把队列 page 到盘 —— 有意降级而非被杀。
      # ⚠️ 内存水位线的正确载体是下方挂载的 conf/rabbitmq.conf（RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS
      #   的值含空格会被 erl 命令行吞成独立 boot 参数 → 启动即崩；RABBITMQ_VM_MEMORY_HIGH_WATERMARK
      #   在 3.13 已废弃且硬拒绝启动）：
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - ${DATA_DIR:-./data}/rabbitmq:/var/lib/rabbitmq
      - ./conf/rabbitmq.conf:/etc/rabbitmq/conf.d/99-memory-watermark.conf:ro
    networks:
      - zxyz-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
      # start_period 让冷启动期间的临时失败不消耗 retries，避免被误判为不健康阻塞依赖服务
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

