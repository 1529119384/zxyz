# ---------------------------------------------------------------------------
# 服务间鉴权（P2-A2 每服务独立密钥 + 白名单矩阵）
#
# 当前默认：矩阵**已全量启用**（不再是"过渡模式 / allowed-sources 为空 map"）——
# 9 个业务服务 + gateway 的 environment 均以 SPRING_APPLICATION_JSON 预置完整的
# app.internal.allowed-sources 映射（来源服务名 -> 该来源的 SVC_*_KEY），
# 且每个 SVC_*_KEY 都用 `:?` 硬失败：缺任一键则对应服务拒绝启动。
# 服务间校验**不再**回退到单一 INTERNAL_SERVICE_TOKEN。
#
# 机制说明（以下 1)~4) 是"矩阵由哪些部分构成"，不是"待做的启用步骤"）：
#   1) SVC_*_KEY 由 scripts/init-secrets.sh 自动生成（每服务独立、互不相同、≠ INTERNAL_SERVICE_TOKEN），
#      .env.example 中已取消注释；运行 init-secrets.sh 即写入 .env，无需手填。
#   2) 各服务 environment 已注入 `APP_INTERNAL_SERVICE_KEY: ${SVC_<SERVICE>_KEY}`
#      （= 该服务自己向收方签发的密钥；缺此则发方持 legacy token 会被收方拒）。
#   3) 收方 app.internal.allowed-sources 由本文件的 SPRING_APPLICATION_JSON 逐服务预置
#      "允许来源服务名 -> 该来源密钥" 的**完整映射**；10 个服务均已预置
#      （email-service 是当初的试点，现已是全量）。
#   4) gateway 服务 environment 已注入 `SVC_GATEWAY_KEY: ${SVC_GATEWAY_KEY:?启用矩阵必须设置 SVC_GATEWAY_KEY}`
#      （用 :? 硬失败；变量缺失则网关拒绝启动，桥接不会带空 token 401）。
#      网关已用 StripInternalHeadersFilter 剥离外部伪造的 X-Internal-Service-Token / X-Internal-Caller-Service，
#      并在 admin-email 桥接路由以 zxyz-gateway 身份自注入受信内部头：
#      token 取 ${SVC_GATEWAY_KEY:${INTERNAL_SERVICE_TOKEN}}（矩阵优先、过渡回退）。
#      admin-database 路由不注入内部头（该路径走 Sa-Token 登录态 + @SaCheckRole，不消费内部 token）。
# 警告：allowed-sources 一旦启用，任何未列举来源将被拒（fail-closed）；密钥键禁 YAML 默认值，
#      未定义环境变量对应服务拒绝启动（强制配齐）。SVC_GATEWAY_KEY 必须与 email 的 allowed-sources
#      中 zxyz-gateway 项一致，否则 admin 邮件管理经网关调用在矩阵下 401。
#      灰度已完成（email 先行，随后铺开到全部 10 个服务）；完整手稿见 docs/matrix-enable-guide.md。
# ---------------------------------------------------------------------------
# 【重要】本文件的任何改动（哪怕只改注释）都会走「配置变更 ⇒ 全量重建」：
#   detect-changes 的 docker-config 组命中本文件 ⇒ scripts/deploy-on-server.sh 把 UPDATE_SVC
#   覆盖为全部 11 个服务（含 frontend-nginx），且 IMAGE_TAG 取**本次新 sha**。
#   因此 CI 的 build-and-push 必须把 11 个镜像**全部构建**：否则该 sha 的镜像不存在，
#   部署会在镜像预检处 IMAGE_MISSING 硬失败（run 34733088945 即此故 —— 仅配置变更 +
#   前端无变更 ⇒ 前端行被判「no changes」跳过 ⇒ 整条部署中止；fail-safe，生产未被半更新）。
#   ⇒ 该耦合已在 ci-cd.yml 的行级 should-build / was-built 门禁中补上 docker-config 分支。
#     **不要**把它挪回 job 级 any-change：job 级只管「要不要起这个矩阵」，管不到「某一行要不要构建」。
# ---------------------------------------------------------------------------
services:
  mysql:
    image: mysql:8.4.0-oraclelinux8@sha256:f7a8e140a7d6d1e6e0c99eeb0489c50a186ee4ac44ff55323a176529b9a43d33
    container_name: zxyz-mysql
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      # PITR（时间点恢复）：显式开启 ROW 格式 binlog（MySQL 8 默认已开，此处固化名称
      # 便于 backup.sh 增量拷贝）。RPO 从每日全量的 24h 降到分钟级。
      # 注意：保留期必须用 --binlog-expire-logs-seconds —— --expire-logs-days 已在
      # MySQL 8.2 移除，8.4 下使用会导致 mysqld 启动直接报错（容器起不来）。
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-expire-logs-seconds=604800
    volumes:
      - ${DATA_DIR:-./data}/mysql:/var/lib/mysql
      - ./sql/00-init-zxyz.sh:/docker-entrypoint-initdb.d/00-init-zxyz.sh:ro
      # Nacos 3.x 的 MySQL 模式不会自动建表（数据源自检失败报 No DataSource set），
      # schema 必须随 initdb 导入；文件取自 nacos-server:3.2.1 镜像内 conf/mysql-schema.sql
      - ./sql/nacos-mysql-schema.sql:/docker-entrypoint-initdb.d/01-nacos-schema.sql:ro
    networks:
      - zxyz-net
    healthcheck:
      # 密码经容器内环境变量 MYSQL_PWD 传递，不在 mysqladmin argv 中出现（避免 ps 泄露）
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\" mysqladmin ping -h127.0.0.1 -uroot --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      # 首次启动要初始化数据目录 + 临时 server + initdb 脚本（实测 46s+），
      # 30s 窗口内 ready 不了 → compose 判 unhealthy → 依赖它的全部服务起不来。
      # 120s 覆盖慢盘首启；后续重启数据目录已就绪，几秒即 healthy 不受影响。
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"

  nacos:
    image: nacos/nacos-server:v3.2.1@sha256:8b9bbcf2367b90b14f9657d1b6e3a0d4d12050f2c722e0d64a97259da7cb9d00
    container_name: zxyz-nacos
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    environment:
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: nacos
      MYSQL_SERVICE_USER: ${NACOS_DB_USERNAME:?缺少 NACOS_DB_USERNAME，请先运行 scripts/init-secrets.sh}
      MYSQL_SERVICE_PASSWORD: ${NACOS_DB_PASSWORD:?缺少 NACOS_DB_PASSWORD，请先运行 scripts/init-secrets.sh}
      MYSQL_SERVICE_DB_PARAM: "useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
      JVM_XMS: 512m
      JVM_XMX: 512m
      JVM_XMN: 256m
      # Nacos 鉴权配置 — 生产环境必须通过环境变量注入，禁止使用默认密码
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE}
      # Nacos 控制台管理员密码，必须在 .env 中覆盖默认值
      NACOS_PASSWORD: ${NACOS_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${NACOS_PORT:-8848}:8848"
      - "127.0.0.1:${NACOS_CONSOLE_PORT:-8080}:8080"
      # Nacos 3.x gRPC 端口（主端口+1000，客户端自动 +1000 连接，宿主端口须为 NACOS_PORT+1000）
      - "127.0.0.1:${NACOS_GRPC_PORT:-19048}:9848"
    volumes:
      - ${DATA_DIR:-./data}/nacos:/home/nacos/data
      - ${DATA_DIR:-./data}/nacos-logs:/home/nacos/logs
    networks:
      - zxyz-net
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      # Nacos 3.x: console API returns 500; use /next/ (React UI) which returns 200
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/next/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      # Nacos 3.x 首启要连 MySQL 建表/做 v2→v3 迁移（512m 堆），实测远超 120s；
      # 窗口内判死会让 depends_on 的 10 个应用服务全部无法启动
      start_period: 300s
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"

  nacos-log-cleanup:
    image: alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    container_name: zxyz-nacos-log-cleanup
    restart: unless-stopped
    entrypoint: /bin/sh
    command: -c "while true; do find /logs -name '*.log.*' -mtime +7 -delete 2>/dev/null; find /logs -name 'nacos.log' -size +100M -exec truncate -s 20M {} \\; 2>/dev/null; sleep 3600; done"
    volumes:
      - ${DATA_DIR:-./data}/nacos-logs:/logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "1"

  # --- 运维工具（默认不启动；用法：docker compose --profile tools run --rm flyway <args>） ---
  # 审计 D4a：原先是 scripts/deploy-fast.sh 里裸的 `docker run flyway/flyway:10.12`，只有 tag。
  # 把 digest 钉在 .sh 里没用 —— Dependabot 的 docker / docker-compose 生态**只扫 Dockerfile 与
  # compose、不看 .sh**，那样这个 pin 永远不被监控（连"上游发新版"都不会有人知道），
  # 恰好重演本项目已踩过的"镜像不被监控"。收成 compose 服务后，digest 就落在
  # .github/dependabot.yml 已有的 `docker-compose` 生态视野内。
  flyway:
    image: flyway/flyway:13.7@sha256:f8b67e58dd85b54ade4e3fe093a5b9c79dc02d55b7bb090d4fddb23211dea63a
    container_name: zxyz-flyway
    profiles: ["tools"]
    restart: "no"
    # 默认只打印帮助：避免有人 `docker compose --profile tools up` 时误跑迁移
    command: ["-?"]
    environment:
      # 审计 D4a：不再用 root，复用 admin-service 那套凭证。
      # 当前线上 .env 的 CONFIG_DB_USERNAME=root ⇒ 与改造前**完全等价**；
      # 待运维窗口把 .env 切成 zxyz_config（并用 scripts/grant-least-privilege.sh 建号）后，
      # repair 自动变成最小权限，代码侧无需再改。
      FLYWAY_URL: jdbc:mysql://mysql:3306/zxyz_config?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      FLYWAY_USER: ${CONFIG_DB_USERNAME:?缺少 CONFIG_DB_USERNAME，请先运行 scripts/init-secrets.sh}
      FLYWAY_PASSWORD: ${CONFIG_DB_PASSWORD:?缺少 CONFIG_DB_PASSWORD，请先运行 scripts/init-secrets.sh}
      TZ: Asia/Shanghai
    networks:
      - zxyz-net
    depends_on:
      mysql:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "1"

  redis:
    image: redis:8.10-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
    container_name: zxyz-redis
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - ${DATA_DIR:-./data}/redis:/data
    networks:
      - zxyz-net
    healthcheck:
      # 审计 2.3.7：密码经环境变量 REDISCLI_AUTH 传入，不再出现在 argv 里
      # （`redis-cli -a <pwd>` 会让同机任意进程从 /proc/<pid>/cmdline 读到密码）。
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  rabbitmq:
    image: rabbitmq:3.13-management-alpine@sha256:606d8c0d6b3c18d1da9afc53bc7cdb2a8d5486df91b5a9830e9e07626c9ae281
    container_name: zxyz-rabbitmq
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - ${DATA_DIR:-./data}/rabbitmq:/var/lib/rabbitmq
    networks:
      - zxyz-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
      # start_period 让冷启动期间的临时失败不消耗 retries，避免被误判为不健康阻塞依赖服务
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  project-service:
    build:
      context: .
      dockerfile: ZXYZdatabaseBack/Dockerfile
      args:
        MODULE: zxyz-project-service
    image: ${IMAGE_PREFIX:-}zxyz-project-service:${APP_IMAGE_TAG:-latest}
    container_name: zxyz-project-service
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        # 为什么：原来只有 limits 没有 reservations，调度器无法预留资源，节点压力下易被驱逐。
        # reservations 取 limits 约 40%（512M→256M、1.0→0.4），且严格小于 limits（compose 不允许 reservations>limits）。
        reservations:
          memory: 256M
          cpus: '0.4'
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nacos:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_OPTS: "-XX:MaxRAMPercentage=75.0 -XX:TieredStopAtLevel=1 -Dfile.encoding=UTF-8"
      SERVER_PORT: ${PROJECT_SERVICE_PORT:-18080}
      APP_INTERNAL_SERVICE_KEY: ${SVC_PROJECT_KEY:?启用矩阵必须设置 SVC_PROJECT_KEY}
      TZ: Asia/Shanghai
      PROJECT_DATASOURCE_URL: jdbc:mysql://mysql:3306/zxyz_project?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      PROJECT_DATASOURCE_USERNAME: ${PROJECT_DB_USERNAME:?缺少 PROJECT_DB_USERNAME，请先运行 scripts/init-secrets.sh}
      PROJECT_DATASOURCE_PASSWORD: ${PROJECT_DB_PASSWORD:?缺少 PROJECT_DB_PASSWORD，请先运行 scripts/init-secrets.sh}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DATABASE: ${REDIS_DATABASE:-1}
      IM_SERVICE_BASE_URL: http://zxyz-im-service
      EMAIL_SERVICE_BASE_URL: http://zxyz-email-service
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      SPRING_APPLICATION_JSON: '{"app":{"internal":{"allowed-sources":"{''zxyz-user-service'':''${SVC_USER_KEY:?启用矩阵必须设置 SVC_USER_KEY}'',''zxyz-admin-service'':''${SVC_ADMIN_KEY:?启用矩阵必须设置 SVC_ADMIN_KEY}'',''zxyz-project-service'':''${SVC_PROJECT_KEY:?启用矩阵必须设置 SVC_PROJECT_KEY}'',''zxyz-im-service'':''${SVC_IM_KEY:?启用矩阵必须设置 SVC_IM_KEY}'',''zxyz-file-service'':''${SVC_FILE_KEY:?启用矩阵必须设置 SVC_FILE_KEY}'',''zxyz-team-service'':''${SVC_TEAM_KEY:?启用矩阵必须设置 SVC_TEAM_KEY}'',''zxyz-gateway'':''${SVC_GATEWAY_KEY:?启用矩阵必须设置 SVC_GATEWAY_KEY}'',''zxyz-email-service'':''${SVC_EMAIL_KEY:?启用矩阵必须设置 SVC_EMAIL_KEY}'',''zxyz-share-service'':''${SVC_SHARE_KEY:?启用矩阵必须设置 SVC_SHARE_KEY}'',''zxyz-audit-service'':''${SVC_AUDIT_KEY:?启用矩阵必须设置 SVC_AUDIT_KEY}''}"}}}'
      SHARE_COOKIE_SECRET: ${SHARE_COOKIE_SECRET}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}
      FILE_SERVICE_BASE_URL: http://zxyz-file-service
      TEAM_SERVICE_BASE_URL: http://zxyz-team-service
      USER_SERVICE_BASE_URL: http://zxyz-user-service
      SHARE_SERVICE_BASE_URL: http://zxyz-share-service
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?缺少 CORS_ALLOWED_ORIGINS，请先运行 scripts/init-secrets.sh 或手工填写真实域名}
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-}
      JASYPT_PASSWORD: ${JASYPT_PASSWORD}
      ADMIN_SERVICE_BASE_URL: ${ADMIN_SERVICE_BASE_URL:-http://zxyz-admin-service}
    networks:
      - zxyz-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:${PROJECT_SERVICE_PORT:-18080}/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 4
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"

  im-service:
    build:
      context: .
      dockerfile: ZXYZdatabaseBack/Dockerfile
      args:
        MODULE: zxyz-im-service
    image: ${IMAGE_PREFIX:-}zxyz-im-service:${APP_IMAGE_TAG:-latest}
    container_name: zxyz-im-service
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        # 为什么：原来只有 limits 没有 reservations，调度器无法预留资源，节点压力下易被驱逐。
        # reservations 取 limits 约 40%（512M→256M、1.0→0.4），且严格小于 limits（compose 不允许 reservations>limits）。
        reservations:
          memory: 256M
          cpus: '0.4'
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nacos:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_OPTS: "-XX:MaxRAMPercentage=75.0 -XX:TieredStopAtLevel=1 -Dfile.encoding=UTF-8"
      SERVER_PORT: ${IM_SERVICE_PORT:-18081}
      APP_INTERNAL_SERVICE_KEY: ${SVC_IM_KEY:?启用矩阵必须设置 SVC_IM_KEY}
      TZ: Asia/Shanghai
      IM_DATASOURCE_URL: jdbc:mysql://mysql:3306/zxyz_im?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      IM_DATASOURCE_USERNAME: ${IM_DB_USERNAME:?缺少 IM_DB_USERNAME，请先运行 scripts/init-secrets.sh}
      IM_DATASOURCE_PASSWORD: ${IM_DB_PASSWORD:?缺少 IM_DB_PASSWORD，请先运行 scripts/init-secrets.sh}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DATABASE: ${REDIS_DATABASE:-2}
      USER_SERVICE_BASE_URL: http://zxyz-user-service
      FILE_SERVICE_BASE_URL: http://zxyz-file-service
      TEAM_SERVICE_BASE_URL: http://zxyz-team-service
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
