      EMAIL_SERVICE_BASE_URL: http://zxyz-email-service
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      OSS_REGION: ${OSS_REGION}
      OSS_BUCKET: ${OSS_BUCKET}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET}
      OSS_ENDPOINT: ${OSS_ENDPOINT}
      OSS_PUBLIC_BASE_URL: ${OSS_PUBLIC_BASE_URL}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      VERIFICATION_RETURN_CODE: ${VERIFICATION_RETURN_CODE:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: nacos
      NACOS_PASSWORD: ${NACOS_PASSWORD:-CHANGE_ME_NACOS}
    networks:
      - zxyz-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:${SERVER_PORT:-18083}/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"

  gateway:
    build:
      context: .
      dockerfile: ZXYZdatabaseBack/Dockerfile
      args:
        MODULE: zxyz-gateway
    image: ${DOCKERHUB_PREFIX:-}zxyz-gateway:${APP_IMAGE_TAG:-latest}
    container_name: zxyz-gateway
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    depends_on:
      nacos:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: ${SERVER_PORT:-18000}
      TZ: Asia/Shanghai
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DATABASE: ${REDIS_DATABASE:-0}
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: nacos
      NACOS_PASSWORD: ${NACOS_PASSWORD:-CHANGE_ME_NACOS}
      IM_WEBSOCKET_URI: ${IM_WEBSOCKET_URI:-ws://im-service:${IM_NETTY_PORT:-19090}}
      MAX_REQUEST_SIZE: ${MAX_REQUEST_SIZE:-512MB}
    networks:
      - zxyz-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:${SERVER_PORT:-18000}/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"

  frontend-nginx:
    build:
      context: .
      dockerfile: ZXYZdatabaseFront/Dockerfile
    image: ${DOCKERHUB_PREFIX:-}zxyz-frontend-nginx:${APP_IMAGE_TAG:-latest}
    container_name: zxyz-frontend-nginx
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
    depends_on:
      gateway:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    ports:
      - "${HTTP_PORT:-80}:80"
    networks:
      - zxyz-net

  loki:
    image: grafana/loki:3.0.0
    container_name: zxyz-loki
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    volumes:
      - ${DATA_DIR:-./data}/loki:/loki
    networks:
      - zxyz-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  promtail:
    image: grafana/promtail:3.0.0
    container_name: zxyz-promtail
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./deploy/promtail-config.yml:/etc/promtail/config.yml:ro
    networks:
      - zxyz-net
    depends_on:
      loki:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

networks:
  zxyz-net:
    driver: bridge
# 触发 CI 全量构建
