# ---------------------------------------------------------------------------
# 服务间鉴权（P2-A2 每服务独立密钥 + 白名单矩阵）
#
# 当前默认：过渡模式 —— 所有收方 app.internal.allowed-sources 为空 map，
# 服务间校验回退到单一 INTERNAL_SERVICE_TOKEN（docker-compose 每个服务已注入），
# 现有 dev/生产无需配置即可启动，行为与历史一致。
#
# 启用服务级白名单矩阵（生产安全隔离，阻止「持 token 服务伪造任意来源」）：
#   1) SVC_*_KEY 已由 scripts/init-secrets.sh 自动生成（每服务独立、互不相同、≠ INTERNAL_SERVICE_TOKEN），
#      .env.example 中已取消注释；运行 init-secrets.sh 即写入 .env，无需手填。
#   2) 各服务 environment 已注入 `APP_INTERNAL_SERVICE_KEY: ${SVC_<SERVICE>_KEY}`
#      （= 该服务自己向收方签发的密钥；缺此则矩阵启用后发方仍持 legacy token 会被收方拒）。
#   3) 收方 app.internal.allowed-sources 由各服务 application.yml 声明「允许来源服务名 -> 该来源密钥」映射；
#      email-service 已通过 SPRING_APPLICATION_JSON 预置 allowed-sources 试点。
#   4) gateway 服务 environment 已注入 `SVC_GATEWAY_KEY: ${SVC_GATEWAY_KEY:?启用矩阵必须设置 SVC_GATEWAY_KEY}`
#      （用 :? 硬失败；变量缺失则网关拒绝启动，桥接不会带空 token 401）。
#      网关已用 StripInternalHeadersFilter 剥离外部伪造的 X-Internal-Service-Token / X-Internal-Caller-Service，
#      并在 admin-email 桥接路由以 zxyz-gateway 身份自注入受信内部头：
#      token 取 ${SVC_GATEWAY_KEY:${INTERNAL_SERVICE_TOKEN}}（矩阵优先、过渡回退）。
#      admin-database 路由不注入内部头（该路径走 Sa-Token 登录态 + @SaCheckRole，不消费内部 token）。
# 警告：allowed-sources 一旦启用，任何未列举来源将被拒（fail-closed）；密钥键禁 YAML 默认值，
#      未定义环境变量对应服务拒绝启动（强制配齐）。SVC_GATEWAY_KEY 必须与 email 的 allowed-sources
#      中 zxyz-gateway 项一致，否则 admin 邮件管理经网关调用在矩阵下 401。
#      建议先单服务（如 email）灰度再铺开；完整手稿见 docs/matrix-enable-guide.md。
# ---------------------------------------------------------------------------
services:
  mysql:
    image: mysql:8.4.0-oraclelinux8
    container_name: zxyz-mysql
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - ${DATA_DIR:-./data}/mysql:/var/lib/mysql
      - ./sql/00-init-zxyz.sh:/docker-entrypoint-initdb.d/00-init-zxyz.sh:ro
      # Nacos 3.x 的 MySQL 模式不会自动建表（数据源自检失败报 No DataSource set），
      # schema 必须随 initdb 导入；文件取自 nacos-server:3.2.1 镜像内 conf/mysql-schema.sql
      - ./sql/nacos-mysql-schema.sql:/docker-entrypoint-initdb.d/01-nacos-schema.sql:ro
    networks:
      - zxyz-net
    healthcheck:
      # 密码经容器内环境变量 MYSQL_PWD 传递，不在 mysqladmin argv 中出现（避免 ps 泄露）
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\" mysqladmin ping -h127.0.0.1 -uroot --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      # 首次启动要初始化数据目录 + 临时 server + initdb 脚本（实测 46s+），
      # 30s 窗口内 ready 不了 → compose 判 unhealthy → 依赖它的全部服务起不来。
      # 120s 覆盖慢盘首启；后续重启数据目录已就绪，几秒即 healthy 不受影响。
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"

  nacos:
    image: nacos/nacos-server:v3.2.1
    container_name: zxyz-nacos
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    environment:
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: nacos
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_SERVICE_DB_PARAM: "useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
      JVM_XMS: 512m
      JVM_XMX: 512m
      JVM_XMN: 256m
      # Nacos 鉴权配置 — 生产环境必须通过环境变量注入，禁止使用默认密码
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE}
      # Nacos 控制台管理员密码，必须在 .env 中覆盖默认值
      NACOS_PASSWORD: ${NACOS_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${NACOS_PORT:-8848}:8848"
      - "127.0.0.1:${NACOS_CONSOLE_PORT:-8080}:8080"
      # Nacos 3.x gRPC 端口（主端口+1000，客户端自动 +1000 连接，宿主端口须为 NACOS_PORT+1000）
      - "127.0.0.1:${NACOS_GRPC_PORT:-19048}:9848"
    volumes:
      - ${DATA_DIR:-./data}/nacos:/home/nacos/data
      - ${DATA_DIR:-./data}/nacos-logs:/home/nacos/logs
    networks:
      - zxyz-net
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      # Nacos 3.x: console API returns 500; use /next/ (React UI) which returns 200
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/next/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      # Nacos 3.x 首启要连 MySQL 建表/做 v2→v3 迁移（512m 堆），实测远超 120s；
      # 窗口内判死会让 depends_on 的 10 个应用服务全部无法启动
      start_period: 300s
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"

  nacos-log-cleanup:
    image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    container_name: zxyz-nacos-log-cleanup
    restart: unless-stopped
    entrypoint: /bin/sh
    command: -c "while true; do find /logs -name '*.log.*' -mtime +7 -delete 2>/dev/null; find /logs -name 'nacos.log' -size +100M -exec truncate -s 20M {} \\; 2>/dev/null; sleep 3600; done"
    volumes:
      - ${DATA_DIR:-./data}/nacos-logs:/logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "1"

  redis:
    image: redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    container_name: zxyz-redis
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - ${DATA_DIR:-./data}/redis:/data
    networks:
      - zxyz-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  rabbitmq:
    image: rabbitmq:3.13-management-alpine@sha256:606d8c0d6b3c18d1da9afc53bc7cdb2a8d5486df91b5a9830e9e07626c9ae281
    container_name: zxyz-rabbitmq
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - ${DATA_DIR:-./data}/rabbitmq:/var/lib/rabbitmq
    networks:
      - zxyz-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
      # start_period 让冷启动期间的临时失败不消耗 retries，避免被误判为不健康阻塞依赖服务
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  project-service:
    build:
      context: .
      dockerfile: ZXYZdatabaseBack/Dockerfile
      args:
        MODULE: zxyz-project-service
    image: ${IMAGE_PREFIX:-}zxyz-project-service:${APP_IMAGE_TAG:-latest}
    container_name: zxyz-project-service
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        # 为什么：原来只有 limits 没有 reservations，调度器无法预留资源，节点压力下易被驱逐。
        # reservations 取 limits 约 40%（512M→256M、1.0→0.4），且严格小于 limits（compose 不允许 reservations>limits）。
        reservations:
          memory: 256M
          cpus: '0.4'
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nacos:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_OPTS: "-XX:MaxRAMPercentage=75.0 -XX:TieredStopAtLevel=1 -Dfile.encoding=UTF-8"
      SERVER_PORT: ${PROJECT_SERVICE_PORT:-18080}
      APP_INTERNAL_SERVICE_KEY: ${SVC_PROJECT_KEY}
      TZ: Asia/Shanghai
      PROJECT_DATASOURCE_URL: jdbc:mysql://mysql:3306/zxyz_project?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      PROJECT_DATASOURCE_USERNAME: root
      PROJECT_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DATABASE: ${REDIS_DATABASE:-1}
      IM_SERVICE_BASE_URL: http://zxyz-im-service
      EMAIL_SERVICE_BASE_URL: http://zxyz-email-service
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      SHARE_COOKIE_SECRET: ${SHARE_COOKIE_SECRET}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}
      FILE_SERVICE_BASE_URL: http://zxyz-file-service
      TEAM_SERVICE_BASE_URL: http://zxyz-team-service
      USER_SERVICE_BASE_URL: http://zxyz-user-service
      SHARE_SERVICE_BASE_URL: http://zxyz-share-service
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:4173}
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME}
      NACOS_PASSWORD: ${NACOS_PASSWORD}
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-}
      JASYPT_PASSWORD: ${JASYPT_PASSWORD}
      ADMIN_SERVICE_BASE_URL: ${ADMIN_SERVICE_BASE_URL:-http://zxyz-admin-service}
    networks:
      - zxyz-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:${PROJECT_SERVICE_PORT:-18080}/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 4
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"

  im-service:
    build:
      context: .
      dockerfile: ZXYZdatabaseBack/Dockerfile
      args:
        MODULE: zxyz-im-service
    image: ${IMAGE_PREFIX:-}zxyz-im-service:${APP_IMAGE_TAG:-latest}
    container_name: zxyz-im-service
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        # 为什么：原来只有 limits 没有 reservations，调度器无法预留资源，节点压力下易被驱逐。
        # reservations 取 limits 约 40%（512M→256M、1.0→0.4），且严格小于 limits（compose 不允许 reservations>limits）。
        reservations:
          memory: 256M
          cpus: '0.4'
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nacos:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_OPTS: "-XX:MaxRAMPercentage=75.0 -XX:TieredStopAtLevel=1 -Dfile.encoding=UTF-8"
      SERVER_PORT: ${IM_SERVICE_PORT:-18081}
      APP_INTERNAL_SERVICE_KEY: ${SVC_IM_KEY}
      TZ: Asia/Shanghai
      IM_DATASOURCE_URL: jdbc:mysql://mysql:3306/zxyz_im?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      IM_DATASOURCE_USERNAME: root
      IM_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DATABASE: ${REDIS_DATABASE:-2}
      USER_SERVICE_BASE_URL: http://zxyz-user-service
      FILE_SERVICE_BASE_URL: http://zxyz-file-service
      TEAM_SERVICE_BASE_URL: http://zxyz-team-service
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      IM_NETTY_PORT: 19090
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:4173}
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME}
      NACOS_PASSWORD: ${NACOS_PASSWORD}
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-}
      JASYPT_PASSWORD: ${JASYPT_PASSWORD}
      ADMIN_SERVICE_BASE_URL: ${ADMIN_SERVICE_BASE_URL:-http://zxyz-admin-service}
    networks:
      - zxyz-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:${IM_SERVICE_PORT:-18081}/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 4
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"

  email-service:
    build:
      context: .
      dockerfile: ZXYZdatabaseBack/Dockerfile
      args:
        MODULE: zxyz-email-service
    image: ${IMAGE_PREFIX:-}zxyz-email-service:${APP_IMAGE_TAG:-latest}
    container_name: zxyz-email-service
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        # 为什么：与上方 512M/1.0 服务同策略，reservations 取 limits 约 40%（512M→256M、0.5→0.25）。
        reservations:
          memory: 256M
          cpus: '0.25'
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nacos:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_OPTS: "-XX:MaxRAMPercentage=75.0 -XX:TieredStopAtLevel=1 -Dfile.encoding=UTF-8"
      SERVER_PORT: ${EMAIL_SERVICE_PORT:-18082}
      APP_INTERNAL_SERVICE_KEY: ${SVC_EMAIL_KEY}
      # P2-A2 邮件试点：开放 allowed-sources（来源服务名 -> 该来源 SVC_*_KEY）
      SPRING_APPLICATION_JSON: '{"app":{"internal":{"allowed-sources":{"zxyz-user-service":"${SVC_USER_KEY}","zxyz-admin-service":"${SVC_ADMIN_KEY}","zxyz-project-service":"${SVC_PROJECT_KEY}","zxyz-im-service":"${SVC_IM_KEY}","zxyz-file-service":"${SVC_FILE_KEY}","zxyz-team-service":"${SVC_TEAM_KEY}","zxyz-gateway":"${SVC_GATEWAY_KEY}"}}}}'
      TZ: Asia/Shanghai
      EMAIL_DATASOURCE_URL: jdbc:mysql://mysql:3306/zxyz_email?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      EMAIL_DATASOURCE_USERNAME: root
      EMAIL_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DATABASE: ${REDIS_DATABASE:-3}
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USERNAME: ${EMAIL_USERNAME}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_CONFIG_SECRET: ${EMAIL_CONFIG_SECRET}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-true}
      EMAIL_ASYNC: ${EMAIL_ASYNC:-true}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME}
      NACOS_PASSWORD: ${NACOS_PASSWORD}
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-}
      JASYPT_PASSWORD: ${JASYPT_PASSWORD}
      ADMIN_SERVICE_BASE_URL: ${ADMIN_SERVICE_BASE_URL:-http://zxyz-admin-service}
    networks:
      - zxyz-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:${EMAIL_SERVICE_PORT:-18082}/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 4
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"

  share-service:
    build:
      context: .
      dockerfile: ZXYZdatabaseBack/Dockerfile
      args:
        MODULE: zxyz-share-service
    image: ${IMAGE_PREFIX:-}zxyz-share-service:${APP_IMAGE_TAG:-latest}
    container_name: zxyz-share-service
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        # 为什么：与上方 512M/1.0 服务同策略，reservations 取 limits 约 40%（512M→256M、0.5→0.25）。
        reservations:
          memory: 256M
          cpus: '0.25'
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nacos:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_OPTS: "-XX:MaxRAMPercentage=75.0 -XX:TieredStopAtLevel=1 -Dfile.encoding=UTF-8"
      SERVER_PORT: ${SHARE_SERVICE_PORT:-18084}
      APP_INTERNAL_SERVICE_KEY: ${SVC_SHARE_KEY}
      TZ: Asia/Shanghai
      SHARE_DATASOURCE_URL: jdbc:mysql://mysql:3306/zxyz_share?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SHARE_DATASOURCE_USERNAME: root
      SHARE_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DATABASE: ${REDIS_DATABASE:-5}
      FILE_SERVICE_BASE_URL: http://zxyz-file-service
      USER_SERVICE_BASE_URL: http://zxyz-user-service
      TEAM_SERVICE_BASE_URL: http://zxyz-team-service
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      SHARE_COOKIE_SECRET: ${SHARE_COOKIE_SECRET}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME}
      NACOS_PASSWORD: ${NACOS_PASSWORD}
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-}
      JASYPT_PASSWORD: ${JASYPT_PASSWORD}
      ADMIN_SERVICE_BASE_URL: ${ADMIN_SERVICE_BASE_URL:-http://zxyz-admin-service}
    networks:
      - zxyz-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:${SHARE_SERVICE_PORT:-18084}/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 4
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"

  file-service:
    build:
      context: .
      dockerfile: ZXYZdatabaseBack/Dockerfile
      args:
        MODULE: zxyz-file-service
    image: ${IMAGE_PREFIX:-}zxyz-file-service:${APP_IMAGE_TAG:-latest}
    container_name: zxyz-file-service
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
