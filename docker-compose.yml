    image: grafana/loki:3.0.0
    container_name: zxyz-loki
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    volumes:
      - ${DATA_DIR:-./data}/loki:/loki
      - ./deploy/loki-config.yml:/etc/loki/loki-config.yml:ro
    command:
      - -config.file=/etc/loki/loki-config.yml
    networks:
      - zxyz-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  promtail:
    image: grafana/promtail:3.0.0
    container_name: zxyz-promtail
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
    # 为什么：原 promtail 无 healthcheck，编排无法感知其异常。promtail 3.x ready 端点为 /ready，端口 9080（见 deploy/promtail-config.yml server.http_listen_port）。
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9080/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./deploy/promtail-config.yml:/etc/promtail/config.yml:ro
      # 为什么：positions 持久化到宿主机，避免容器重启后从 /tmp 丢失、导致 promtail 重推全部历史日志。路径与 deploy/promtail-config.yml positions.filename 对应。
      - ./data/promtail:/data/promtail
    networks:
      - zxyz-net
    depends_on:
      loki:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # 监控栈（P1-D3）：Prometheus 抓取各服务 micrometer /actuator/prometheus 端点，
  # Alertmanager 接告警，Grafana 做可视化。三者仅绑定 127.0.0.1（与 nacos/rabbitmq 管理端口一致），
  # 生产经宿主机 Nginx 反代并加来源限制，切勿直接暴露公网。
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: zxyz-prometheus
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    # 为什么：挂载配置与规则为只读，数据卷持久化 TSDB，避免容器重建丢失历史指标。
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      # 仅绑定回环地址，避免监控数据裸奔到公网
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - zxyz-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: zxyz-alertmanager
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    volumes:
      - ./deploy/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    networks:
      - zxyz-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9093/-/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  grafana:
    image: grafana/grafana:11.1.0
    container_name: zxyz-grafana
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    # 为什么：安全红线——Grafana 默认 admin/admin 极危险；缺失 GRAFANA_ADMIN_PASSWORD 直接启动失败（:? 硬失败），
    # 严禁回退弱默认。GRAFANA_ADMIN_PASSWORD 已由 init-secrets.sh 生成，validate-env 亦拦截 CHANGE_ME 占位符。
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD 必须设置，禁止弱默认 admin}
      GF_SERVER_HTTP_PORT: "3000"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    networks:
      - zxyz-net
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

# 命名数据卷：compose 自动创建，用于监控组件持久化
volumes:
  prometheus_data:
  grafana_data:

networks:
  zxyz-net:
    driver: bridge
# 触发 CI 全量构建
