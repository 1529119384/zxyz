services:
  mysql:
    image: mysql:8.4.0-oraclelinux8
    container_name: zxyz-mysql
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - ${DATA_DIR:-./data}/mysql:/var/lib/mysql
      - ./sql/00-init-zxyz.sh:/docker-entrypoint-initdb.d/00-init-zxyz.sh:ro
      - ./sql/schema_project.sql:/docker-entrypoint-sql/schema_project.sql:ro
      - ./sql/schema_im.sql:/docker-entrypoint-sql/schema_im.sql:ro
      - ./sql/schema_email.sql:/docker-entrypoint-sql/schema_email.sql:ro
      - ./sql/schema_share.sql:/docker-entrypoint-sql/schema_share.sql:ro
      - ./sql/schema_file.sql:/docker-entrypoint-sql/schema_file.sql:ro
      - ./sql/schema_team.sql:/docker-entrypoint-sql/schema_team.sql:ro
      - ./sql/schema_user.sql:/docker-entrypoint-sql/schema_user.sql:ro
      - ./sql/schema_audit.sql:/docker-entrypoint-sql/schema_audit.sql:ro
      - ./sql/schema_nacos.sql:/docker-entrypoint-sql/schema_nacos.sql:ro
    networks:
      - zxyz-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"

  nacos:
    image: nacos/nacos-server:v3.2.1
    container_name: zxyz-nacos
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    environment:
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: nacos
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_SERVICE_DB_PARAM: "useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
      JVM_XMS: 512m
      JVM_XMX: 512m
      # Nacos 鉴权配置 — 生产环境必须通过环境变量注入，禁止使用默认密码
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:-serverIdentity}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:-security}
      # Nacos 控制台管理员密码，必须在 .env 中覆盖默认值
      NACOS_PASSWORD: ${NACOS_PASSWORD:-CHANGE_ME_NACOS}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${NACOS_PORT:-8848}:8848"
    volumes:
      - ${DATA_DIR:-./data}/nacos:/home/nacos/data
    networks:
      - zxyz-net
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8848/nacos/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"

  redis:
    image: redis:7.4-alpine
    container_name: zxyz-redis
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - ${DATA_DIR:-./data}/redis:/data
    networks:
      - zxyz-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: zxyz-rabbitmq
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - ${DATA_DIR:-./data}/rabbitmq:/var/lib/rabbitmq
    networks:
      - zxyz-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  project-service:
    build:
      context: .
      dockerfile: ZXYZdatabaseBack/Dockerfile
      args:
        MODULE: zxyz-project-service
    image: ${DOCKERHUB_PREFIX:-}zxyz-project-service:${APP_IMAGE_TAG:-latest}
    container_name: zxyz-project-service
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nacos:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: ${SERVER_PORT:-18080}
      TZ: Asia/Shanghai
      PROJECT_DATASOURCE_URL: jdbc:mysql://mysql:3306/zxyz_project?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      PROJECT_DATASOURCE_USERNAME: root
      PROJECT_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DATABASE: ${REDIS_DATABASE:-1}
      IM_SERVICE_BASE_URL: http://zxyz-im-service
      EMAIL_SERVICE_BASE_URL: http://zxyz-email-service
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      SHARE_COOKIE_SECRET: ${SHARE_COOKIE_SECRET}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}
      FILE_SERVICE_BASE_URL: http://zxyz-file-service
      TEAM_SERVICE_BASE_URL: http://zxyz-team-service
      USER_SERVICE_BASE_URL: http://zxyz-user-service
      SHARE_SERVICE_BASE_URL: http://zxyz-share-service
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: nacos
      NACOS_PASSWORD: ${NACOS_PASSWORD:-CHANGE_ME_NACOS}
    networks:
      - zxyz-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:${SERVER_PORT:-18080}/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 90s
    logging:
