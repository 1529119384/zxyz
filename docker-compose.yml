      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DATABASE: ${REDIS_DATABASE:-0}
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-}
      JASYPT_PASSWORD: ${JASYPT_PASSWORD}
      ADMIN_SERVICE_BASE_URL: ${ADMIN_SERVICE_BASE_URL:-http://zxyz-admin-service}
      IM_WEBSOCKET_URI: ${IM_WEBSOCKET_URI:-ws://im-service:${IM_NETTY_PORT:-19090}}
      MAX_REQUEST_SIZE: ${MAX_REQUEST_SIZE:-512MB}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?缺少 CORS_ALLOWED_ORIGINS，请先运行 scripts/init-secrets.sh 或手工填写真实域名}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    networks:
      - zxyz-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:${GATEWAY_PORT:-18000}/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"

  frontend-nginx:
    build:
      context: .
      dockerfile: ZXYZdatabaseFront/Dockerfile
    image: ${IMAGE_PREFIX:-}zxyz-frontend-nginx:${APP_IMAGE_TAG:-latest}
    container_name: zxyz-frontend-nginx
    restart: unless-stopped
    environment:
      # nginx CSP connect-src 需要 OSS 域名，启动时 envsubst 注入。
      #
      # ⚠️ 2026-10-03 修复（审计 I-18）：原来是
      #     `${OSS_PUBLIC_BASE_URL:-https://zxyz-database.oss-cn-shenzhen.aliyuncs.com}`
      #   —— 在 compose 里给 CSP 注入变量写死了默认桶域名，直接违反 CLAUDE.md 的
      #   「Nginx CSP 用 envsubst 模板化，**勿硬编码 OSS 域名**」。
      #   失败模式尤其坏：它是「静默放行一个错误域名」而不是「响亮失败」——
      #   validate-env 的 OSS×CSP 一致性检查能拦住常规部署，但绕过校验手工 `docker compose up`
      #   时，CSP 会放行那个硬编码域名，而实际上传域名是另一个 ⇒ 浏览器直接拦掉上传，
      #   前端只报 "network error"，极难排查（validate-env.sh 的 _oss_csp_check 注释里记的
      #   就是这条真实事故）。
      #   ⇒ 默认值改**空串**，并把 fail-closed 下沉到渲染层：
      #     deploy/nginx/entrypoint.sh 在值为空时**直接 exit 1**，容器起不来（响亮失败），
      #     而不是渲染出一份带着错误域名的 CSP。
      #   注意：compose 用 `${VAR:-}`（空默认）而非 `${VAR:?}` —— 后者会在**任何**
      #   `docker compose` 子命令（含 `config`/`ps`/`down`）上报插值错误，把「前端配置漏填」
      #   升级成「整台服务器连停止/查看都做不到」。定位是「改配置的人立刻知道」，
      #   不是「运维在故障时被 compose 锁死」，故把硬失败放在真正消费该值的 entrypoint。
      OSS_PUBLIC_BASE_URL: ${OSS_PUBLIC_BASE_URL:-}
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
    depends_on:
      gateway:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    ports:
      - "${HTTP_PORT:-80}:80"
    networks:
      - zxyz-net

# ---------------------------------------------------------------------------
# 【可观测性栈已于 2026-09-18 迁出本文件】（N-4 方案 A）
#   loki / promtail / prometheus / alertmanager / grafana 已移入
#   **docker-compose.observability.yml**（带 profiles: ["observability"]）。
#
#   为什么迁出：这 5 个服务在生产服务器上**从未被创建过**（连 Exited 容器都没有），
#   但它们写在本文件里 ⇒ 任何一次「升级它们的基础镜像」都会置 DOCKER_CFG=true
#   ⇒ 连带把 11 个业务服务 + frontend-nginx 全量重建一遍 = 纯付成本、零收益。
#   迁出后本文件的语义变干净：**只描述真实在跑的栈**。
#
#   ⇒ 本文件**不再**包含任何 observability 服务；其镜像升级请走
#     DEPLOYMENT.md《infra 手工升级手册》（手工运维，不随 CI 部署）。
# ---------------------------------------------------------------------------

networks:
  zxyz-net:
    driver: bridge
    # 🔒【C3 第 1 步「钉死子网」：已于 2026-09-15 维护窗口执行完毕，子网已钉死为 172.19.0.0/16】
    #   （2026-09-14 实测事故：run 34843948467）
    #
    #   【为什么要钉】不钉时 Docker 动态分配网段 ⇒ 网络一重建就可能换段；而最小权限 DB 账户
    #     一旦把 host 从 @'%' 收窄到网段（C3 第 2 步），换段即全站连不上库。目标值与线上现状一致：
    #     `zxyz_zxyz-net` = 172.19.0.0/16（网关 172.19.0.1）。写法即下方被注释掉的 ipam 块。
    #
    #   【为什么不能直接写在这里】compose 会把网络配置哈希记在网络标签
    #     `com.docker.compose.config-hash` 上；**声明 ipam 会改变该哈希** ⇒ 每次 `compose up`
    #     都判定「网络需重建」⇒ 先停掉 11 个业务容器并把它们从网络断开，再尝试 `docker network rm`。
    #     而 mysql / redis / rabbitmq / nacos 仍挂在该网络上（部署固定用 `--no-deps`，从不重建 infra）
    #     ⇒ 删除网络失败 ⇒ compose 中止。**实测后果：11 个业务容器停机且网络挂载为空 ⇒ 全站不可用**
    #     （容器 Up 但解析不到 mysql/gateway 等，frontend-nginx 直接 crash-loop）。
    #     注意：钉的值虽与现状一致，但「哈希不同」这一点与值无关 —— 行为**并不**等价。
    #
    #   【窗口里怎么做】全栈重建，让 compose 自己创建网络（带上正确哈希）：
    #       cd /www/zxyz && docker compose down          # 全栈停止并移除容器（数据在 volume 内，不受影响）
    #       docker network rm zxyz_zxyz-net              # 此时已无 endpoint，删除成功
    #       放开下面的 ipam 块 → docker compose up -d    # compose 重建网络（含子网）+ 全部容器
    #     顺序不可颠倒：先 up 只会再次撞上「网络有 active endpoints」而失败。
    #
    #   【本行下方的 ipam 块已于 2026-09-15 维护窗口放开并生效】—— 值与既有动态分配结果一致（172.19.0.0/16），故未引起 IP 漂移；最小权限 DB 账户 host 已随之收窄到 172.19.%。
    ipam:
      config:
        - subnet: 172.19.0.0/16
    # 注：子网已钉死。此后任何 ipam 改动都必须重复「维护窗口 + down / network rm / up」全栈重建，不可随普通部署上线。
