# =============================================================================
# user-service 专用配置
# =============================================================================
# 敏感值使用 ENC() 格式存储，jasypt-spring-boot-starter 启动时自动解密。
# 加密命令（⚠️ algorithm 必须是 PBE 算法名，写成 AES/GCM/NoPadding 会在 jasypt 1.9.3 上初始化即失败）:
#   java -cp jasypt-1.9.3.jar org.jasypt.intf.cli.JasyptPBEStringEncryptionCLI \
#     input="your-secret" password="$JASYPT_PASSWORD" \
#     algorithm=PBEWITHHMACSHA512ANDAES_256 \
#     ivGeneratorClassName=org.jasypt.iv.RandomIvGenerator \
#     stringOutputType=base64
# CLI 输出的是裸 Base64（在 "----OUTPUT---" 下一空行后），须自行包成 ENC(...)
# 生成后必须用 JasyptPBEStringDecryptionCLI 解密自检，详见 docs/jasypt-key-management.md
server:
  port: ${SERVER_PORT:18083}

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${USER_DATASOURCE_URL}
    username: ${USER_DATASOURCE_USERNAME}
    password: ${USER_DATASOURCE_PASSWORD}

app:
  verification:
    # 【安全默认】回显验证码 = 把验证码直接返回给调用方，属「有则必关」。
    # 真正生效的开关是 docker-compose.yml 里 user-service 的 VERIFICATION_RETURN_CODE
    # （容器始终注入该环境变量，会覆盖本处默认值）；本地 dev 直跑 JVM 时由
    # scripts/run-local.sh 显式导出 true。本处仅作兜底默认，保持三处口径一致即可。
    return-code-in-response: ${VERIFICATION_RETURN_CODE:false}
    # 验证码摘要 pepper（HMAC-SHA256 密钥，绝不落库；库里只存摘要）。
    # 缺省回退 Jasypt 主密钥；未配置或为公开占位值则服务启动失败（fail-closed）。
    # 本文件不自动生效，改动需手动 nacos-config/import.sh。
    code-pepper: ${VERIFY_CODE_PEPPER:${JASYPT_PASSWORD:}}
    # 注意：allow-insecure-pepper / verify-code-allow-insecure-pepper 刻意不写在本文件里。
    # 它默认 false；只有 application-dev.yml / application-test.yml 显式置 true。
    # 若把它写进本文件（Nacos 优先级高于 jar 内 application.yml），会让 dev 直跑立刻起不来。
