# =============================================================================
# file-service 专用配置
# =============================================================================
# 敏感值使用 ENC() 格式存储，jasypt-spring-boot-starter 启动时自动解密。
# 加密命令（⚠️ algorithm 必须是 PBE 算法名，写成 AES/GCM/NoPadding 会在 jasypt 1.9.3 上初始化即失败）:
#   java -cp jasypt-1.9.3.jar org.jasypt.intf.cli.JasyptPBEStringEncryptionCLI \
#     input="your-secret" password="$JASYPT_PASSWORD" \
#     algorithm=PBEWITHHMACSHA512ANDAES_256 \
#     ivGeneratorClassName=org.jasypt.iv.RandomIvGenerator \
#     stringOutputType=base64
# CLI 输出的是裸 Base64（在 "----OUTPUT---" 下一空行后），须自行包成 ENC(...)
# 生成后必须用 JasyptPBEStringDecryptionCLI 解密自检，详见 docs/jasypt-key-management.md
server:
  port: ${SERVER_PORT:18085}

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${FILE_DATASOURCE_URL}
    username: ${FILE_DATASOURCE_USERNAME}
    password: ${FILE_DATASOURCE_PASSWORD}

app:
  file-object-delete:
    enabled: true
    batch-size: 20
    initial-delay-ms: 30000
    retry-fixed-delay-ms: 60000
  team-service:
    base-url: ${TEAM_SERVICE_BASE_URL:http://zxyz-team-service}
  project-service:
    base-url: ${PROJECT_SERVICE_BASE_URL:http://zxyz-project-service}
  share-service:
    base-url: ${SHARE_SERVICE_BASE_URL:http://zxyz-share-service}
  storage:
    default-provider: ${STORAGE_DEFAULT_PROVIDER:oss}
    provider:
      oss:
        enabled: ${STORAGE_OSS_ENABLED:true}
      local:
        enabled: ${STORAGE_LOCAL_ENABLED:false}
        base-path: ${LOCAL_STORAGE_PATH:./local-storage}
