# =============================================================================
# 共享静态配置（所有服务共用）
# =============================================================================
# 敏感值使用 ENC() 格式存储，jasypt-spring-boot-starter 启动时自动解密。
# 加密命令（⚠️ algorithm 必须是 PBE 算法名，写成 AES/GCM/NoPadding 会在 jasypt 1.9.3 上初始化即失败）:
#   java -cp jasypt-1.9.3.jar org.jasypt.intf.cli.JasyptPBEStringEncryptionCLI \
#     input="your-secret" password="$JASYPT_PASSWORD" \
#     algorithm=PBEWITHHMACSHA512ANDAES_256 \
#     ivGeneratorClassName=org.jasypt.iv.RandomIvGenerator \
#     stringOutputType=base64
# CLI 输出的是裸 Base64（在 "----OUTPUT---" 下一空行后），须自行包成 ENC(...)
# 生成后必须用 JasyptPBEStringDecryptionCLI 解密自检，详见 docs/jasypt-key-management.md
#
# 示例:
#   spring.data.redis.password: ENC(encrypted_redis_password)
#   app.internal-service-token: ENC(encrypted_token)

# 数据库连接池
spring:
  datasource:
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:20}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT:300000}
      max-lifetime: ${HIKARI_MAX_LIFETIME:600000}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:30000}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:3s}
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:8}
          max-idle: ${REDIS_POOL_MAX_IDLE:8}
          min-idle: ${REDIS_POOL_MIN_IDLE:2}

# Sa-Token（所有服务共享，与 application-common.yml 保持一致）
sa-token:
  token-name: satoken
  is-write-cookie: false
  token-storage-mode: redis
  timeout: 43200
  active-timeout: 1800
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: true
  is-read-cookie: true
  dynamic-active-timeout: true
  redis:
    prefix: ${SA_TOKEN_REDIS_PREFIX:satoken:}

# 服务间调用地址 —— 2026-10-03 删除顶层 `services:` 块（审计 I-8）
# -----------------------------------------------------------------------------
# 原内容（8 个键，已删除）：
#   services.user-service.base-url / team-service / file-service / im-service /
#   email-service / project-service / share-service / admin-service
#
# 为什么删：这 8 个键是**死键**，没有任何消费方。
#   · 全仓 grep `services.` 在 Java/YAML 里 **0 命中**（唯一的 @ConfigurationProperties
#     前缀是 `app.*-service.base-url`，见 zxyz-common/application-common.yml:170-186）。
#   · check-nacos-config-sync.py 把这 8 个键逐条判为 [EXTRA]（nacos 有、代码里没有）。
#   危害：真源里躺着无人消费的键，会让后来者误以为改它能生效 ——
#   例如改 `services.user-service.base-url` 想切流量，实际什么都不会发生。
#   import.sh 的「字面量机密护栏」拦不住这类漂移（它只看值像不像机密）。
#
# 行为不变（已核对）：运行期真正生效的是
#   · application-common.yml 的 `app.<svc>-service.base-url: ${<SVC>_SERVICE_BASE_URL:...}`
#   · compose 各服务 environment 注入的 `*_SERVICE_BASE_URL`
#   两者都不经过本文件，故删除这 8 个键**不改变任何运行期取值**。

# 服务间鉴权（注意：必须用扁平格式 app.internal-service-token，不能嵌套！）
# 原因：Java 端 @ConfigurationProperties(prefix="app") 绑定扁平字段 internalServiceToken
# 生产环境替换为: app.internal-service-token: ENC(encrypted_value)
app:
  internal-service-token: ${INTERNAL_SERVICE_TOKEN}
  # IM Netty 启动期绑定（**消费方是 @Value，不是 @ConfigurationProperties**）：
  #   zxyz-im-service/.../infrastructure/netty/ImNettyServer.java:45
  #     @Value("${app.im.ws.max-content-length:65536}") int maxContentLength
  # 静态配置：Netty 通道初始化时一次性读取，热更新无效，故置于 static 配置。
  # ⚠️ 本键会被 check-nacos-config-sync.py 判为 [EXTRA]（该脚本只扫 yml，看不到 @Value）
  #    —— 这是**已核实**的假阳性：消费方确实存在，勿再"清理"它。
  im:
    ws:
      max-content-length: 65536

# 服务间鉴权（share-service）—— 2026-10-03 删除 `share.team-service.*`（审计 I-8）
# -----------------------------------------------------------------------------
# 原内容（已删除）：share.team-service.internal-service-token: ${INTERNAL_SERVICE_TOKEN}
#
# 为什么删：**键路径错了，从来没被绑定过**。share-service 的绑定前缀是
#   `app.share.team-service`（见 zxyz-share-service/.../config/TeamServiceProperties.java:6
#    `@ConfigurationProperties(prefix = "app.share.team-service")`），
#   而这里写的是顶层 `share.team-service`（缺 `app.` 前缀）⇒ 永不匹配 ⇒ 死键。
#   （被删掉的注释自身把前缀写成 `share.team-service`，与代码不一致 ——
#     这正是该键被"照抄注释"写进真源、却始终无人消费的原因。）
#
# 行为不变（已核对）：真实取值来自
#   · zxyz-share-service/.../application-prod.yml:17-19
#       app.share.team-service.internal-service-token: ${INTERNAL_SERVICE_TOKEN}
#       app.share.team-service.base-url: ${TEAM_SERVICE_BASE_URL:http://zxyz-team-service}
#   · application-common.yml:174 app.team-service.internal-service-token（其他服务）
#   均不经过本文件。

# Resilience4j
resilience4j:
  retry:
    instances:
      serviceClient:
        max-attempts: 3
        wait-duration: 500ms
  circuitbreaker:
    instances:
      serviceClient:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
