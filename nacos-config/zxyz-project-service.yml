# =============================================================================
# project-service 专用配置
# =============================================================================
# 敏感值使用 ENC() 格式存储，jasypt-spring-boot-starter 启动时自动解密。
# 加密命令（⚠️ algorithm 必须是 PBE 算法名，写成 AES/GCM/NoPadding 会在 jasypt 1.9.3 上初始化即失败）:
#   java -cp jasypt-1.9.3.jar org.jasypt.intf.cli.JasyptPBEStringEncryptionCLI \
#     input="your-secret" password="$JASYPT_PASSWORD" \
#     algorithm=PBEWITHHMACSHA512ANDAES_256 \
#     ivGeneratorClassName=org.jasypt.iv.RandomIvGenerator \
#     stringOutputType=base64
# CLI 输出的是裸 Base64（在 "----OUTPUT---" 下一空行后），须自行包成 ENC(...)
# 生成后必须用 JasyptPBEStringDecryptionCLI 解密自检，详见 docs/jasypt-key-management.md
server:
  port: ${SERVER_PORT:18080}

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${PROJECT_DATASOURCE_URL}
    username: ${PROJECT_DATASOURCE_USERNAME}
    password: ${PROJECT_DATASOURCE_PASSWORD}

app:
  # ⚠️ app.performance.time-aspect-enabled 刻意【不在】此声明。
  # 它是「按 profile 分叉」的键：application.yml=true（所有 profile）/ application-prod.yml=${TIME_ASPECT_ENABLED:false}。
  # Nacos 单文件无法按 profile 分叉，且 Nacos 优先级高于 jar 内 yml ⇒ 在此写死 true 会把 prod 的 false 顶掉
  # （AOP 计时切面全开），属「一导入就改变行为」。留给代码侧按 profile 决定；
  # 线上确需开关时用环境变量 TIME_ASPECT_ENABLED。
  file-object-delete:
    enabled: true
    batch-size: 20
    initial-delay-ms: 30000
    retry-fixed-delay-ms: 60000
