# =============================================================================
# share-service 专用配置
# =============================================================================
# 敏感值使用 ENC() 格式存储，jasypt-spring-boot-starter 启动时自动解密。
# 加密命令: java -cp jasypt-1.9.3.jar org.jasypt.intf.cli.JasyptPBEStringEncryptionCLI \
#   algorithm=AES/GCM/NoPadding password=$JASYPT_PASSWORD input="your-secret"
# 输出格式: ENC(encrypted_value)
server:
  port: ${SERVER_PORT:18084}

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SHARE_DATASOURCE_URL}
    username: ${SHARE_DATASOURCE_USERNAME}
    password: ${SHARE_DATASOURCE_PASSWORD}

app:
  share:
    cookie-secret: ${SHARE_COOKIE_SECRET}
