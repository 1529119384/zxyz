# admin-service 专用配置
spring:
  application:
    name: zxyz-admin-service

server:
  port: 18088

config:
  datasource:
    url: jdbc:mysql://${CONFIG_DB_HOST:mysql}:3306/zxyz_config?useUnicode=true&characterEncoding=UTF-8
    username: ${CONFIG_DB_USERNAME:root}
    password: ${CONFIG_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2

spring:
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
