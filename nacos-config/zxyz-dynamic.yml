# =============================================================================
# 共享动态配置（所有服务共用，可热更新）
# =============================================================================
# 敏感值使用 ENC() 格式存储，jasypt-spring-boot-starter 启动时自动解密。
# 加密命令（⚠️ algorithm 必须是 PBE 算法名，写成 AES/GCM/NoPadding 会在 jasypt 1.9.3 上初始化即失败）:
#   java -cp jasypt-1.9.3.jar org.jasypt.intf.cli.JasyptPBEStringEncryptionCLI \
#     input="your-secret" password="$JASYPT_PASSWORD" \
#     algorithm=PBEWITHHMACSHA512ANDAES_256 \
#     ivGeneratorClassName=org.jasypt.iv.RandomIvGenerator \
#     stringOutputType=base64
# CLI 输出的是裸 Base64（在 "----OUTPUT---" 下一空行后），须自行包成 ENC(...)
# 生成后必须用 JasyptPBEStringDecryptionCLI 解密自检，详见 docs/jasypt-key-management.md
#
# 示例:
#   app.internal-service-token: ENC(encrypted_token)

# 域名、访问、Cookie（配置键与现有 Java 代码一致，零代码改动）
app:
  # ⚠️ app.cors.allowed-origins 刻意【不在】此声明（2026-09-13, D2）。
  # 它是「按 profile 分叉」的键，Nacos 单文件无法按 profile 分叉：
  #   application-common.yml  = ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}  ← 本地/缺省宽松档
  #   各 application-prod.yml = ${CORS_ALLOWED_ORIGINS}                                              ← 缺值即启动失败
  # 本文件若声明任何一侧，都会把另一侧顶掉（Nacos 优先级高于 jar 内 yml）。
  # 需要改放行来源时：改 .env 的 CORS_ALLOWED_ORIGINS（须与 FRONTEND_BASE_URL 同源）后重建容器。
  # 该约束由 scripts/check-nacos-config-sync.py 机器校验（[FORK]/[DIFF] 会阻断 CI）。
  # —— 规则：Nacos 只声明「所有非 dev profile 同值」的键。
  # Cookie + Token 超时配置（secure 默认 false —— 当前站点为 IP 直连 HTTP，Secure Cookie
  # 在 HTTP 下不会被浏览器回传，置 true 会直接导致登录失效）。
  # ⚠️ 一旦启用 HTTPS（见 DEPLOYMENT.md「TLS 终止」章节：容器内 nginx 443 + 证书挂载），
  #    必须在 .env 设 AUTH_COOKIE_SECURE=true，否则会话 Cookie 缺失 Secure 属性可被嗅探。
  # 三处默认值（本文件 / docker-compose.yml / application-common.yml）已统一为 false，
  # 消除此前 app=true 与 nacos/compose=false 的「双源冲突」。
  # 绑定路径：ServiceProperties.auth.*（secure/domain 由本文件控制；timeout 由本文件 + 环境变量控制）
  # 注意：token-timeout-seconds / long-lived-timeout-seconds 在 Nacos 热更新清单内，
  #       运维可在 Nacos 控制台直接修改，无需重建容器（下次登录用户的新会话拿到新 timeout）。
  auth:
    secure: ${AUTH_COOKIE_SECURE:false}
    domain: ${AUTH_COOKIE_DOMAIN:}
    token-timeout-seconds: ${AUTH_TOKEN_TIMEOUT:43200}
    long-lived-timeout-seconds: ${AUTH_LONG_LIVED_TIMEOUT:604800}
  # 验证码冷却（绑定路径：ServiceProperties.email.verifyCode.cooldownSeconds）
  email:
    verify-code:
      cooldown-seconds: ${EMAIL_VERIFY_COOLDOWN:60}
    max-retry-count: 4
  # 审计日志保留天数（绑定路径：AuditProperties.retentionDays，prefix="app.audit"）
  audit:
    retention-days: 90
  # 头像上传大小上限（绑定路径：AvatarProperties.maxSizeBytes，prefix="app.avatar"）
  avatar:
    max-size-bytes: 5242880
  # 缓存 TTL（绑定路径：CacheProperties.*，prefix="app.cache"）
  cache:
    default-ttl-minutes: 30
    project-access-ttl-minutes: 10
    storage-usage-ttl-seconds: 10
    team-permission-ttl-minutes: 5
  # 文件服务（绑定路径：FileProperties.*，prefix="app.file"）
  file:
    copy:
      max-nodes-per-tx: 500
    upload:
      allowed-extensions: '["pdf","doc","docx","xls","xlsx","ppt","pptx","txt","csv","rtf","png","jpg","jpeg","gif","bmp","webp","ico","zip","rar","7z","tar","gz","mp3","mp4","avi","mov","wav","md","json","xml","yaml","yml","css","ts","vue","java","py","go","sql","sh","log","ini","conf","toml","odt","ods","odp","key","epub"]'
      blocked-extensions: '[".exe",".bat",".cmd",".scr",".pif",".com",".js",".vbs",".vbe",".ps1",".psm1",".msi",".wsf",".wsh",".hta",".cpl",".msc",".reg"]'
      max-size-bytes: 524288000
  # IM 服务（绑定路径：ImProperties.*，prefix="app.im"）
  im:
    message:
      max-text-length: 5000
      recall-window-seconds: 120
    ws:
      ticket-ttl-seconds: 30
  # 限流（绑定路径：RateLimitProperties.*，prefix="app.rate-limit"）
  rate-limit:
    login:
      ip-per-minute: 20
      username-per-minute: 5
    register:
      ip-per-hour: 3
    share:
      attempts-per-window: 10
      window-minutes: 5
  # 团队服务（绑定路径：TeamProperties.*，prefix="app.team"）
  team:
    default-max-members: 100
    default-storage-limit-bytes: 107374182400
    min-password-length: 8
  # share-service 专用（绑定路径：ShareProperties.frontendBaseUrl，prefix="app.share"）
  # 同上：与本服务 application-prod.yml 保持逐字一致（裸 ${FRONTEND_BASE_URL}），
  # localhost 兜底只属于 application-dev.yml，绝不进 Nacos。
  share:
    frontend-base-url: ${FRONTEND_BASE_URL}
